<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="35" y="38" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="25.5" font-weight="bold">S54 – Équipe B – Cercles et cordes</text>
<rect x="35" y="75" width="1053" height="90" rx="12" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="55" y="108" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">BUT</text>
<text x="125" y="108" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.7" font-weight="bold">Créer une composition de quatre cercles dont les positions répondent à des relations</text>
<text x="125" y="126" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.7" font-weight="bold">précises.</text>
<text x="55" y="145" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">CADRE</text>
<text x="125" y="145" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">16 × 16 cm · tracés au crayon avant validation</text>
<rect x="35" y="195" width="670" height="385" rx="12" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="370" y="228" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">LES 6 CONTRAINTES OBLIGATOIRES</text>
<circle cx="67" cy="267" r="13" fill="#f4f4f4" stroke="#222" stroke-width="1"/>
<text x="67" y="272" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">1</text>
<text x="95" y="258" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal">Tracer exactement 4 cercles de rayons 2 cm, 2,5 cm, 3 cm et 4</text>
<text x="95" y="275" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal">cm.</text>
<circle cx="67" cy="316" r="13" fill="#f4f4f4" stroke="#222" stroke-width="1"/>
<text x="67" y="321" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">2</text>
<text x="95" y="307" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal">Utiliser au moins 2 centres différents.</text>
<circle cx="67" cy="365" r="13" fill="#f4f4f4" stroke="#222" stroke-width="1"/>
<text x="67" y="370" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">3</text>
<text x="95" y="356" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal">Faire en sorte qu’une paire de cercles ait exactement 2</text>
<text x="95" y="373" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal">points communs.</text>
<circle cx="67" cy="414" r="13" fill="#f4f4f4" stroke="#222" stroke-width="1"/>
<text x="67" y="419" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">4</text>
<text x="95" y="405" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal">Placer un cercle entièrement à l’intérieur d’un autre.</text>
<circle cx="67" cy="463" r="13" fill="#f4f4f4" stroke="#222" stroke-width="1"/>
<text x="67" y="468" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">5</text>
<text x="95" y="454" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal">Tracer un diamètre dans le cercle de rayon 4 cm.</text>
<circle cx="67" cy="512" r="13" fill="#f4f4f4" stroke="#222" stroke-width="1"/>
<text x="67" y="517" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">6</text>
<text x="95" y="503" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal">Tracer une corde qui n’est pas un diamètre.</text>
<rect x="735" y="195" width="353" height="225" rx="12" fill="#f7f7f7" stroke="#222" stroke-width="1.3"/>
<text x="911" y="228" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">PREUVES À PRÉPARER</text>
<text x="765" y="272" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold">1.</text>
<text x="790" y="272" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.4" font-weight="bold">mesurer les 4 rayons</text>
<text x="765" y="327" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold">2.</text>
<text x="790" y="327" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.4" font-weight="bold">montrer les 2 points</text>
<text x="790" y="344" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.4" font-weight="bold">d’intersection</text>
<text x="765" y="382" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold">3.</text>
<text x="790" y="382" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.4" font-weight="bold">mesurer le diamètre et la</text>
<text x="790" y="399" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.4" font-weight="bold">corde</text>
<rect x="735" y="445" width="353" height="135" rx="12" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="911" y="475" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">PAR QUOI COMMENCER ?</text>
<text x="760" y="510" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.3" font-weight="bold">Tracez d’abord le cercle de rayon 4</text>
<text x="760" y="527" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.3" font-weight="bold">cm, puis choisissez où placer le</text>
<text x="760" y="544" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.3" font-weight="bold">petit cercle intérieur.</text>
<rect x="35" y="610" width="1053" height="110" rx="11" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="55" y="640" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">AVANT LA COULEUR</text>
<text x="225" y="640" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.1" font-weight="bold">☐ 6 contraintes contrôlées   ☐ 3 preuves écrites   ☐ grille revenue</text>
<text x="55" y="678" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="bold">Titre de la création : ______________________________________________________________________</text>
<text x="40" y="775" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="bold">Une création différente de celle des autres peut être parfaitement correcte.</text>
</svg>