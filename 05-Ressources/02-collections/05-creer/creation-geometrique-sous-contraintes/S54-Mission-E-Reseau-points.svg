<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="35" y="38" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="25.5" font-weight="bold">S54 – Équipe E – Réseau de points</text>
<rect x="35" y="75" width="1053" height="90" rx="12" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="55" y="108" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">BUT</text>
<text x="125" y="108" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.7" font-weight="bold">Relier des points imposés pour créer une figure complexe mais vérifiable.</text>
<text x="55" y="145" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">CADRE</text>
<text x="125" y="145" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">16 × 16 cm · tracés au crayon avant validation</text>
<rect x="35" y="195" width="670" height="385" rx="12" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="370" y="228" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">LES 6 CONTRAINTES OBLIGATOIRES</text>
<circle cx="67" cy="267" r="13" fill="#f4f4f4" stroke="#222" stroke-width="1"/>
<text x="67" y="272" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">1</text>
<text x="95" y="258" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal">Utiliser exactement 12 segments.</text>
<circle cx="67" cy="316" r="13" fill="#f4f4f4" stroke="#222" stroke-width="1"/>
<text x="67" y="321" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">2</text>
<text x="95" y="307" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal">Faire passer la figure par au moins 10 des 16 points imposés.</text>
<circle cx="67" cy="365" r="13" fill="#f4f4f4" stroke="#222" stroke-width="1"/>
<text x="67" y="370" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">3</text>
<text x="95" y="356" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal">Créer au moins 2 intersections situées ailleurs que sur les</text>
<text x="95" y="373" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal">16 points.</text>
<circle cx="67" cy="414" r="13" fill="#f4f4f4" stroke="#222" stroke-width="1"/>
<text x="67" y="419" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">4</text>
<text x="95" y="405" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal">Faire apparaître au moins 2 paires de segments parallèles.</text>
<circle cx="67" cy="463" r="13" fill="#f4f4f4" stroke="#222" stroke-width="1"/>
<text x="67" y="468" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">5</text>
<text x="95" y="454" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal">Faire apparaître au moins 2 paires de segments de même</text>
<text x="95" y="471" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal">longueur.</text>
<circle cx="67" cy="512" r="13" fill="#f4f4f4" stroke="#222" stroke-width="1"/>
<text x="67" y="517" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">6</text>
<text x="95" y="503" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal">Faire apparaître un polygone fermé de 5 côtés.</text>
<rect x="735" y="195" width="353" height="225" rx="12" fill="#f7f7f7" stroke="#222" stroke-width="1.3"/>
<text x="911" y="228" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">PREUVES À PRÉPARER</text>
<text x="765" y="272" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold">1.</text>
<text x="790" y="272" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.4" font-weight="bold">compter les 12 segments</text>
<text x="765" y="327" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold">2.</text>
<text x="790" y="327" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.4" font-weight="bold">entourer les intersections</text>
<text x="790" y="344" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.4" font-weight="bold">hors points</text>
<text x="765" y="382" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold">3.</text>
<text x="790" y="382" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.4" font-weight="bold">mesurer les paires de</text>
<text x="790" y="399" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.4" font-weight="bold">segments égaux</text>
<rect x="735" y="445" width="353" height="135" rx="12" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="911" y="475" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">PAR QUOI COMMENCER ?</text>
<text x="760" y="510" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.3" font-weight="bold">Choisissez d’abord les 5 sommets de</text>
<text x="760" y="527" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.3" font-weight="bold">votre polygone. Ajoutez ensuite les</text>
<text x="760" y="544" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.3" font-weight="bold">segments qui créeront les deux</text>
<text x="760" y="561" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.3" font-weight="bold">croisements.</text>
<rect x="35" y="610" width="1053" height="110" rx="11" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="55" y="640" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">AVANT LA COULEUR</text>
<text x="225" y="640" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.1" font-weight="bold">☐ 6 contraintes contrôlées   ☐ 3 preuves écrites   ☐ grille revenue</text>
<text x="55" y="678" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="bold">Titre de la création : ______________________________________________________________________</text>
<circle cx="825" cy="620" r="4" fill="#222" stroke="#222" stroke-width="0.6"/>
<text x="835" y="624" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="9.5" font-weight="bold">A</text>
<circle cx="880" cy="620" r="4" fill="#222" stroke="#222" stroke-width="0.6"/>
<text x="890" y="624" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="9.5" font-weight="bold">B</text>
<circle cx="935" cy="620" r="4" fill="#222" stroke="#222" stroke-width="0.6"/>
<text x="945" y="624" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="9.5" font-weight="bold">C</text>
<circle cx="990" cy="620" r="4" fill="#222" stroke="#222" stroke-width="0.6"/>
<text x="1000" y="624" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="9.5" font-weight="bold">D</text>
<circle cx="825" cy="675" r="4" fill="#222" stroke="#222" stroke-width="0.6"/>
<text x="835" y="679" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="9.5" font-weight="bold">E</text>
<circle cx="880" cy="675" r="4" fill="#222" stroke="#222" stroke-width="0.6"/>
<text x="890" y="679" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="9.5" font-weight="bold">F</text>
<circle cx="935" cy="675" r="4" fill="#222" stroke="#222" stroke-width="0.6"/>
<text x="945" y="679" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="9.5" font-weight="bold">G</text>
<circle cx="990" cy="675" r="4" fill="#222" stroke="#222" stroke-width="0.6"/>
<text x="1000" y="679" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="9.5" font-weight="bold">H</text>
<circle cx="825" cy="730" r="4" fill="#222" stroke="#222" stroke-width="0.6"/>
<text x="835" y="734" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="9.5" font-weight="bold">I</text>
<circle cx="880" cy="730" r="4" fill="#222" stroke="#222" stroke-width="0.6"/>
<text x="890" y="734" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="9.5" font-weight="bold">J</text>
<circle cx="935" cy="730" r="4" fill="#222" stroke="#222" stroke-width="0.6"/>
<text x="945" y="734" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="9.5" font-weight="bold">K</text>
<circle cx="990" cy="730" r="4" fill="#222" stroke="#222" stroke-width="0.6"/>
<text x="1000" y="734" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="9.5" font-weight="bold">L</text>
<circle cx="825" cy="785" r="4" fill="#222" stroke="#222" stroke-width="0.6"/>
<text x="835" y="789" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="9.5" font-weight="bold">M</text>
<circle cx="880" cy="785" r="4" fill="#222" stroke="#222" stroke-width="0.6"/>
<text x="890" y="789" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="9.5" font-weight="bold">N</text>
<circle cx="935" cy="785" r="4" fill="#222" stroke="#222" stroke-width="0.6"/>
<text x="945" y="789" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="9.5" font-weight="bold">O</text>
<circle cx="990" cy="785" r="4" fill="#222" stroke="#222" stroke-width="0.6"/>
<text x="1000" y="789" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="9.5" font-weight="bold">P</text>
<text x="825" y="780" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">Les 16 points sont A à P.</text>
<text x="40" y="775" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="bold">Une création différente de celle des autres peut être parfaitement correcte.</text>
