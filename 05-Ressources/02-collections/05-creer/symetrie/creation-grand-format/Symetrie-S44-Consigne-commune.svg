<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="42" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="bold">S44 – Travail à effectuer dans l’ordre</text>
<text x="40" y="72" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="normal">Ne passez à l’étape suivante qu’après avoir terminé la précédente.</text>
<circle cx="73" cy="120" r="20" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="73" y="126" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">1</text>
<rect x="108" y="95" width="960" height="54" rx="9" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="135" y="116" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">LIRE</text>
<text x="330" y="116" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.3" font-weight="normal">Entourez le format, les dimensions, la transformation et le test obligatoire.</text>
<circle cx="73" cy="197" r="20" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="73" y="203" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">2</text>
<rect x="108" y="172" width="960" height="54" rx="9" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="135" y="193" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">PLACER</text>
<text x="330" y="193" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.3" font-weight="normal">Tracez légèrement l’axe ou placez le centre O aux dimensions indiquées.</text>
<circle cx="73" cy="274" r="20" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="73" y="280" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">3</text>
<rect x="108" y="249" width="960" height="54" rx="9" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="135" y="270" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">CRÉER</text>
<text x="330" y="270" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.3" font-weight="normal">Dessinez uniquement le motif-source dans la zone imposée.</text>
<text x="135" y="293" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="11.8" font-weight="bold">Pas de couleur à cette étape.</text>
<circle cx="73" cy="351" r="20" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="73" y="357" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">4</text>
<rect x="108" y="326" width="960" height="54" rx="9" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="135" y="347" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">REPÉRER</text>
<text x="330" y="347" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.3" font-weight="normal">Nommez cinq points P1 à P5 répartis sur le motif-source.</text>
<circle cx="73" cy="428" r="20" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="73" y="434" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">5</text>
<rect x="108" y="403" width="960" height="54" rx="9" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="135" y="424" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">REPRODUIRE</text>
<text x="330" y="424" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.3" font-weight="normal">Utilisez le calque, le pliage, la rotation ou le gabarit prévu.</text>
<text x="135" y="447" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="11.8" font-weight="bold">Le dessin à l’œil seul n’est pas accepté.</text>
<circle cx="73" cy="505" r="20" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="73" y="511" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">6</text>
<rect x="108" y="480" width="960" height="54" rx="9" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="135" y="501" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">TESTER</text>
<text x="330" y="501" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.3" font-weight="normal">Contrôlez P1 à P5 et mesurez l’écart des points qui ne coïncident pas.</text>
<text x="135" y="524" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="11.8" font-weight="bold">Écrivez : point contrôlé, position attendue, position observée.</text>
<circle cx="73" cy="582" r="20" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="73" y="588" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">7</text>
<rect x="108" y="557" width="960" height="54" rx="9" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="135" y="578" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">FAIRE VÉRIFIER</text>
<text x="330" y="578" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.3" font-weight="normal">Une autre équipe nomme la transformation et choisit un défaut prioritaire.</text>
<circle cx="73" cy="659" r="20" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="73" y="665" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">8</text>
<rect x="108" y="634" width="960" height="54" rx="9" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="135" y="655" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">CORRIGER</text>
<text x="330" y="655" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.3" font-weight="normal">Modifiez un seul défaut et expliquez pourquoi la version 2 est meilleure.</text>
<rect x="180" y="720" width="765" height="48" rx="10" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
<text x="562" y="750" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16.5" font-weight="bold">À rendre : production + fiche + grille + calque + correction</text>
</svg>