<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="35" y="38" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="26" font-weight="bold">S44 – Équipe C – Le totem en demi-tour</text>
<text x="35" y="68" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">Format : Bande verticale de 20 × 50 cm</text>
<rect x="35" y="95" width="1053" height="82" rx="12" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
<text x="55" y="124" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">REPÈRE FIXE</text>
<text x="190" y="124" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">Placer O à 10 cm des côtés et à 25 cm du haut.</text>
<text x="55" y="158" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">ZONE-SOURCE</text>
<text x="190" y="158" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal">Construire le motif-source dans la moitié supérieure.</text>
<rect x="35" y="200" width="680" height="445" rx="12" fill="white" stroke="#222" stroke-width="1.4"/>
<text x="375" y="230" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16.5" font-weight="bold">TRAVAIL À FAIRE DANS L’ORDRE</text>
<circle cx="67" cy="265" r="13" fill="white" stroke="#222" stroke-width="1.1"/>
<text x="67" y="270" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">1</text>
<text x="93" y="256" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.6" font-weight="normal">Tracer légèrement les médianes et placer O au centre de la</text>
<text x="93" y="273" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.6" font-weight="normal">bande.</text>
<circle cx="67" cy="322" r="13" fill="white" stroke="#222" stroke-width="1.1"/>
<text x="67" y="327" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">2</text>
<text x="93" y="313" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.6" font-weight="normal">Construire dans la moitié supérieure un motif contenant une</text>
<text x="93" y="330" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.6" font-weight="normal">flèche ou une forme non symétrique.</text>
<circle cx="67" cy="379" r="13" fill="white" stroke="#222" stroke-width="1.1"/>
<text x="67" y="384" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">3</text>
<text x="93" y="370" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.6" font-weight="normal">Nommer cinq repères P1 à P5.</text>
<circle cx="67" cy="436" r="13" fill="white" stroke="#222" stroke-width="1.1"/>
<text x="67" y="441" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">4</text>
<text x="93" y="427" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.6" font-weight="normal">Fixer le calque en O puis le faire tourner exactement de 180°.</text>
<circle cx="67" cy="493" r="13" fill="white" stroke="#222" stroke-width="1.1"/>
<text x="67" y="498" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">5</text>
<text x="93" y="484" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.6" font-weight="normal">Reporter les cinq points et reconstruire le motif dans la moitié</text>
<text x="93" y="501" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.6" font-weight="normal">inférieure.</text>
<circle cx="67" cy="550" r="13" fill="white" stroke="#222" stroke-width="1.1"/>
<text x="67" y="555" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">6</text>
<text x="93" y="541" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.6" font-weight="normal">Contrôler que O est le milieu de chaque segment reliant Pi à son</text>
<text x="93" y="558" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.6" font-weight="normal">correspondant.</text>
<rect x="745" y="200" width="343" height="445" rx="12" fill="white" stroke="#222" stroke-width="1.4"/>
<text x="916" y="230" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">AVANT DE TRACER</text>
<text x="775" y="270" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="bold">☐ axe ou centre placé</text>
<text x="775" y="312" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="bold">☐ zone-source repérée</text>
<text x="775" y="354" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="bold">☐ dimensions lues</text>
<text x="775" y="396" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="bold">☐ cinq points P1 à P5</text>
<text x="775" y="438" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="bold">☐ méthode choisie</text>
<text x="775" y="480" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="bold">☐ calque disponible</text>
<text x="775" y="545" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">CROQUIS DU MOTIF-SOURCE</text>
<rect x="775" y="565" width="283" height="58" rx="0" fill="white" stroke="#222" stroke-width="1.0" stroke-dasharray="6 4"/>
<text x="916" y="600" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11.5" font-weight="bold">croquis rapide</text>
<rect x="35" y="665" width="1053" height="76" rx="11" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
<text x="55" y="691" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">TEST OBLIGATOIRE</text>
<text x="220" y="691" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="normal">Pour chaque paire, les deux points et O doivent être alignés, et les distances de O aux</text>
<text x="220" y="709" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="normal">deux points doivent être égales.</text>
<text x="40" y="772" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.1" font-weight="bold">À rendre : totem 20 × 50 cm, calque tourné, cinq segments de contrôle sur le brouillon</text>
</svg>