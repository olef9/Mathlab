<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="35" y="40" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="bold">T2 – Tinkercad – Plaque signalétique</text>
<rect x="35" y="82" width="1053" height="90" rx="12" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
<text x="55" y="112" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="14.5" font-weight="bold">MISSION</text>
<text x="180" y="112" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="bold">Créer une petite plaque portant un texte en relief.</text>
<rect x="35" y="205" width="650" height="420" rx="12" fill="white" stroke="#222" stroke-width="1.4"/>
<text x="360" y="238" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="16.5" font-weight="bold">À FAIRE OBLIGATOIREMENT</text>
<circle cx="68" cy="280" r="13" fill="white" stroke="#222" stroke-width="1.1"/>
<text x="68" y="285" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="10.5" font-weight="bold">1</text>
<text x="95" y="271" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="12.8" font-weight="normal">Base : 60 × 30 × 4 mm.</text>
<circle cx="68" cy="338" r="13" fill="white" stroke="#222" stroke-width="1.1"/>
<text x="68" y="343" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="10.5" font-weight="bold">2</text>
<text x="95" y="329" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="12.8" font-weight="normal">Texte ou nom lisible en relief.</text>
<circle cx="68" cy="396" r="13" fill="white" stroke="#222" stroke-width="1.1"/>
<text x="68" y="401" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="10.5" font-weight="bold">3</text>
<text x="95" y="387" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="12.8" font-weight="normal">Relief : 2 mm maximum au-dessus de la base.</text>
<circle cx="68" cy="454" r="13" fill="white" stroke="#222" stroke-width="1.1"/>
<text x="68" y="459" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="10.5" font-weight="bold">4</text>
<text x="95" y="445" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="12.8" font-weight="normal">Garder au moins 3 mm de marge autour du texte.</text>
<circle cx="68" cy="512" r="13" fill="white" stroke="#222" stroke-width="1.1"/>
<text x="68" y="517" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="10.5" font-weight="bold">5</text>
<text x="95" y="503" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="12.8" font-weight="normal">Hauteur totale : 6 mm maximum.</text>
<rect x="715" y="205" width="373" height="420" rx="12" fill="white" stroke="#222" stroke-width="1.4"/>
<text x="901" y="238" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="16.5" font-weight="bold">TEST FINAL</text>
<circle cx="750" cy="285" r="13" fill="white" stroke="#222" stroke-width="1.1"/>
<text x="750" y="290" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="10.5" font-weight="bold">1</text>
<text x="778" y="276" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="12.7" font-weight="normal">Mesurer 60 × 30 × 4 mm.</text>
<circle cx="750" cy="355" r="13" fill="white" stroke="#222" stroke-width="1.1"/>
<text x="750" y="360" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="10.5" font-weight="bold">2</text>
<text x="778" y="346" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="12.7" font-weight="normal">Vérifier la marge du texte.</text>
<circle cx="750" cy="425" r="13" fill="white" stroke="#222" stroke-width="1.1"/>
<text x="750" y="430" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="10.5" font-weight="bold">3</text>
<text x="778" y="416" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="12.7" font-weight="normal">Tourner la vue : aucune lettre</text>
<text x="778" y="433" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="12.7" font-weight="normal">ne flotte.</text>
<text x="750" y="515" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="13.5" font-weight="bold">ORDRE DE PRIORITÉ</text>
<text x="770" y="550" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="12.8" font-weight="bold">1. fonctionnement</text>
<text x="770" y="580" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="12.8" font-weight="bold">2. contraintes</text>
<text x="770" y="610" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="12.8" font-weight="bold">3. décoration</text>
<rect x="35" y="655" width="1053" height="80" rx="11" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
<text x="55" y="685" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="14.5" font-weight="bold">AVANT DE COMMENCER</text>
<text x="240" y="685" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="13.4" font-weight="bold">☐ projet compris   ☐ trois premières actions écrites   ☐ test final prévu</text>
<text x="55" y="720" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="13.3" font-weight="bold">À mi-séance : arrêtez la souris et faites le contrôle de 1 minute.</text>
<text x="40" y="776" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="13.5" font-weight="bold">Le projet doit être utilisable par une autre équipe sans explication orale.</text>
</svg>