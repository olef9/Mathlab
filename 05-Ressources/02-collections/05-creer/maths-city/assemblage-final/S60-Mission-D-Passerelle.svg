<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="35" y="38" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="25.5" font-weight="bold">S60 – Équipe D – Quartier passerelle</text>
<rect x="35" y="72" width="1053" height="105" rx="12" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="55" y="103" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">VOTRE SECTEUR</text>
<text x="210" y="103" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.7" font-weight="bold">Passerelle S55-D sur sa base 120 × 80 mm</text>
<text x="55" y="132" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="bold">Coordonnée bâtiment :</text>
<text x="210" y="132" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">base centrée sur la case (2,6)</text>
<text x="55" y="160" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.6" font-weight="bold">Orientation : route sous la passerelle orientée NORD–SUD</text>
<rect x="35" y="205" width="635" height="350" rx="12" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="352" y="238" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">TRAVAIL À FAIRE DANS L’ORDRE</text>
<circle cx="67" cy="278" r="12" fill="#f4f4f4" stroke="#222" stroke-width="1"/>
<text x="67" y="283" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="bold">1</text>
<text x="95" y="270" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.2" font-weight="bold">Centre la base de la passerelle sur la case</text>
<text x="95" y="286" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.2" font-weight="bold">(2,6).</text>
<circle cx="67" cy="326" r="12" fill="#f4f4f4" stroke="#222" stroke-width="1"/>
<text x="67" y="331" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="bold">2</text>
<text x="95" y="318" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.2" font-weight="bold">Vérifie qu’elle dépasse de 20 mm à gauche et à droite</text>
<text x="95" y="334" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.2" font-weight="bold">de la case (2,6), et qu’elle mesure 80 mm du nord au sud.</text>
<circle cx="67" cy="374" r="12" fill="#f4f4f4" stroke="#222" stroke-width="1"/>
<text x="67" y="379" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="bold">3</text>
<text x="95" y="366" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.2" font-weight="bold">Aligne la route de 30 mm sous la passerelle avec l’axe</text>
<text x="95" y="382" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.2" font-weight="bold">nord-sud.</text>
<circle cx="67" cy="422" r="12" fill="#f4f4f4" stroke="#222" stroke-width="1"/>
<text x="67" y="427" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="bold">4</text>
<text x="95" y="414" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.2" font-weight="bold">Prolonge cet axe dans (1,6) et (3,6), puis jusqu’au</text>
<text x="95" y="430" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.2" font-weight="bold">carrefour (4,6).</text>
<circle cx="67" cy="470" r="12" fill="#f4f4f4" stroke="#222" stroke-width="1"/>
<text x="67" y="475" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="bold">5</text>
<text x="95" y="462" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.2" font-weight="bold">Vérifie que les piles ne sont jamais dans la chaussée.</text>
<circle cx="67" cy="518" r="12" fill="#f4f4f4" stroke="#222" stroke-width="1"/>
<text x="67" y="523" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="bold">6</text>
<text x="95" y="510" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.2" font-weight="bold">Place la fontaine ou son socle dans (3,5) puis réserve</text>
<text x="95" y="526" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.2" font-weight="bold">la zone verte.</text>
<rect x="700" y="205" width="388" height="165" rx="12" fill="#f7f7f7" stroke="#222" stroke-width="1.3"/>
<text x="724" y="236" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">VOIRIE</text>
<text x="724" y="270" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.0" font-weight="bold">voie secondaire 30 mm : (1,6) →</text>
<text x="724" y="287" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.0" font-weight="bold">passerelle → (3,6) → carrefour (4,6)</text>
<rect x="700" y="395" width="388" height="160" rx="12" fill="#f7f7f7" stroke="#222" stroke-width="1.3"/>
<text x="724" y="426" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">MOBILIER + VERT</text>
<text x="724" y="458" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="11.8" font-weight="bold">fontaine S57-D ou son socle dans la</text>
<text x="724" y="474" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="11.8" font-weight="bold">zone (3,5)</text>
<text x="724" y="510" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="11.8" font-weight="bold">dans (3,5), autour de la fontaine</text>
<text x="724" y="526" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="11.8" font-weight="bold">sans dépasser 40 × 40 mm</text>
<rect x="35" y="585" width="1053" height="130" rx="12" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="55" y="615" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">AVANT DE FIXER</text>
<text x="70" y="650" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="11.7" font-weight="bold">☐ base 120 × 80</text>
<text x="400" y="650" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="11.7" font-weight="bold">☐ base centrée en (2,6)</text>
<text x="730" y="650" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="11.7" font-weight="bold">☐ route = 30 mm</text>
<text x="70" y="682" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="11.7" font-weight="bold">☐ passage sous tablier libre</text>
<text x="400" y="682" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="11.7" font-weight="bold">☐ liaison à (4,6)</text>
<text x="730" y="682" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="11.7" font-weight="bold">☐ fontaine/socle en (3,5)</text>
<text x="40" y="765" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="bold">Règle : aucune colle avant le contrôle croisé. Une mesure réelle doit apparaître sur la fiche.</text>
</svg>