<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="35" y="38" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="25.5" font-weight="bold">S49 – Équipe C – Translations</text>
<text x="35" y="68" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.8" font-weight="bold">Vous construisez deux frises identiques.</text>
<rect x="35" y="95" width="365" height="365" rx="12" fill="white" stroke="#333" stroke-width="1.4"/>
<text x="217" y="122" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">VOTRE FEUILLE</text>
<rect x="75" y="145" width="285" height="285" rx="0" fill="white" stroke="#222" stroke-width="2"/>
<rect x="75.0" y="216.25" width="285.0" height="142.5" rx="0" fill="#e8e8e8" stroke="#888" stroke-width="0.7"/>
<text x="217.5" y="291.5" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="bold">NE PAS DÉCORER</text>
<rect x="75.0" y="216.25" width="35.625" height="35.625" rx="0" fill="#cfcfcf" stroke="#777" stroke-width="0.6"/>
<rect x="75.0" y="251.875" width="35.625" height="35.625" rx="0" fill="#cfcfcf" stroke="#777" stroke-width="0.6"/>
<rect x="75.0" y="287.5" width="35.625" height="35.625" rx="0" fill="#cfcfcf" stroke="#777" stroke-width="0.6"/>
<rect x="75.0" y="323.125" width="35.625" height="35.625" rx="0" fill="#cfcfcf" stroke="#777" stroke-width="0.6"/>
<rect x="324.375" y="216.25" width="35.625" height="35.625" rx="0" fill="#cfcfcf" stroke="#777" stroke-width="0.6"/>
<rect x="324.375" y="251.875" width="35.625" height="35.625" rx="0" fill="#cfcfcf" stroke="#777" stroke-width="0.6"/>
<rect x="324.375" y="287.5" width="35.625" height="35.625" rx="0" fill="#cfcfcf" stroke="#777" stroke-width="0.6"/>
<rect x="324.375" y="323.125" width="35.625" height="35.625" rx="0" fill="#cfcfcf" stroke="#777" stroke-width="0.6"/>
<line x1="110.625" y1="145" x2="110.625" y2="430" stroke="#aaa" stroke-width="0.55"/>
<line x1="75" y1="180.625" x2="360" y2="180.625" stroke="#aaa" stroke-width="0.55"/>
<line x1="146.25" y1="145" x2="146.25" y2="430" stroke="#aaa" stroke-width="0.55"/>
<line x1="75" y1="216.25" x2="360" y2="216.25" stroke="#aaa" stroke-width="0.55"/>
<line x1="181.875" y1="145" x2="181.875" y2="430" stroke="#aaa" stroke-width="0.55"/>
<line x1="75" y1="251.875" x2="360" y2="251.875" stroke="#aaa" stroke-width="0.55"/>
<line x1="217.5" y1="145" x2="217.5" y2="430" stroke="#aaa" stroke-width="0.55"/>
<line x1="75" y1="287.5" x2="360" y2="287.5" stroke="#aaa" stroke-width="0.55"/>
<line x1="253.125" y1="145" x2="253.125" y2="430" stroke="#aaa" stroke-width="0.55"/>
<line x1="75" y1="323.125" x2="360" y2="323.125" stroke="#aaa" stroke-width="0.55"/>
<line x1="288.75" y1="145" x2="288.75" y2="430" stroke="#aaa" stroke-width="0.55"/>
<line x1="75" y1="358.75" x2="360" y2="358.75" stroke="#aaa" stroke-width="0.55"/>
<line x1="324.375" y1="145" x2="324.375" y2="430" stroke="#aaa" stroke-width="0.55"/>
<line x1="75" y1="394.375" x2="360" y2="394.375" stroke="#aaa" stroke-width="0.55"/>
<rect x="75.0" y="145.0" width="71.25" height="71.25" rx="0" fill="none" stroke="#111" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="110.625" y="157.46875" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="9.5" font-weight="bold">COMMENCER ICI</text>
<text x="217.5" y="135" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">NORD ↑</text>
<text x="217" y="447" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold">GRIS = NE PAS TOUCHER</text>
<rect x="430" y="95" width="658" height="480" rx="12" fill="white" stroke="#333" stroke-width="1.4"/>
<text x="759" y="125" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16.5" font-weight="bold">CE QUE VOUS FAITES, DANS L’ORDRE</text>
<circle cx="468" cy="160" r="14" fill="#f0f0f0" stroke="#222" stroke-width="1.4"/>
<text x="468" y="166" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">1</text>
<text x="500" y="149" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">Dans le carré pointillé de 20 × 20 mm, dessinez un motif simple avec</text>
<text x="500" y="167" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">au maximum cinq traits.</text>
<circle cx="468" cy="218" r="14" fill="#f0f0f0" stroke="#222" stroke-width="1.4"/>
<text x="468" y="224" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">2</text>
<text x="500" y="207" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">Tracez ce petit motif sur le calque.</text>
<circle cx="468" cy="276" r="14" fill="#f0f0f0" stroke="#222" stroke-width="1.4"/>
<text x="468" y="282" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">3</text>
<text x="500" y="265" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">Faites glisser le calque de 20 mm vers la droite sans le tourner.</text>
<text x="500" y="283" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">Recopiez le motif.</text>
<circle cx="468" cy="334" r="14" fill="#f0f0f0" stroke="#222" stroke-width="1.4"/>
<text x="468" y="340" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">4</text>
<text x="500" y="323" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">Recommencez deux fois : la frise du haut contient alors quatre</text>
<text x="500" y="341" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">motifs.</text>
<circle cx="468" cy="392" r="14" fill="#f0f0f0" stroke="#222" stroke-width="1.4"/>
<text x="468" y="398" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">5</text>
<text x="500" y="381" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">Faites glisser toute la frise de 60 mm vers le bas pour construire</text>
<text x="500" y="399" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">la frise du bas.</text>
<circle cx="468" cy="450" r="14" fill="#f0f0f0" stroke="#222" stroke-width="1.4"/>
<text x="468" y="456" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">6</text>
<text x="500" y="439" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">Ne dessinez pas dans la large bande grise du milieu.</text>
<rect x="35" y="490" width="365" height="155" rx="10" fill="#f2f2f2" stroke="#333" stroke-width="1.3"/>
<text x="217" y="520" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">ARRÊTEZ-VOUS ET APPELEZ LE PROFESSEUR</text>
<text x="60" y="555" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.6" font-weight="bold">Montrez le motif de 20 × 20 mm et expliquez</text>
<text x="60" y="573" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.6" font-weight="bold">comment vous allez déplacer le calque.</text>
<rect x="430" y="600" width="658" height="100" rx="10" fill="#f2f2f2" stroke="#333" stroke-width="1.3"/>
<text x="460" y="628" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">TEST FINAL</text>
<text x="570" y="628" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="bold">Les huit motifs doivent avoir exactement la même</text>
<text x="570" y="646" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="bold">orientation. Le calque glisse mais ne tourne jamais.</text>
<text x="35" y="742" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="bold">Ne repassez et ne décorez qu’après le test au crayon.</text>
</svg>