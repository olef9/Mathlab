<text x="128.4375" y="157.46875" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="9.5" font-weight="bold">COMMENCER ICI</text>
<circle cx="217.5" cy="287.5" r="4" fill="#111" stroke="#111" stroke-width="1"/>
<text x="225.5" y="280.5" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">O</text>
<text x="217.5" y="135" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">NORD ↑</text>
<text x="217" y="447" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold">GRIS = NE PAS TOUCHER</text>
<rect x="430" y="95" width="658" height="480" rx="12" fill="white" stroke="#333" stroke-width="1.4"/>
<text x="759" y="125" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16.5" font-weight="bold">CE QUE VOUS FAITES, DANS L’ORDRE</text>
<circle cx="468" cy="160" r="14" fill="#f0f0f0" stroke="#222" stroke-width="1.4"/>
<text x="468" y="166" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">1</text>
<text x="500" y="149" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">Dans le carré pointillé de 30 × 30 mm, dessinez exactement trois</text>
<text x="500" y="167" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">éléments simples : une forme fermée, une ligne brisée et un petit</text>
<text x="500" y="185" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">symbole.</text>
<circle cx="468" cy="218" r="14" fill="#f0f0f0" stroke="#222" stroke-width="1.4"/>
<text x="468" y="224" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">2</text>
<text x="500" y="207" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">Ne dessinez rien dans les cases grises.</text>
<circle cx="468" cy="276" r="14" fill="#f0f0f0" stroke="#222" stroke-width="1.4"/>
<text x="468" y="282" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">3</text>
<text x="500" y="265" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">Posez le calque sur le carré de départ. Tracez les trois éléments et</text>
<text x="500" y="283" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">le point O.</text>
<circle cx="468" cy="334" r="14" fill="#f0f0f0" stroke="#222" stroke-width="1.4"/>
<text x="468" y="340" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">4</text>
<text x="500" y="323" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">Maintenez O au même endroit et tournez le calque de 90° vers la</text>
<text x="500" y="341" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">droite. Recopiez les trois éléments.</text>
<circle cx="468" cy="392" r="14" fill="#f0f0f0" stroke="#222" stroke-width="1.4"/>
<text x="468" y="398" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">5</text>
<text x="500" y="381" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">Recommencez deux fois : vous obtenez quatre coins construits avec le</text>
<text x="500" y="399" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">même motif.</text>
<circle cx="468" cy="450" r="14" fill="#f0f0f0" stroke="#222" stroke-width="1.4"/>
<text x="468" y="456" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">6</text>
<text x="500" y="439" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">Donnez le même remplissage aux quatre copies correspondantes.</text>
<rect x="35" y="490" width="365" height="155" rx="10" fill="#f2f2f2" stroke="#333" stroke-width="1.3"/>
<text x="217" y="520" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">ARRÊTEZ-VOUS ET APPELEZ LE PROFESSEUR</text>
<text x="60" y="555" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.6" font-weight="bold">Montrez les trois éléments du carré de</text>
<text x="60" y="573" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.6" font-weight="bold">départ et le point O avant de tourner le</text>
<text x="60" y="591" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.6" font-weight="bold">calque.</text>
<rect x="430" y="600" width="658" height="100" rx="10" fill="#f2f2f2" stroke="#333" stroke-width="1.3"/>
<text x="460" y="628" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">TEST FINAL</text>
<text x="570" y="628" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="bold">Tournez le calque de 90° autour de O : les traits doivent se</text>
<text x="570" y="646" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="bold">superposer.</text>
<text x="35" y="742" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="bold">Ne repassez et ne décorez qu’après le test au crayon.</text>
</svg>