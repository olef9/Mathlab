<text x="217.5" y="135" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">NORD ↑</text>
<text x="217" y="447" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold">GRIS = NE PAS TOUCHER</text>
<rect x="430" y="95" width="658" height="480" rx="12" fill="white" stroke="#333" stroke-width="1.4"/>
<text x="759" y="125" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16.5" font-weight="bold">CE QUE VOUS FAITES, DANS L’ORDRE</text>
<circle cx="468" cy="160" r="14" fill="#f0f0f0" stroke="#222" stroke-width="1.4"/>
<text x="468" y="166" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">1</text>
<text x="500" y="149" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">Travaillez seulement dans la grille centrale de 4 × 4 cases.</text>
<circle cx="468" cy="218" r="14" fill="#f0f0f0" stroke="#222" stroke-width="1.4"/>
<text x="468" y="224" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">2</text>
<text x="500" y="207" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">Conservez les quatre lettres P déjà inscrites.</text>
<circle cx="468" cy="276" r="14" fill="#f0f0f0" stroke="#222" stroke-width="1.4"/>
<text x="468" y="282" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">3</text>
<text x="500" y="265" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">Complétez les douze autres cases avec P ou Q pour obtenir exactement</text>
<text x="500" y="283" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">huit P et huit Q.</text>
<circle cx="468" cy="334" r="14" fill="#f0f0f0" stroke="#222" stroke-width="1.4"/>
<text x="468" y="340" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">4</text>
<text x="500" y="323" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">Contrôlez les neuf petits carrés de 2 × 2 cases : aucun ne doit</text>
<text x="500" y="341" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">contenir quatre lettres identiques.</text>
<circle cx="468" cy="392" r="14" fill="#f0f0f0" stroke="#222" stroke-width="1.4"/>
<text x="468" y="398" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">5</text>
<text x="500" y="381" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">Vérifiez que votre dessin n’est pas le damier alterné classique.</text>
<circle cx="468" cy="450" r="14" fill="#f0f0f0" stroke="#222" stroke-width="1.4"/>
<text x="468" y="456" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">6</text>
<text x="500" y="439" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">Remplacez P par des points et Q par des hachures diagonales.</text>
<rect x="35" y="490" width="365" height="155" rx="10" fill="#f2f2f2" stroke="#333" stroke-width="1.3"/>
<text x="217" y="520" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">ARRÊTEZ-VOUS ET APPELEZ LE PROFESSEUR</text>
<text x="60" y="555" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.6" font-weight="bold">Montrez les quatre P imposés et votre</text>
<text x="60" y="573" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.6" font-weight="bold">compteur P = ___ / Q = ___ avant le</text>
<text x="60" y="591" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.6" font-weight="bold">remplissage final.</text>
<rect x="430" y="600" width="658" height="100" rx="10" fill="#f2f2f2" stroke="#333" stroke-width="1.3"/>
<text x="460" y="628" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">TEST FINAL</text>
<text x="570" y="628" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="bold">Comptez 8 P et 8 Q, puis contrôlez les neuf carrés 2 × 2 un</text>
<text x="570" y="646" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="bold">par un.</text>
<text x="35" y="742" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="bold">P = points · Q = hachures diagonales · ne travaillez pas hors de la grille centrale.</text>
<text x="164.0625" y="273.9625" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">P</text>
<text x="164.0625" y="309.5875" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">P</text>
<text x="270.9375" y="273.9625" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">P</text>
<text x="270.9375" y="309.5875" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">P</text>
