<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="35" y="38" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="25.5" font-weight="bold">S49 – Équipe D – Demi-tour de 180°</text>
<text x="35" y="68" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.8" font-weight="bold">Vous construisez la moitié basse à partir de la moitié haute.</text>
<rect x="35" y="95" width="365" height="365" rx="12" fill="white" stroke="#333" stroke-width="1.4"/>
<text x="217" y="122" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">VOTRE FEUILLE</text>
<rect x="75" y="145" width="285" height="285" rx="0" fill="white" stroke="#222" stroke-width="2"/>
<rect x="146.25" y="145.0" width="35.625" height="35.625" rx="0" fill="#cfcfcf" stroke="#777" stroke-width="0.6"/>
<rect x="181.875" y="145.0" width="35.625" height="35.625" rx="0" fill="#cfcfcf" stroke="#777" stroke-width="0.6"/>
<rect x="217.5" y="145.0" width="35.625" height="35.625" rx="0" fill="#cfcfcf" stroke="#777" stroke-width="0.6"/>
<rect x="253.125" y="145.0" width="35.625" height="35.625" rx="0" fill="#cfcfcf" stroke="#777" stroke-width="0.6"/>
<rect x="146.25" y="394.375" width="35.625" height="35.625" rx="0" fill="#cfcfcf" stroke="#777" stroke-width="0.6"/>
<rect x="181.875" y="394.375" width="35.625" height="35.625" rx="0" fill="#cfcfcf" stroke="#777" stroke-width="0.6"/>
<rect x="217.5" y="394.375" width="35.625" height="35.625" rx="0" fill="#cfcfcf" stroke="#777" stroke-width="0.6"/>
<rect x="253.125" y="394.375" width="35.625" height="35.625" rx="0" fill="#cfcfcf" stroke="#777" stroke-width="0.6"/>
<line x1="110.625" y1="145" x2="110.625" y2="430" stroke="#aaa" stroke-width="0.55"/>
<line x1="75" y1="180.625" x2="360" y2="180.625" stroke="#aaa" stroke-width="0.55"/>
<line x1="146.25" y1="145" x2="146.25" y2="430" stroke="#aaa" stroke-width="0.55"/>
<line x1="75" y1="216.25" x2="360" y2="216.25" stroke="#aaa" stroke-width="0.55"/>
<line x1="181.875" y1="145" x2="181.875" y2="430" stroke="#aaa" stroke-width="0.55"/>
<line x1="75" y1="251.875" x2="360" y2="251.875" stroke="#aaa" stroke-width="0.55"/>
<line x1="217.5" y1="145" x2="217.5" y2="430" stroke="#aaa" stroke-width="0.55"/>
<line x1="75" y1="287.5" x2="360" y2="287.5" stroke="#aaa" stroke-width="0.55"/>
<line x1="253.125" y1="145" x2="253.125" y2="430" stroke="#aaa" stroke-width="0.55"/>
<line x1="75" y1="323.125" x2="360" y2="323.125" stroke="#aaa" stroke-width="0.55"/>
<line x1="288.75" y1="145" x2="288.75" y2="430" stroke="#aaa" stroke-width="0.55"/>
<line x1="75" y1="358.75" x2="360" y2="358.75" stroke="#aaa" stroke-width="0.55"/>
<line x1="324.375" y1="145" x2="324.375" y2="430" stroke="#aaa" stroke-width="0.55"/>
<line x1="75" y1="394.375" x2="360" y2="394.375" stroke="#aaa" stroke-width="0.55"/>
<line x1="75" y1="287.5" x2="360" y2="287.5" stroke="#111" stroke-width="1.8" stroke-dasharray="7 5"/>
<circle cx="217.5" cy="287.5" r="4" fill="#111" stroke="#111" stroke-width="1"/>
<text x="225.5" y="280.5" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">O</text>
<text x="217.5" y="135" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">NORD ↑</text>
<text x="217" y="447" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold">GRIS = NE PAS TOUCHER</text>
<rect x="430" y="95" width="658" height="480" rx="12" fill="white" stroke="#333" stroke-width="1.4"/>
<text x="759" y="125" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16.5" font-weight="bold">CE QUE VOUS FAITES, DANS L’ORDRE</text>
<circle cx="468" cy="160" r="14" fill="#f0f0f0" stroke="#222" stroke-width="1.4"/>
<text x="468" y="166" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">1</text>
<text x="500" y="149" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">Dans la moitié supérieure, dessinez exactement cinq éléments</text>
<text x="500" y="167" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">simples.</text>
<circle cx="468" cy="218" r="14" fill="#f0f0f0" stroke="#222" stroke-width="1.4"/>
<text x="468" y="224" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">2</text>
<text x="500" y="207" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">Numérotez discrètement ces éléments de 1 à 5 sur le brouillon.</text>
<circle cx="468" cy="276" r="14" fill="#f0f0f0" stroke="#222" stroke-width="1.4"/>
<text x="468" y="282" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">3</text>
<text x="500" y="265" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">Ne dessinez pas dans les cases grises.</text>
<circle cx="468" cy="334" r="14" fill="#f0f0f0" stroke="#222" stroke-width="1.4"/>
<text x="468" y="340" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">4</text>
<text x="500" y="323" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">Tracez les cinq éléments et le point O sur le calque.</text>
<circle cx="468" cy="392" r="14" fill="#f0f0f0" stroke="#222" stroke-width="1.4"/>
<text x="468" y="398" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">5</text>
<text x="500" y="381" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">Maintenez O et faites tourner le calque de 180°.</text>
<circle cx="468" cy="450" r="14" fill="#f0f0f0" stroke="#222" stroke-width="1.4"/>
<text x="468" y="456" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">6</text>
<text x="500" y="439" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">Recopiez les cinq éléments dans la moitié basse et vérifiez les cinq</text>
<text x="500" y="457" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.0" font-weight="normal">paires.</text>
<rect x="35" y="490" width="365" height="155" rx="10" fill="#f2f2f2" stroke="#333" stroke-width="1.3"/>
<text x="217" y="520" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">ARRÊTEZ-VOUS ET APPELEZ LE PROFESSEUR</text>
<text x="60" y="555" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.6" font-weight="bold">Montrez les cinq éléments de la moitié</text>
<text x="60" y="573" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.6" font-weight="bold">haute et le centre O avant de tourner.</text>
<rect x="430" y="600" width="658" height="100" rx="10" fill="#f2f2f2" stroke="#333" stroke-width="1.3"/>
<text x="460" y="628" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">TEST FINAL</text>
<text x="570" y="628" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="bold">Après un demi-tour, le haut devient le bas et la gauche</text>
<text x="570" y="646" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="bold">devient la droite.</text>
<text x="35" y="742" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="bold">Ne repassez et ne décorez qu’après le test au crayon.</text>
</svg>