<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="42" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="bold">S49 – Comment utiliser votre feuille ?</text>
<text x="40" y="72" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="normal">Trois repères suffisent pour comprendre le travail.</text>
<circle cx="72" cy="133" r="22" fill="#f2f2f2" stroke="#222" stroke-width="1.4"/>
<text x="72" y="140" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">1</text>
<rect x="110" y="105" width="960" height="68" rx="10" fill="white" stroke="#333" stroke-width="1.2"/>
<text x="135" y="130" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">CASES GRISES</text>
<text x="345" y="127" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="normal">Elles représentent les passages. Ne rien dessiner, colorier ou écrire</text>
<text x="345" y="145" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="normal">dedans.</text>
<circle cx="72" cy="225" r="22" fill="#f2f2f2" stroke="#222" stroke-width="1.4"/>
<text x="72" y="232" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">2</text>
<rect x="110" y="197" width="960" height="68" rx="10" fill="white" stroke="#333" stroke-width="1.2"/>
<text x="135" y="222" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">ZONE POINTILLÉE</text>
<text x="345" y="219" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="normal">C’est la petite partie à construire en premier. Ne remplissez pas tout le</text>
<text x="345" y="237" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="normal">module.</text>
<circle cx="72" cy="317" r="22" fill="#f2f2f2" stroke="#222" stroke-width="1.4"/>
<text x="72" y="324" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">3</text>
<rect x="110" y="289" width="960" height="68" rx="10" fill="white" stroke="#333" stroke-width="1.2"/>
<text x="135" y="314" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">FLÈCHE NORD</text>
<text x="345" y="311" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="normal">Elle doit rester dans le même sens jusqu’à l’assemblage.</text>
<circle cx="72" cy="409" r="22" fill="#f2f2f2" stroke="#222" stroke-width="1.4"/>
<text x="72" y="416" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">4</text>
<rect x="110" y="381" width="960" height="68" rx="10" fill="white" stroke="#333" stroke-width="1.2"/>
<text x="135" y="406" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">CRAYON D’ABORD</text>
<text x="345" y="403" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="normal">Le professeur vérifie le modèle de départ avant la reproduction et la</text>
<text x="345" y="421" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="normal">décoration.</text>
<circle cx="72" cy="501" r="22" fill="#f2f2f2" stroke="#222" stroke-width="1.4"/>
<text x="72" y="508" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">5</text>
<rect x="110" y="473" width="960" height="68" rx="10" fill="white" stroke="#333" stroke-width="1.2"/>
<text x="135" y="498" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">MÉTHODE IMPOSÉE</text>
<text x="345" y="495" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="normal">Utiliser le calque, l’axe, le centre ou la grille. Ne pas recopier à l’œil.</text>
<circle cx="72" cy="593" r="22" fill="#f2f2f2" stroke="#222" stroke-width="1.4"/>
<text x="72" y="600" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">6</text>
<rect x="110" y="565" width="960" height="68" rx="10" fill="white" stroke="#333" stroke-width="1.2"/>
<text x="135" y="590" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">ASSEMBLAGE</text>
<text x="345" y="587" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="normal">A au centre ; B au nord ; C à l’est ; D au sud ; E à l’ouest.</text>
<rect x="120" y="690" width="885" height="60" rx="10" fill="#ededed" stroke="#333" stroke-width="1.4"/>
<text x="562" y="717" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">Avant de repasser : cases grises intactes + méthode vérifiée + raccord mesuré</text>
<text x="562" y="742" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="middle">Une production jolie mais construite sans méthode n’est pas validée.</text>
</svg>