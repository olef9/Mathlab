<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="42" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="bold">S49 – Où placer les cinq modules ?</text>
<text x="40" y="72" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="normal">La flèche NORD de chaque feuille reste orientée vers le haut.</text>
<rect x="486" y="305" width="150" height="150" rx="8" fill="#ededed" stroke="#222" stroke-width="2"/>
<text x="561.0" y="370" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="bold">MODULE A</text>
<text x="561.0" y="400" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="12" font-weight="bold">NORD ↑</text>
<rect x="486" y="125" width="150" height="150" rx="8" fill="white" stroke="#222" stroke-width="2"/>
<text x="561.0" y="190" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="bold">MODULE B</text>
<text x="561.0" y="220" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="12" font-weight="bold">NORD ↑</text>
<rect x="666" y="305" width="150" height="150" rx="8" fill="white" stroke="#222" stroke-width="2"/>
<text x="741.0" y="370" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="bold">MODULE C</text>
<text x="741.0" y="400" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="12" font-weight="bold">NORD ↑</text>
<rect x="486" y="485" width="150" height="150" rx="8" fill="white" stroke="#222" stroke-width="2"/>
<text x="561.0" y="550" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="bold">MODULE D</text>
<text x="561.0" y="580" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="12" font-weight="bold">NORD ↑</text>
<rect x="306" y="305" width="150" height="150" rx="8" fill="white" stroke="#222" stroke-width="2"/>
<text x="381.0" y="370" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="bold">MODULE E</text>
<text x="381.0" y="400" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="12" font-weight="bold">NORD ↑</text>
<text x="561" y="288" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold">B touche le haut de A</text>
<text x="656" y="385" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold">C touche le côté droit de A</text>
<text x="561" y="475" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold">D touche le bas de A</text>
<text x="466" y="385" text-anchor="end" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold">E touche le côté gauche de A</text>
<rect x="100" y="680" width="920" height="70" rx="10" fill="#f2f2f2" stroke="#333" stroke-width="1.3"/>
<text x="560" y="708" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">On ne contrôle que quatre raccords : A-B, A-C, A-D et A-E.</text>
<text x="560" y="735" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="middle">Les quatre cases grises de deux bords voisins doivent être exactement face à face.</text>
</svg>