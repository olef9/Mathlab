<text x="785" y="160" font-family="Arial" font-size="19" font-weight="bold">Structure</text>
<text x="785" y="205" font-family="Arial" font-size="15">• 1 cercle initial</text>
<text x="785" y="235" font-family="Arial" font-size="15">• 12 points réguliers</text>
<text x="785" y="265" font-family="Arial" font-size="15">• 12 centres</text>
<text x="785" y="295" font-family="Arial" font-size="15">• rayon commun : OA</text>
<text x="785" y="345" font-family="Arial" font-size="17" font-weight="bold">Contrôle</text>
<text x="785" y="385" font-family="Arial" font-size="15">Chaque cercle :</text>
<text x="805" y="415" font-family="Arial" font-size="15">- est centré sur A à L ;</text>
<text x="805" y="445" font-family="Arial" font-size="15">- passe par O ;</text>
<text x="805" y="475" font-family="Arial" font-size="15">- possède le rayon OA.</text>
<text x="785" y="535" font-family="Arial" font-size="17" font-weight="bold">Points consécutifs</text>
<text x="785" y="575" font-family="Arial" font-size="15">1/12 de tour</text>
<text x="785" y="605" font-family="Arial" font-size="15">soit 30° au centre</text>
<text x="40" y="755" font-family="Arial" font-size="13">Les cercles sont tracés entièrement pendant la recherche, puis seuls les arcs intérieurs sont repassés.</text>
