<text x="815" y="456" text-anchor="start" font-family="Arial" font-size="12" font-weight="normal">4 faces latérales en bande,</text>
<text x="815" y="478" text-anchor="start" font-family="Arial" font-size="12" font-weight="normal">2 bases attachées à des arêtes</text>
<text x="815" y="500" text-anchor="start" font-family="Arial" font-size="12" font-weight="normal">de longueur compatible.</text>
<text x="815" y="540" text-anchor="start" font-family="Arial" font-size="14" font-weight="bold">Prisme :</text>
<text x="815" y="566" text-anchor="start" font-family="Arial" font-size="12" font-weight="normal">3 rectangles en bande,</text>
<text x="815" y="588" text-anchor="start" font-family="Arial" font-size="12" font-weight="normal">1 triangle à chaque extrémité.</text>
<text x="815" y="625" text-anchor="start" font-family="Arial" font-size="12" font-weight="bold">Pyramide : carré + 4 triangles.</text>
