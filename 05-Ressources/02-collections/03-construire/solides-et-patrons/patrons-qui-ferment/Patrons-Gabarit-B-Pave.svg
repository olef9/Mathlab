<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
<rect width="100%" height="100%" fill="white"/>
<text x="12" y="12" text-anchor="start" font-family="Arial" font-size="7" font-weight="bold">Équipe B – Pavé droit 4 × 3 × 2</text>
<text x="12" y="21" text-anchor="start" font-family="Arial" font-size="4.2" font-weight="normal">Découper les six faces. Mesurer les arêtes avant de les joindre.</text>
<rect x="18" y="42" width="40" height="30" rx="0" fill="#fafafa" stroke="#222" stroke-width="0.7"/>
<text x="38.0" y="59.0" text-anchor="middle" font-family="Arial" font-size="4.2" font-weight="bold">4 × 3 – A</text>
<rect x="70" y="42" width="40" height="30" rx="0" fill="#fafafa" stroke="#222" stroke-width="0.7"/>
<text x="90.0" y="59.0" text-anchor="middle" font-family="Arial" font-size="4.2" font-weight="bold">4 × 3 – B</text>
<rect x="122" y="42" width="40" height="20" rx="0" fill="#fafafa" stroke="#222" stroke-width="0.7"/>
<text x="142.0" y="54.0" text-anchor="middle" font-family="Arial" font-size="4.2" font-weight="bold">4 × 2 – C</text>
<rect x="174" y="42" width="40" height="20" rx="0" fill="#fafafa" stroke="#222" stroke-width="0.7"/>
<text x="194.0" y="54.0" text-anchor="middle" font-family="Arial" font-size="4.2" font-weight="bold">4 × 2 – D</text>
<rect x="226" y="42" width="30" height="20" rx="0" fill="#fafafa" stroke="#222" stroke-width="0.7"/>
<text x="241.0" y="54.0" text-anchor="middle" font-family="Arial" font-size="4.2" font-weight="bold">3 × 2 – E</text>
<rect x="226" y="82" width="30" height="20" rx="0" fill="#fafafa" stroke="#222" stroke-width="0.7"/>
<text x="241.0" y="94.0" text-anchor="middle" font-family="Arial" font-size="4.2" font-weight="bold">3 × 2 – F</text>
<text x="18" y="125" text-anchor="start" font-family="Arial" font-size="5" font-weight="bold">Inventaire :</text>
<text x="22" y="140" text-anchor="start" font-family="Arial" font-size="4.4" font-weight="normal">☐ 2 faces 4 × 3</text>
<text x="22" y="153" text-anchor="start" font-family="Arial" font-size="4.4" font-weight="normal">☐ 2 faces 4 × 2</text>
<text x="22" y="166" text-anchor="start" font-family="Arial" font-size="4.4" font-weight="normal">☐ 2 faces 3 × 2</text>
<text x="135" y="125" text-anchor="start" font-family="Arial" font-size="5" font-weight="bold">Règle :</text>
<text x="139" y="140" text-anchor="start" font-family="Arial" font-size="4.3" font-weight="normal">Deux faces ne peuvent être articulées</text>
<text x="139" y="149" text-anchor="start" font-family="Arial" font-size="4.3" font-weight="normal">que le long d’arêtes de même longueur.</text>
<text x="12" y="198" text-anchor="start" font-family="Arial" font-size="13" font-weight="bold">Découper sur les traits pleins.</text>
<text x="12" y="220" text-anchor="start" font-family="Arial" font-size="12" font-weight="normal">Les articulations seront réalisées avec du ruban adhésif au dos.</text>
</svg>