<text x="125" y="210" text-anchor="start" font-family="Arial" font-size="15" font-weight="bold">La forme de chaque face est correcte.</text>
<text x="125" y="233" text-anchor="start" font-family="Arial" font-size="12" font-weight="normal">Comparer avec le solide attendu.</text>
