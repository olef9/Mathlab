<text x="40" y="40" text-anchor="start" font-family="Arial" font-size="28" font-weight="bold">S33 – Grille de validation d’un patron</text>
<text x="40" y="68" text-anchor="start" font-family="Arial" font-size="14" font-weight="normal">Équipe observée : ____________________   Solide : ____________________</text>
