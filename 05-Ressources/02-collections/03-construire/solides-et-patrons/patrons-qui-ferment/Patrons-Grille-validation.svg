<circle cx="88" cy="646" r="18" fill="white" stroke="#222" stroke-width="1.6"/>
<text x="88" y="652" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold">8</text>
<text x="125" y="642" text-anchor="start" font-family="Arial" font-size="15" font-weight="bold">Le solide ferme sans ouverture.</text>
