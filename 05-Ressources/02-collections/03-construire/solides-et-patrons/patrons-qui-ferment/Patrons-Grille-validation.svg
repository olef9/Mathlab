<text x="125" y="138" text-anchor="start" font-family="Arial" font-size="15" font-weight="bold">Toutes les faces nécessaires sont présentes.</text>
<text x="125" y="161" text-anchor="start" font-family="Arial" font-size="12" font-weight="normal">Compter sans plier.</text>
