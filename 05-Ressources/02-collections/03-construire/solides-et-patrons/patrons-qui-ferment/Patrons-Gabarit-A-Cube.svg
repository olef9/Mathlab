<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
<rect width="100%" height="100%" fill="white"/>
<text x="12" y="12" text-anchor="start" font-family="Arial" font-size="7" font-weight="bold">Équipe A – Cube guidé</text>
<text x="12" y="21" text-anchor="start" font-family="Arial" font-size="4.2" font-weight="normal">Découper les six carrés, puis reproduire le patron valide n°1 ou n°3.</text>
<text x="12" y="198" text-anchor="start" font-family="Arial" font-size="13" font-weight="bold">Découper sur les traits pleins.</text>
<text x="12" y="220" text-anchor="start" font-family="Arial" font-size="12" font-weight="normal">Les articulations seront réalisées avec du ruban adhésif au dos.</text>
<rect x="25" y="45" width="35" height="35" rx="0" fill="#fafafa" stroke="#222" stroke-width="0.7"/>
<text x="42.5" y="64.5" text-anchor="middle" font-family="Arial" font-size="4.2" font-weight="bold">face 1</text>
<rect x="70" y="45" width="35" height="35" rx="0" fill="#fafafa" stroke="#222" stroke-width="0.7"/>
<text x="87.5" y="64.5" text-anchor="middle" font-family="Arial" font-size="4.2" font-weight="bold">face 2</text>
<rect x="115" y="45" width="35" height="35" rx="0" fill="#fafafa" stroke="#222" stroke-width="0.7"/>
<text x="132.5" y="64.5" text-anchor="middle" font-family="Arial" font-size="4.2" font-weight="bold">face 3</text>
<rect x="25" y="95" width="35" height="35" rx="0" fill="#fafafa" stroke="#222" stroke-width="0.7"/>
<text x="42.5" y="114.5" text-anchor="middle" font-family="Arial" font-size="4.2" font-weight="bold">face 4</text>
<rect x="70" y="95" width="35" height="35" rx="0" fill="#fafafa" stroke="#222" stroke-width="0.7"/>
<text x="87.5" y="114.5" text-anchor="middle" font-family="Arial" font-size="4.2" font-weight="bold">face 5</text>
<rect x="115" y="95" width="35" height="35" rx="0" fill="#fafafa" stroke="#222" stroke-width="0.7"/>
<text x="132.5" y="114.5" text-anchor="middle" font-family="Arial" font-size="4.2" font-weight="bold">face 6</text>
<text x="175" y="45" text-anchor="start" font-family="Arial" font-size="5.5" font-weight="bold">Contrôles</text>
<text x="178" y="60" text-anchor="start" font-family="Arial" font-size="4.5" font-weight="normal">☐ 6 faces</text>
<text x="178" y="75" text-anchor="start" font-family="Arial" font-size="4.5" font-weight="normal">☐ un seul tenant</text>
<text x="178" y="90" text-anchor="start" font-family="Arial" font-size="4.5" font-weight="normal">☐ pas de superposition</text>
<text x="178" y="105" text-anchor="start" font-family="Arial" font-size="4.5" font-weight="normal">☐ 3 paires opposées</text>
<text x="178" y="135" text-anchor="start" font-family="Arial" font-size="4.5" font-weight="bold">Patron choisi :</text>
<text x="178" y="148" text-anchor="start" font-family="Arial" font-size="5.2" font-weight="normal">n° ______</text>
</svg>