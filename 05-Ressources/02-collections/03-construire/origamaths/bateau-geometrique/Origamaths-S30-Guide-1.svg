<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="40" text-anchor="start" font-family="Arial" font-size="28" font-weight="bold">Guide 1 – Former le grand triangle</text>
<rect x="45" y="90" width="330" height="620" rx="12" fill="white" stroke="#222" stroke-width="1.7"/>
<rect x="390" y="90" width="330" height="620" rx="12" fill="white" stroke="#222" stroke-width="1.7"/>
<rect x="735" y="90" width="330" height="620" rx="12" fill="white" stroke="#222" stroke-width="1.7"/>
<text x="210" y="130" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">1. Plier en deux</text>
<rect x="90" y="220" width="240" height="170" rx="0" fill="white" stroke="#222" stroke-width="2"/>
<line x1="90" y1="305" x2="330" y2="305" stroke="#222" stroke-width="2" stroke-dasharray="12 8"/>
<text x="210" y="450" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Plier horizontalement.</text>
<text x="555" y="130" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">2. Marquer l’axe</text>
<rect x="445" y="220" width="220" height="170" rx="0" fill="white" stroke="#222" stroke-width="2"/>
<line x1="555" y1="220" x2="555" y2="390" stroke="#222" stroke-width="2" stroke-dasharray="12 8"/>
<text x="555" y="450" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Plier puis déplier verticalement.</text>
<text x="900" y="130" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">3. Rabattre les coins</text>
<polygon points="790,390 900,220 1010,390" fill="white" stroke="#222" stroke-width="2"/>
<line x1="900" y1="220" x2="900" y2="390" stroke="#222" stroke-width="2" stroke-dasharray="12 8"/>
<text x="900" y="450" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Les deux coins rejoignent l’axe.</text>
<text x="560" y="755" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Contrôle : les deux côtés obliques doivent être symétriques.</text>
</svg>