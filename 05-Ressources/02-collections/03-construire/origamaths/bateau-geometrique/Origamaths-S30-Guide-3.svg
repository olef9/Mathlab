<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="40" text-anchor="start" font-family="Arial" font-size="28" font-weight="bold">Guide 3 – Former et ouvrir le bateau</text>
<rect x="45" y="90" width="330" height="620" rx="12" fill="white" stroke="#222" stroke-width="1.7"/>
<rect x="390" y="90" width="330" height="620" rx="12" fill="white" stroke="#222" stroke-width="1.7"/>
<rect x="735" y="90" width="330" height="620" rx="12" fill="white" stroke="#222" stroke-width="1.7"/>
<text x="210" y="130" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">7. Former le triangle</text>
<polygon points="90,420 210,220 330,420" fill="white" stroke="#222" stroke-width="2"/>
<text x="210" y="500" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Relever la pointe avant puis arrière.</text>
<text x="555" y="130" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">8. Former le second carré</text>
<polygon points="555,210 665,330 555,450 445,330" fill="white" stroke="#222" stroke-width="2"/>
<text x="555" y="500" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Ouvrir et aplatir à nouveau.</text>
<text x="900" y="130" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">9. Ouvrir le bateau</text>
<polygon points="790,440 835,300 900,360 965,300 1010,440" fill="#f3f3f3" stroke="#222" stroke-width="2"/>
<line x1="790" y1="440" x2="1010" y2="440" stroke="#222" stroke-width="3"/>
<text x="900" y="500" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Écarter doucement les deux pointes.</text>
<text x="560" y="755" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Aplatir la base puis ouvrir légèrement la coque pour qu’elle tienne.</text>
</svg>