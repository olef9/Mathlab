<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#222"/>
</marker>
</defs>
<text x="40" y="42" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="bold">S41 – Légende des plis</text>
<text x="40" y="72" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="normal">Observer la forme du papier avant de manipuler le patron.</text>
<rect x="45" y="115" width="320" height="480" rx="16" fill="white" stroke="#222" stroke-width="1.8"/>
<text x="205" y="155" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="bold">PLI VALLÉE</text>
<path d="M85 345 L205 255 L325 345" fill="none" stroke="#222" stroke-width="5"/>
<line x1="95" y1="225" x2="195" y2="305" stroke="#222" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="315" y1="225" x2="215" y2="305" stroke="#222" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="205" y="405" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">Le papier forme un creux.</text>
<text x="205" y="440" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="normal">Les deux côtés se rapprochent</text>
<text x="205" y="465" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="normal">vers l’intérieur du pli.</text>
<rect x="95" y="505" width="220" height="48" rx="9" fill="#f3f3f3" stroke="#222" stroke-width="1.2"/>
<text x="205" y="536" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">CREUX</text>
<rect x="402" y="115" width="320" height="480" rx="16" fill="white" stroke="#222" stroke-width="1.8"/>
<text x="562" y="155" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="bold">PLI MONTAGNE</text>
<path d="M442 345 L562 435 L682 345" fill="none" stroke="#222" stroke-width="5"/>
<line x1="452" y1="470" x2="552" y2="390" stroke="#222" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="672" y1="470" x2="572" y2="390" stroke="#222" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="562" y="405" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">Le papier forme une arête.</text>
<text x="562" y="440" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="normal">Le sommet du pli ressort</text>
<text x="562" y="465" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="normal">vers l’observateur.</text>
<rect x="452" y="505" width="220" height="48" rx="9" fill="#f3f3f3" stroke="#222" stroke-width="1.2"/>
<text x="562" y="536" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">ARÊTE</text>
<rect x="759" y="115" width="320" height="480" rx="16" fill="white" stroke="#222" stroke-width="1.8"/>
<text x="919" y="155" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="bold">MARQUER UN PLI</text>
<rect x="820" y="220" width="198" height="130" rx="0" fill="#f4f4f4" stroke="#222" stroke-width="1.5"/>
<line x1="919" y1="220" x2="919" y2="350" stroke="#222" stroke-width="2.5" stroke-dasharray="8 6"/>
<line x1="800" y1="285" x2="885" y2="285" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1038" y1="285" x2="953" y2="285" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
<text x="919" y="405" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">1. plier précisément</text>
<text x="919" y="437" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">2. appuyer sur le pli</text>
<text x="919" y="469" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">3. déplier</text>
<rect x="809" y="505" width="220" height="48" rx="9" fill="#f3f3f3" stroke="#222" stroke-width="1.2"/>
<text x="919" y="536" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">PLIER PUIS DÉPLIER</text>
<rect x="160" y="660" width="805" height="72" rx="12" fill="white" stroke="#222" stroke-width="1.8"/>
<text x="562" y="690" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">Avant chaque geste :</text>
<text x="562" y="720" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">nommer le segment → annoncer vallée ou montagne → plier</text>
</svg>