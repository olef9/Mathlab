<text x="250" y="637" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">PASSAGE 40 mm</text>
<line x1="185" y1="600" x2="315" y2="600" stroke="#222" stroke-width="1.0" stroke-dasharray="6 4"/>
<text x="250" y="595" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">E4 à 50 mm du sol</text>
<rect x="455" y="410" width="600" height="245" rx="12" fill="#f7f7f7" stroke="#222" stroke-width="1.2"/>
<text x="480" y="445" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">ORDRE DU MONTAGE À BLANC</text>
<text x="500" y="485" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal">• 1. Poser la base avec la flèche nord visible.</text>
<text x="500" y="513" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal">• 2. Poser les solides sans colle.</text>
<text x="500" y="541" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal">• 3. Comparer avec ce plan.</text>
<text x="500" y="569" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal">• 4. Mesurer l’encombrement et la hauteur.</text>
<text x="500" y="597" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal">• 5. Déplacer toute pièce mal orientée.</text>
<text x="500" y="625" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal">• 6. Appeler le contrôleur.</text>
<text x="500" y="653" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal">• 7. Coller seulement après validation.</text>
<text x="480" y="700" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold">D : le tablier D1 est placé après les deux piles.</text>
<text x="480" y="730" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold">E : E4 est en hauteur ; il ne réduit pas la cour au sol.</text>
</svg>