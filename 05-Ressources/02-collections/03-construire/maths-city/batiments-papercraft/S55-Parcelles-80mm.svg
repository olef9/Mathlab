<text x="155" y="24" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="4" font-weight="bold">PARCELLE B</text>
<text x="119" y="36" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="3.2" font-weight="bold">↑ N</text>
<rect x="15" y="128" width="80" height="80" rx="0" fill="white" stroke="#222" stroke-width="0.6"/>
