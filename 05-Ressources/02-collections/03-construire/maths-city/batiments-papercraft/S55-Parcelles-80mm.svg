<text x="55" y="24" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="4" font-weight="bold">PARCELLE A</text>
<text x="19" y="36" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="3.2" font-weight="bold">↑ N</text>
