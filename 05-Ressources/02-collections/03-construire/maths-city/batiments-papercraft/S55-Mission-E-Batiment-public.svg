<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="35" y="38" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="25.5" font-weight="bold">S55 – Équipe E – Bâtiment public définitif</text>
<rect x="35" y="75" width="1053" height="85" rx="12" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="55" y="105" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.2" font-weight="bold">À CONSERVER DE S47</text>
<text x="235" y="105" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.4" font-weight="bold">S47 : cour ≥ 40×40 mm, passage ≥ 20 mm, hauteur libre ≥ 45 mm.</text>
<rect x="35" y="185" width="410" height="235" rx="12" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="240" y="217" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">SOLIDES À FABRIQUER</text>
<text x="62" y="258" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="bold">• E1 : aile gauche 20 × 60 × 60 mm</text>
<text x="62" y="292" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="bold">• E2 : aile droite 20 × 60 × 60 mm</text>
<text x="62" y="326" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="bold">• E3 : aile arrière 40 × 20 × 60 mm</text>
<text x="62" y="360" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="bold">• E4 : linteau 40 × 10 × 10 mm</text>
<rect x="475" y="185" width="613" height="365" rx="12" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="781" y="217" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">TRAVAIL À FAIRE DANS L’ORDRE</text>
<circle cx="505" cy="253" r="12" fill="#f4f4f4" stroke="#222" stroke-width="1"/>
<text x="505" y="258" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="bold">1</text>
<text x="532" y="245" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.2" font-weight="normal">Place E1 le long du côté gauche et E2 le long du côté</text>
<text x="532" y="261" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.2" font-weight="normal">droit.</text>
<circle cx="505" cy="300" r="12" fill="#f4f4f4" stroke="#222" stroke-width="1"/>
<text x="505" y="305" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="bold">2</text>
<text x="532" y="292" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.2" font-weight="normal">Place E3 au nord, entre les deux ailes.</text>
<circle cx="505" cy="347" r="12" fill="#f4f4f4" stroke="#222" stroke-width="1"/>
<text x="505" y="352" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="bold">3</text>
<text x="532" y="339" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.2" font-weight="normal">Mesure la cour au sol : elle doit faire 40 × 40 mm.</text>
<circle cx="505" cy="394" r="12" fill="#f4f4f4" stroke="#222" stroke-width="1"/>
<text x="505" y="399" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="bold">4</text>
<text x="532" y="386" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.2" font-weight="normal">Le passage au sud doit mesurer 40 mm de large.</text>
<circle cx="505" cy="441" r="12" fill="#f4f4f4" stroke="#222" stroke-width="1"/>
<text x="505" y="446" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="bold">5</text>
<text x="532" y="433" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.2" font-weight="normal">Place E4 à 50 mm du sol au-dessus du passage.</text>
<circle cx="505" cy="488" r="12" fill="#f4f4f4" stroke="#222" stroke-width="1"/>
<text x="505" y="493" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="bold">6</text>
<text x="532" y="480" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.2" font-weight="normal">Vérifie le passage, puis colle les quatre pièces.</text>
<rect x="35" y="450" width="410" height="205" rx="12" fill="#f7f7f7" stroke="#222" stroke-width="1.3"/>
<text x="240" y="482" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">TESTS OBLIGATOIRES</text>
<text x="65" y="522" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.3" font-weight="bold">☐ cour = 40 × 40 mm</text>
<text x="65" y="553" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.3" font-weight="bold">☐ passage au sol = 40 mm</text>
<text x="65" y="584" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.3" font-weight="bold">☐ hauteur libre sous E4 = 50 mm</text>
<text x="65" y="615" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.3" font-weight="bold">☐ bâtiment stable pendant 10 s</text>
<rect x="35" y="685" width="1053" height="58" rx="10" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
<text x="55" y="711" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">AVANT COLLAGE :</text>
<text x="210" y="711" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="bold">☐ montage à blanc   ☐ mesures   ☐ orientation   ☐ passage libre</text>
<text x="55" y="735" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="bold">Correction finale : ________________________________________________________________________</text>
<text x="40" y="782" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="bold">La façade et les couleurs viennent après la validation structurelle.</text>
</svg>