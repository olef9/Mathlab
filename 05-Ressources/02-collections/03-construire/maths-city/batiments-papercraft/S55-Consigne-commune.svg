<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="42" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="bold">S55 – Du patron au bâtiment définitif</text>
<text x="40" y="72" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="normal">Ne collez jamais sur la parcelle avant le montage à blanc.</text>
<circle cx="72" cy="120" r="20" fill="white" stroke="#222" stroke-width="1.4"/>
<text x="72" y="126" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">1</text>
<rect x="108" y="95" width="960" height="54" rx="9" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="135" y="116" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.2" font-weight="bold">IDENTIFIER</text>
<text x="365" y="116" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.9" font-weight="normal">Comptez les solides et relevez leurs dimensions.</text>
<circle cx="72" cy="197" r="20" fill="white" stroke="#222" stroke-width="1.4"/>
<text x="72" y="203" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">2</text>
<rect x="108" y="172" width="960" height="54" rx="9" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="135" y="193" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.2" font-weight="bold">REPÉRER</text>
<text x="365" y="193" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.9" font-weight="normal">Écrivez le numéro de chaque solide au dos du patron.</text>
<circle cx="72" cy="274" r="20" fill="white" stroke="#222" stroke-width="1.4"/>
<text x="72" y="280" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">3</text>
<rect x="108" y="249" width="960" height="54" rx="9" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="135" y="270" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.2" font-weight="bold">DÉCOUPER</text>
<text x="365" y="270" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.9" font-weight="normal">Suivez uniquement le contour continu.</text>
<circle cx="72" cy="351" r="20" fill="white" stroke="#222" stroke-width="1.4"/>
<text x="72" y="357" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">4</text>
<rect x="108" y="326" width="960" height="54" rx="9" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="135" y="347" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.2" font-weight="bold">PLIER</text>
<text x="365" y="347" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.9" font-weight="normal">Préparez tous les pointillés avant de mettre la colle.</text>
<text x="135" y="370" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="11.5" font-weight="bold">Un mauvais pli déforme toutes les dimensions.</text>
<circle cx="72" cy="428" r="20" fill="white" stroke="#222" stroke-width="1.4"/>
<text x="72" y="434" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">5</text>
<rect x="108" y="403" width="960" height="54" rx="9" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="135" y="424" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.2" font-weight="bold">FERMER</text>
<text x="365" y="424" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.9" font-weight="normal">Collez la languette latérale, puis les languettes du haut et le toit.</text>
<circle cx="72" cy="505" r="20" fill="white" stroke="#222" stroke-width="1.4"/>
<text x="72" y="511" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">6</text>
<rect x="108" y="480" width="960" height="54" rx="9" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="135" y="501" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.2" font-weight="bold">POSER À BLANC</text>
<text x="365" y="501" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.9" font-weight="normal">Placez toutes les pièces sur la base sans les coller.</text>
<text x="135" y="524" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="11.5" font-weight="bold">Si une pièce est mal placée, déplacez-la maintenant.</text>
<circle cx="72" cy="582" r="20" fill="white" stroke="#222" stroke-width="1.4"/>
<text x="72" y="588" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">7</text>
<rect x="108" y="557" width="960" height="54" rx="9" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="135" y="578" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.2" font-weight="bold">MESURER</text>
<text x="365" y="578" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.9" font-weight="normal">Contrôlez encombrement, hauteur et passages.</text>
<text x="135" y="601" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="11.5" font-weight="bold">Une remarque utile contient une mesure ou un comptage.</text>
<circle cx="72" cy="659" r="20" fill="white" stroke="#222" stroke-width="1.4"/>
<text x="72" y="665" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">8</text>
<rect x="108" y="634" width="960" height="54" rx="9" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="135" y="655" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.2" font-weight="bold">COLLER ET TESTER</text>
<text x="365" y="655" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.9" font-weight="normal">Fixez seulement après validation puis testez la stabilité.</text>
<rect x="140" y="720" width="845" height="48" rx="10" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
<text x="562" y="750" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">DÉCOUPER → PLIER → MONTAGE À BLANC → MESURER → COLLER</text>
</svg>