<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="42" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="bold">S47 – Construire uniquement avec du papier</text>
<text x="40" y="72" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="normal">Découper, plier, coller, mesurer, tester puis représenter.</text>
<circle cx="72" cy="120" r="20" fill="white" stroke="#222" stroke-width="1.4"/>
<text x="72" y="126" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">1</text>
<rect x="108" y="95" width="960" height="54" rx="9" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="135" y="116" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.2" font-weight="bold">LIRE</text>
<text x="365" y="116" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal">Entourer les hauteurs, les quantités, les ouvertures et les tests.</text>
<circle cx="72" cy="197" r="20" fill="white" stroke="#222" stroke-width="1.4"/>
<text x="72" y="203" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">2</text>
<rect x="108" y="172" width="960" height="54" rx="9" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="135" y="193" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.2" font-weight="bold">CALCULER</text>
<text x="365" y="193" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal">Additionner les unités représentées avant de construire.</text>
<text x="135" y="216" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="11.5" font-weight="bold">Le calcul précède le découpage.</text>
<circle cx="72" cy="274" r="20" fill="white" stroke="#222" stroke-width="1.4"/>
<text x="72" y="280" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">3</text>
<rect x="108" y="249" width="960" height="54" rx="9" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="135" y="270" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.2" font-weight="bold">IMPLANTER</text>
<text x="365" y="270" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal">Dessiner la position des éléments et indiquer la façade.</text>
<circle cx="72" cy="351" r="20" fill="white" stroke="#222" stroke-width="1.4"/>
<text x="72" y="357" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">4</text>
<rect x="108" y="326" width="960" height="54" rx="9" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="135" y="347" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.2" font-weight="bold">DÉCOUPER</text>
<text x="365" y="347" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal">Suivre uniquement le contour extérieur en trait continu.</text>
<text x="135" y="370" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="11.5" font-weight="bold">Les pointillés ne sont pas des lignes de découpe.</text>
<circle cx="72" cy="428" r="20" fill="white" stroke="#222" stroke-width="1.4"/>
<text x="72" y="434" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">5</text>
<rect x="108" y="403" width="960" height="54" rx="9" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="135" y="424" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.2" font-weight="bold">PLIER ET COLLER</text>
<text x="365" y="424" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal">Marquer les pointillés puis utiliser les languettes.</text>
<circle cx="72" cy="505" r="20" fill="white" stroke="#222" stroke-width="1.4"/>
<text x="72" y="511" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">6</text>
<rect x="108" y="480" width="960" height="54" rx="9" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="135" y="501" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.2" font-weight="bold">CONTRÔLER</text>
<text x="365" y="501" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal">Mesurer les hauteurs, compter les unités et tester les passages.</text>
<text x="135" y="524" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="11.5" font-weight="bold">Écrire une valeur observée, pas seulement « validé ». </text>
<circle cx="72" cy="582" r="20" fill="white" stroke="#222" stroke-width="1.4"/>
<text x="72" y="588" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">7</text>
<rect x="108" y="557" width="960" height="54" rx="9" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="135" y="578" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.2" font-weight="bold">DESSINER</text>
<text x="365" y="578" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal">Produire les vues de face, de droite et de dessus.</text>
<circle cx="72" cy="659" r="20" fill="white" stroke="#222" stroke-width="1.4"/>
<text x="72" y="665" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">8</text>
<rect x="108" y="634" width="960" height="54" rx="9" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="135" y="655" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.2" font-weight="bold">CORRIGER</text>
<text x="365" y="655" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal">Réparer le défaut prioritaire puis refaire le test concerné.</text>
<rect x="150" y="720" width="825" height="48" rx="10" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
<text x="562" y="750" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16.2" font-weight="bold">À rendre : prototype papier + tests + trois vues + correction</text>
</svg>