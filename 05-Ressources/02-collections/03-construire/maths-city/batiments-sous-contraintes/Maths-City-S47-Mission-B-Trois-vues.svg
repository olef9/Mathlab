<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="35" y="38" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="25.5" font-weight="bold">S47 – Équipe B – Le bâtiment à partir de trois vues</text>
<rect x="35" y="88" width="1053" height="100" rx="12" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
<text x="55" y="120" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">OBJECTIF</text>
<text x="180" y="120" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">Reproduire un bâtiment de 11 unités à partir d’un tableau de hauteurs.</text>
<text x="55" y="160" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">À RENDRE</text>
<text x="180" y="160" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="normal">prototype + tableau + trois vues</text>
<rect x="35" y="215" width="650" height="410" rx="12" fill="white" stroke="#222" stroke-width="1.4"/>
<text x="360" y="246" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16.5" font-weight="bold">TRAVAIL À FAIRE DANS L’ORDRE</text>
<circle cx="68" cy="285" r="13" fill="white" stroke="#222" stroke-width="1.1"/>
<text x="68" y="290" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">1</text>
<text x="95" y="276" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="normal">Identifier les sept cases non nulles du tableau 2-1-0 /</text>
<text x="95" y="293" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="normal">3-2-1 / 1-1-0.</text>
<circle cx="68" cy="343" r="13" fill="white" stroke="#222" stroke-width="1.1"/>
<text x="68" y="348" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">2</text>
<text x="95" y="334" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="normal">Associer à chaque case la colonne de hauteur</text>
<text x="95" y="351" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="normal">correspondante.</text>
<circle cx="68" cy="401" r="13" fill="white" stroke="#222" stroke-width="1.1"/>
<text x="68" y="406" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">3</text>
<text x="95" y="392" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="normal">Orienter la première ligne du tableau du côté de la façade.</text>
<circle cx="68" cy="459" r="13" fill="white" stroke="#222" stroke-width="1.1"/>
<text x="68" y="464" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">4</text>
<text x="95" y="450" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="normal">Coller les sept colonnes sur les bonnes cases.</text>
<circle cx="68" cy="517" r="13" fill="white" stroke="#222" stroke-width="1.1"/>
<text x="68" y="522" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">5</text>
<text x="95" y="508" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="normal">Comparer la silhouette de face aux hauteurs 3, 2, 1.</text>
<circle cx="68" cy="575" r="13" fill="white" stroke="#222" stroke-width="1.1"/>
<text x="68" y="580" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">6</text>
<text x="95" y="566" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="normal">Comparer la silhouette de droite aux hauteurs 2, 3, 1.</text>
<rect x="715" y="215" width="373" height="410" rx="12" fill="white" stroke="#222" stroke-width="1.4"/>
<text x="901" y="246" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">TESTS OBLIGATOIRES</text>
<circle cx="750" cy="287" r="13" fill="white" stroke="#222" stroke-width="1.1"/>
<text x="750" y="292" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">1</text>
<text x="778" y="278" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="normal">7 colonnes</text>
<circle cx="750" cy="345" r="13" fill="white" stroke="#222" stroke-width="1.1"/>
<text x="750" y="350" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">2</text>
<text x="778" y="336" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="normal">11 unités</text>
<circle cx="750" cy="403" r="13" fill="white" stroke="#222" stroke-width="1.1"/>
<text x="750" y="408" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">3</text>
<text x="778" y="394" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="normal">face 3-2-1</text>
<circle cx="750" cy="461" r="13" fill="white" stroke="#222" stroke-width="1.1"/>
<text x="750" y="466" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">4</text>
<text x="778" y="452" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="normal">droite 2-3-1</text>
<circle cx="750" cy="519" r="13" fill="white" stroke="#222" stroke-width="1.1"/>
<text x="750" y="524" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">5</text>
<text x="778" y="510" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="normal">dessus 7 cases</text>
<rect x="35" y="655" width="1053" height="82" rx="11" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
<text x="55" y="684" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">AVANT LE CONTRÔLE</text>
<text x="245" y="684" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">☐ découpes   ☐ plis   ☐ mesures   ☐ total   ☐ stabilité</text>
<text x="55" y="720" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.3" font-weight="bold">Correction de la version 2 : ________________________________________________________________</text>
<text x="40" y="775" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">Le prototype doit tenir sans être maintenu à la main.</text>
</svg>