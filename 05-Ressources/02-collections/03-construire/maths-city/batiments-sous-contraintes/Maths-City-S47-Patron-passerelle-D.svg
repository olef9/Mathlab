<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
<rect width="100%" height="100%" fill="white"/>
<text x="10" y="8" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="5.0" font-weight="bold">S47 D – Patron de passerelle en papier</text>
<text x="10" y="14" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="3.0" font-weight="normal">Imprimer à 100 %. Traits continus : découper · pointillés : plier.</text>
<rect x="10" y="22" width="100" height="40" rx="0" fill="white" stroke="#222" stroke-width="0.45"/>
<text x="60" y="28" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="3.2" font-weight="bold">POUTRE TRIANGULAIRE 1</text>
<line x1="10" y1="32" x2="110" y2="32" stroke="#666" stroke-width="0.3" stroke-dasharray="2 1.5"/>
<line x1="10" y1="42" x2="110" y2="42" stroke="#666" stroke-width="0.3" stroke-dasharray="2 1.5"/>
<line x1="10" y1="52" x2="110" y2="52" stroke="#666" stroke-width="0.3" stroke-dasharray="2 1.5"/>
<text x="60" y="59" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="2.7" font-weight="middle">fermer avec la bande de 10 mm</text>
<rect x="10" y="72" width="100" height="40" rx="0" fill="white" stroke="#222" stroke-width="0.45"/>
<text x="60" y="78" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="3.2" font-weight="bold">POUTRE TRIANGULAIRE 2</text>
<line x1="10" y1="82" x2="110" y2="82" stroke="#666" stroke-width="0.3" stroke-dasharray="2 1.5"/>
<line x1="10" y1="92" x2="110" y2="92" stroke="#666" stroke-width="0.3" stroke-dasharray="2 1.5"/>
<line x1="10" y1="102" x2="110" y2="102" stroke="#666" stroke-width="0.3" stroke-dasharray="2 1.5"/>
<text x="60" y="109" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="2.7" font-weight="middle">fermer avec la bande de 10 mm</text>
<rect x="10" y="122" width="100" height="50" rx="0" fill="white" stroke="#222" stroke-width="0.45"/>
<line x1="10" y1="132" x2="110" y2="132" stroke="#666" stroke-width="0.3" stroke-dasharray="2 1.5"/>
<line x1="10" y1="162" x2="110" y2="162" stroke="#666" stroke-width="0.3" stroke-dasharray="2 1.5"/>
<text x="60" y="148" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="3.3" font-weight="bold">TABLIER 100 × 50 mm</text>
<text x="60" y="168" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="2.6" font-weight="middle">plier les bords de 10 mm vers le bas</text>
<rect x="125" y="22" width="30" height="50" rx="0" fill="white" stroke="#222" stroke-width="0.45"/>
<line x1="140" y1="22" x2="140" y2="72" stroke="#666" stroke-width="0.3" stroke-dasharray="2 1.5"/>
<text x="140" y="44" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="3.0" font-weight="bold">PIED 1</text>
<text x="140" y="59" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="2.6" font-weight="middle">pli à 90°</text>
<rect x="165" y="22" width="30" height="50" rx="0" fill="white" stroke="#222" stroke-width="0.45"/>
<line x1="180" y1="22" x2="180" y2="72" stroke="#666" stroke-width="0.3" stroke-dasharray="2 1.5"/>
<text x="180" y="44" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="3.0" font-weight="bold">PIED 2</text>
<text x="180" y="59" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="2.6" font-weight="middle">pli à 90°</text>
<rect x="125" y="82" width="30" height="50" rx="0" fill="white" stroke="#222" stroke-width="0.45"/>
<line x1="140" y1="82" x2="140" y2="132" stroke="#666" stroke-width="0.3" stroke-dasharray="2 1.5"/>
<text x="140" y="104" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="3.0" font-weight="bold">PIED 3</text>
<text x="140" y="119" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="2.6" font-weight="middle">pli à 90°</text>
<rect x="165" y="82" width="30" height="50" rx="0" fill="white" stroke="#222" stroke-width="0.45"/>
<line x1="180" y1="82" x2="180" y2="132" stroke="#666" stroke-width="0.3" stroke-dasharray="2 1.5"/>
<text x="180" y="104" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="3.0" font-weight="bold">PIED 4</text>
<text x="180" y="119" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="2.6" font-weight="middle">pli à 90°</text>
<rect x="120" y="150" width="80" height="105" rx="2" fill="#f4f4f4" stroke="#222" stroke-width="0.4"/>
<text x="160" y="158" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="3.5" font-weight="bold">MONTAGE</text>
<text x="124" y="170" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="3.0" font-weight="normal">1. former deux poutres</text>
<text x="124" y="183" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="3.0" font-weight="normal">2. plier le tablier en U</text>
<text x="124" y="196" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="3.0" font-weight="normal">3. coller les poutres dessous</text>
<text x="124" y="209" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="3.0" font-weight="normal">4. plier les quatre pieds</text>
<text x="124" y="222" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="3.0" font-weight="bold">5. placer les pieds hors route</text>
<text x="124" y="235" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="3.0" font-weight="bold">6. tester avec la gomme</text>
<text x="10" y="205" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="3.2" font-weight="bold">La route de 30 mm doit rester entièrement libre sous la passerelle.</text>
<text x="10" y="214" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="3.2" font-weight="bold">Hauteur libre minimale : 45 mm.</text>
<text x="10" y="223" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="3.2" font-weight="bold">Le tablier doit supporter la même gomme pendant 10 secondes.</text>
</svg>