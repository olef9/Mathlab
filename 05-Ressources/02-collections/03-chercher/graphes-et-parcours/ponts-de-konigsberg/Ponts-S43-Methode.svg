<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#222"/>
</marker>
</defs>
<text x="40" y="42" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="bold">S43 – Méthode d’enquête</text>
<text x="40" y="72" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="normal">Passer des essais à un argument.</text>
<circle cx="80" cy="142" r="24" fill="white" stroke="#222" stroke-width="1.7"/>
<text x="80" y="150" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="bold">1</text>
<rect x="125" y="112" width="930" height="65" rx="11" fill="white" stroke="#222" stroke-width="1.4"/>
<text x="155" y="138" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">SIMPLIFIER</text>
<text x="335" y="138" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal">Remplacer chaque zone par un point et chaque pont par un trait.</text>
<text x="155" y="164" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="bold">La forme exacte des terres n’est plus importante.</text>
<circle cx="80" cy="236" r="24" fill="white" stroke="#222" stroke-width="1.7"/>
<text x="80" y="244" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="bold">2</text>
<rect x="125" y="206" width="930" height="65" rx="11" fill="white" stroke="#222" stroke-width="1.4"/>
<text x="155" y="232" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">ESSAYER</text>
<text x="335" y="232" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal">Tester plusieurs départs et conserver la trace des blocages.</text>
<text x="155" y="258" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="bold">Un échec isolé ne prouve rien.</text>
<circle cx="80" cy="330" r="24" fill="white" stroke="#222" stroke-width="1.7"/>
<text x="80" y="338" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="bold">3</text>
<rect x="125" y="300" width="930" height="65" rx="11" fill="white" stroke="#222" stroke-width="1.4"/>
<text x="155" y="326" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">COMPTER</text>
<text x="335" y="326" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal">Calculer le degré de chaque zone.</text>
<text x="155" y="352" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="bold">Chaque liaison touche deux zones.</text>
<circle cx="80" cy="424" r="24" fill="white" stroke="#222" stroke-width="1.7"/>
<text x="80" y="432" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="bold">4</text>
<rect x="125" y="394" width="930" height="65" rx="11" fill="white" stroke="#222" stroke-width="1.4"/>
<text x="155" y="420" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">ENTOURER</text>
<text x="335" y="420" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal">Repérer les zones de degré impair.</text>
<text x="155" y="446" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="bold">Pair : les liaisons peuvent être associées.</text>
<circle cx="80" cy="518" r="24" fill="white" stroke="#222" stroke-width="1.7"/>
<text x="80" y="526" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="bold">5</text>
<rect x="125" y="488" width="930" height="65" rx="11" fill="white" stroke="#222" stroke-width="1.4"/>
<text x="155" y="514" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">COMPARER</text>
<text x="335" y="514" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal">Mettre en relation nombre de zones impaires et type de parcours.</text>
<text x="155" y="540" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="bold">0, 2, 4… zones impaires ne donnent pas le même résultat.</text>
<circle cx="80" cy="612" r="24" fill="white" stroke="#222" stroke-width="1.7"/>
<text x="80" y="620" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="bold">6</text>
<rect x="125" y="582" width="930" height="65" rx="11" fill="white" stroke="#222" stroke-width="1.4"/>
<text x="155" y="608" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">ARGUMENTER</text>
<text x="335" y="608" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal">Expliquer les entrées et les sorties par paires.</text>
<text x="155" y="634" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="bold">Dans une zone intermédiaire : une entrée, puis une sortie.</text>
<rect x="165" y="705" width="795" height="55" rx="10" fill="white" stroke="#222" stroke-width="1.8"/>
<text x="562" y="740" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="bold">Plusieurs échecs suggèrent ; un argument prouve.</text>
</svg>