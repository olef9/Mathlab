<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="42" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="bold">S43 – Ce que vous devez rendre</text>
<text x="40" y="72" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="normal">Un essai visible, un comptage et une conclusion vérifiable.</text>
<circle cx="75" cy="133" r="23" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="75" y="140" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">1</text>
<rect x="120" y="105" width="945" height="62" rx="10" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="150" y="131" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="16.5" font-weight="bold">REPÉRER</text>
<text x="330" y="129" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="normal">Compter les zones et les liaisons du réseau.</text>
<circle cx="75" cy="224" r="23" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="75" y="231" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">2</text>
<rect x="120" y="196" width="945" height="62" rx="10" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="150" y="222" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="16.5" font-weight="bold">ESSAYER</text>
<text x="330" y="220" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="normal">Choisir un départ et numéroter les liaisons 1, 2, 3…</text>
<circle cx="75" cy="315" r="23" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="75" y="322" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">3</text>
<rect x="120" y="287" width="945" height="62" rx="10" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="150" y="313" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="16.5" font-weight="bold">CONSERVER</text>
<text x="330" y="311" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="normal">Noter le blocage ou l’arrivée ; ne pas effacer les échecs.</text>
<circle cx="75" cy="406" r="23" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="75" y="413" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">4</text>
<rect x="120" y="378" width="945" height="62" rx="10" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="150" y="404" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="16.5" font-weight="bold">COMPTER</text>
<text x="330" y="402" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="normal">Calculer le degré de chaque zone et repérer pair ou impair.</text>
<circle cx="75" cy="497" r="23" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="75" y="504" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">5</text>
<rect x="120" y="469" width="945" height="62" rx="10" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="150" y="495" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="16.5" font-weight="bold">PRODUIRE</text>
<text x="330" y="493" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="normal">Donner un parcours, un circuit, une preuve ou une réparation.</text>
<circle cx="75" cy="588" r="23" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="75" y="595" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">6</text>
<rect x="120" y="560" width="945" height="62" rx="10" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="150" y="586" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="16.5" font-weight="bold">FAIRE VÉRIFIER</text>
<text x="330" y="584" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="normal">Une autre équipe contrôle continuité, répétitions et degrés.</text>
<rect x="165" y="680" width="795" height="70" rx="12" fill="#f3f3f3" stroke="#222" stroke-width="1.5"/>
<text x="562" y="710" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">Impossible ne signifie pas « nous n’avons pas trouvé ».</text>
<text x="562" y="738" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">Il faut expliquer pourquoi aucun parcours ne peut fonctionner.</text>
</svg>