<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="42" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="bold">S43 – Solutions corrigées</text>
<text x="40" y="70" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal">Les suites proposées sont des exemples.</text>
<rect x="40" y="105" width="1040" height="102" rx="11" fill="white" stroke="#222" stroke-width="1.3"/>
<circle cx="78" cy="139" r="19" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="78" y="145" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">A</text>
<text x="120" y="131" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.8" font-weight="bold">N=3, S=3, I=5, P=3</text>
<text x="120" y="163" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal">4 zones impaires</text>
<text x="570" y="138" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">Impossible.</text>
<rect x="40" y="231" width="1040" height="102" rx="11" fill="white" stroke="#222" stroke-width="1.3"/>
<circle cx="78" cy="265" r="19" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="78" y="271" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">B</text>
<text x="120" y="257" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.8" font-weight="bold">A=3, B=2, C=3, D=2</text>
<text x="120" y="289" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal">A et C</text>
<text x="570" y="264" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">A → B → C → D → A → C</text>
<rect x="40" y="357" width="1040" height="102" rx="11" fill="white" stroke="#222" stroke-width="1.3"/>
<circle cx="78" cy="391" r="19" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="78" y="397" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">C</text>
<text x="120" y="383" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.8" font-weight="bold">A=4, B=2, C=2, D=2, E=2</text>
<text x="120" y="415" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal">0 zone impaire</text>
<text x="570" y="390" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">A → B → C → A → D → E → A</text>
<rect x="40" y="483" width="1040" height="102" rx="11" fill="white" stroke="#222" stroke-width="1.3"/>
<circle cx="78" cy="517" r="19" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="78" y="523" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">D</text>
<text x="120" y="509" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.8" font-weight="bold">O=3, A=1, B=1, C=1</text>
<text x="120" y="541" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal">4 zones impaires</text>
<text x="570" y="516" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">Impossible.</text>
<rect x="40" y="609" width="1040" height="102" rx="11" fill="white" stroke="#222" stroke-width="1.3"/>
<circle cx="78" cy="643" r="19" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="78" y="649" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">E</text>
<text x="120" y="635" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.8" font-weight="bold">après ajout N–S : 4, 4, 5, 3</text>
<text x="120" y="667" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal">I et P</text>
<text x="570" y="642" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">Parcours ouvert possible.</text>
<text x="50" y="765" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">0 impaire : circuit · 2 impaires : parcours ouvert · 4 ou plus : impossible</text>
</svg>