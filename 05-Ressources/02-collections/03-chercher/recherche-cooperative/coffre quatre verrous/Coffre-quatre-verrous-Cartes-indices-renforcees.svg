<text x="596" y="155" font-family="Arial" font-size="15" font-weight="bold">A</text>
<text x="761" y="271" font-family="Arial" font-size="15" font-weight="bold">B</text>
<text x="823" y="174" font-family="Arial" font-size="15">Va de A à B par un chemin</text>
<text x="823" y="198" font-family="Arial" font-size="15">le plus court.</text>
<text x="823" y="235" font-family="Arial" font-size="15">Tu peux aller seulement</text>
<text x="823" y="259" font-family="Arial" font-size="15">à droite ou vers le bas.</text>
<text x="823" y="296" font-family="Arial" font-size="15">Le segment barré est interdit.</text>
<text x="595" y="362" font-family="Arial" font-size="14">Combien de chemins différents restent possibles ? Justifie ta liste.</text>
<polygon points="117.0,517.0 128.8,548.8 162.7,550.2 136.0,571.2 145.2,603.8 117.0,585.0 88.8,603.8 98.0,571.2 71.3,550.2 105.2,548.8" fill="none" stroke="#111" stroke-width="2.5"/>
<text x="195" y="508" font-family="Arial" font-size="15">Utilise une seule fois chacun des chiffres :</text>
<text x="300" y="540" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">1   2   3   4</text>
<text x="195" y="573" font-family="Arial" font-size="15">Forme deux nombres à deux chiffres.</text>
<text x="195" y="601" font-family="Arial" font-size="15">Leur différence vaut 3 × Cercle.</text>
<text x="195" y="629" font-family="Arial" font-size="15">Le plus grand nombre est pair.</text>
<text x="57" y="672" font-family="Arial" font-size="14">Étoile est le chiffre des dizaines du plus grand nombre.</text>
<text x="57" y="700" font-family="Arial" font-size="14">Tu dois connaître le chiffre Cercle pour terminer.</text>
<polygon points="655,508 608,610 702,610" fill="none" stroke="#111" stroke-width="2.5"/>
<text x="733" y="508" font-family="Arial" font-size="15">Utilise une seule fois chacun des chiffres :</text>
<text x="838" y="540" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">2   3   5   7</text>
<text x="733" y="573" font-family="Arial" font-size="15">Forme deux nombres à deux chiffres.</text>
<text x="733" y="601" font-family="Arial" font-size="15">Leur différence vaut 5 × Carré − 1.</text>
<text x="595" y="656" font-family="Arial" font-size="14">Triangle est le chiffre des dizaines du plus grand nombre.</text>
<text x="595" y="685" font-family="Arial" font-size="14">Prouve qu’une autre disposition ne convient pas.</text>
<text x="595" y="710" font-family="Arial" font-size="14">Tu dois connaître le chiffre Carré pour terminer.</text>
</svg>