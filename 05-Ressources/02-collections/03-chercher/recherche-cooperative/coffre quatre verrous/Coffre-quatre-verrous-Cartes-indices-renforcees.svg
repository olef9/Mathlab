<text x="245" y="177" font-family="Arial" font-size="16">Compte tous les carrés,</text>
<text x="245" y="202" font-family="Arial" font-size="16">de toutes les tailles.</text>
<text x="245" y="242" font-family="Arial" font-size="15">Le résultat comporte deux chiffres.</text>
<text x="245" y="269" font-family="Arial" font-size="15">Le verrou garde le chiffre des unités.</text>
<text x="57" y="362" font-family="Arial" font-size="14">Classe ta recherche par taille pour prouver que tu n’as rien oublié.</text>
