<text x="42" y="40" font-family="Arial" font-size="25" font-weight="bold">Le coffre des quatre verrous – Cartes renforcées</text>
<text x="42" y="66" font-family="Arial" font-size="14">Découper les cartes. Les experts Étoile et Triangle devront demander un résultat à leur équipe.</text>
