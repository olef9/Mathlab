<rect x="28" y="35" width="515" height="195" rx="10" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="42" y="63" class="role">MISSION A</text>
<text x="42" y="91" class="txt">1. Commence seul : carte CARRÉ.</text>
<text x="42" y="115" class="txt">2. Explique ton résultat à ton partenaire.</text>
<text x="42" y="139" class="txt">3. Écoute et vérifie son raisonnement.</text>
<text x="42" y="163" class="txt">4. Puis prends la carte ÉTOILE.</text>
<text x="42" y="187" class="txt">5. Pour finir, tu as besoin du résultat CERCLE.</text>
<text x="42" y="215" class="small">Interdit : annoncer seulement un chiffre.</text>

