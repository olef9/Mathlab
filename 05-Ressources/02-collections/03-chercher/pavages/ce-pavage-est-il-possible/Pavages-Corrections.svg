<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<rect width="100%" height="100%" fill="white"/>
<text x="55" y="65" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="start" fill="#111">S27 - Résultats principaux</text>
<rect x="55" y="102" width="1290" height="58" fill="#fafafa" stroke="#ddd"/>
<text x="75" y="130" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#111">Triangles</text>
<text x="420" y="130" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#111">6 x 60° = 360°</text>
<text x="1220" y="130" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="end" fill="#111">possible</text>
<rect x="55" y="184" width="1290" height="58" fill="#fafafa" stroke="#ddd"/>
<text x="75" y="212" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#111">Carrés</text>
<text x="420" y="212" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#111">4 x 90° = 360°</text>
<text x="1220" y="212" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="end" fill="#111">possible</text>
<rect x="55" y="266" width="1290" height="58" fill="#fafafa" stroke="#ddd"/>
<text x="75" y="294" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#111">Pentagones</text>
<text x="420" y="294" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#111">3 x 108° = 324° ; 4 x 108° = 432°</text>
<text x="1220" y="294" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="end" fill="#111">impossible seuls</text>
<rect x="55" y="348" width="1290" height="58" fill="#fafafa" stroke="#ddd"/>
<text x="75" y="376" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#111">Hexagones</text>
<text x="420" y="376" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#111">3 x 120° = 360°</text>
<text x="1220" y="376" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="end" fill="#111">possible</text>
<rect x="55" y="430" width="1290" height="58" fill="#fafafa" stroke="#ddd"/>
<text x="75" y="458" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#111">Octogones</text>
<text x="420" y="458" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#111">2 x 135° = 270° ; 3 x 135° = 405°</text>
<text x="1220" y="458" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="end" fill="#111">impossible seuls</text>
<rect x="55" y="512" width="1290" height="58" fill="#fafafa" stroke="#ddd"/>
<text x="75" y="540" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#111">Carré + octogones</text>
<text x="420" y="540" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#111">90° + 135° + 135° = 360°</text>
<text x="1220" y="540" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="end" fill="#111">possible</text>
<rect x="55" y="594" width="1290" height="58" fill="#fafafa" stroke="#ddd"/>
<text x="75" y="622" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#111">Triangle + hexagone</text>
<text x="420" y="622" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#111">60° + 120° + 60° + 120° = 360°</text>
<text x="1220" y="622" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="end" fill="#111">possible</text>
</svg>