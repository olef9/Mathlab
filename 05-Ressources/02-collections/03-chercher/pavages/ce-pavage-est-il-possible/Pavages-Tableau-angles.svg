<text x="695" y="475" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="middle" fill="#111">108°</text>
<polygon points="965.0,230.0 1025.6,265.0 1025.6,335.0 965.0,370.0 904.4,335.0 904.4,265.0" fill="#f6f6f6" stroke="#222" stroke-width="2"/>
