<polygon points="1235.0,238.0 1278.8,256.2 1297.0,300.0 1278.8,343.8 1235.0,362.0 1191.2,343.8 1173.0,300.0 1191.2,256.2" fill="#f6f6f6" stroke="#222" stroke-width="2"/>
