<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="42" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="bold">S62 – Parler à un CM2</text>
<text x="40" y="72" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="normal">Le spectateur n&#x27;était pas dans la classe : tout doit être compréhensible sans contexte.</text>
<circle cx="75" cy="138" r="21" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="75" y="145" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">1</text>
<rect x="110" y="110" width="950" height="63" rx="10" fill="#f7f7f7" stroke="#222" stroke-width="1.3"/>
<text x="140" y="134" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">PAS DE NUMÉRO</text>
<text x="365" y="134" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="bold">Ne pas dire S45, S55, S57…</text>
<circle cx="75" cy="231" r="21" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="75" y="238" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">2</text>
<rect x="110" y="203" width="950" height="63" rx="10" fill="#f7f7f7" stroke="#222" stroke-width="1.3"/>
<text x="140" y="227" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">PAS DE JARGON</text>
<text x="365" y="227" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="bold">Expliquer les mots comme prototype, gabarit, échelle…</text>
<circle cx="75" cy="324" r="21" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="75" y="331" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">3</text>
<rect x="110" y="296" width="950" height="63" rx="10" fill="#f7f7f7" stroke="#222" stroke-width="1.3"/>
<text x="140" y="320" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">UNE ACTION</text>
<text x="365" y="320" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="bold">Montrer ce que l&#x27;élève fait réellement.</text>
<circle cx="75" cy="417" r="21" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="75" y="424" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">4</text>
<rect x="110" y="389" width="950" height="63" rx="10" fill="#f7f7f7" stroke="#222" stroke-width="1.3"/>
<text x="140" y="413" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">UNE IDÉE</text>
<text x="365" y="413" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="bold">Dire une seule idée mathématique importante.</text>
<circle cx="75" cy="510" r="21" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="75" y="517" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">5</text>
<rect x="110" y="482" width="950" height="63" rx="10" fill="#f7f7f7" stroke="#222" stroke-width="1.3"/>
<text x="140" y="506" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">UNE PREUVE</text>
<text x="365" y="506" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="bold">Montrer comment on sait que cela fonctionne.</text>
<circle cx="75" cy="603" r="21" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="75" y="610" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">6</text>
<rect x="110" y="575" width="950" height="63" rx="10" fill="#f7f7f7" stroke="#222" stroke-width="1.3"/>
<text x="140" y="599" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">COURT</text>
<text x="365" y="599" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="bold">60 à 75 secondes suffisent.</text>
<rect x="160" y="690" width="805" height="58" rx="10" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="562" y="726" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.2" font-weight="bold">Question finale : un CM2 comprend-il ce qu&#x27;on fait à Math&#x27;Lab ?</text>
</svg>