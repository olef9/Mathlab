<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="42" text-anchor="start" font-family="Arial" font-size="28" font-weight="bold">Repères de contenu – Trioz et Mayas</text>
<text x="40" y="70" text-anchor="start" font-family="Arial" font-size="14" font-weight="normal">Document de travail : vérifier les règles avant de produire.</text>
<rect x="45" y="105" width="500" height="610" rx="14" fill="white" stroke="#222" stroke-width="2"/>
<text x="295" y="145" text-anchor="middle" font-family="Arial" font-size="25" font-weight="bold">TRIOZ</text>
<text x="75" y="190" text-anchor="start" font-family="Arial" font-size="16" font-weight="bold">Chiffres disponibles :</text>
<rect x="135" y="215" width="65" height="65" rx="10" fill="white" stroke="#222" stroke-width="2"/>
<text x="167" y="258" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold">0</text>
<rect x="230" y="215" width="65" height="65" rx="10" fill="white" stroke="#222" stroke-width="2"/>
<text x="262" y="258" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold">1</text>
<rect x="325" y="215" width="65" height="65" rx="10" fill="white" stroke="#222" stroke-width="2"/>
<text x="357" y="258" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold">2</text>
<text x="75" y="320" text-anchor="start" font-family="Arial" font-size="16" font-weight="bold">Valeur des positions :</text>
<text x="295" y="360" text-anchor="middle" font-family="Arial" font-size="23" font-weight="bold">27   |   9   |   3   |   1</text>
<text x="75" y="410" text-anchor="start" font-family="Arial" font-size="16" font-weight="bold">Exemple :</text>
<text x="95" y="450" text-anchor="start" font-family="Arial" font-size="16" font-weight="normal">1202 = 1×27 + 2×9 + 0×3 + 2×1</text>
<text x="95" y="480" text-anchor="start" font-family="Arial" font-size="20" font-weight="bold">= 47</text>
<text x="75" y="535" text-anchor="start" font-family="Arial" font-size="16" font-weight="bold">Erreur à éviter :</text>
<text x="95" y="570" text-anchor="start" font-family="Arial" font-size="15" font-weight="normal">lire 10 comme dix</text>
<text x="95" y="598" text-anchor="start" font-family="Arial" font-size="15" font-weight="normal">ou additionner seulement les chiffres</text>
<text x="75" y="655" text-anchor="start" font-family="Arial" font-size="16" font-weight="bold">Idée clé : échanges par groupes de 3.</text>
<rect x="578" y="105" width="500" height="610" rx="14" fill="white" stroke="#222" stroke-width="2"/>
<text x="828" y="145" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">NUMÉRATION INSPIRÉE DES MAYAS</text>
<text x="608" y="190" text-anchor="start" font-family="Arial" font-size="16" font-weight="bold">Dans un niveau :</text>
<circle cx="665" cy="240" r="8" fill="#222"/>
<text x="665" y="275" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold">1</text>
<line x1="740" y1="240" x2="795" y2="240" stroke="#222" stroke-width="8" stroke-linecap="round"/>
<text x="768" y="275" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold">5</text>
<ellipse cx="900" cy="239.6" rx="24.0" ry="12.8" fill="white" stroke="#222" stroke-width="1.6"/>
<path d="M 882.4 239.6 Q 900 225.2 917.6 239.6 Q 900 254.0 882.4 239.6" fill="none" stroke="#222" stroke-width="1.2000000000000002"/>
<text x="900" y="275" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold">0</text>
<text x="608" y="320" text-anchor="start" font-family="Arial" font-size="16" font-weight="bold">Valeur des niveaux, du bas vers le haut :</text>
<text x="828" y="360" text-anchor="middle" font-family="Arial" font-size="23" font-weight="bold">1   →   20   →   400</text>
<text x="608" y="410" text-anchor="start" font-family="Arial" font-size="16" font-weight="bold">Exemple : 37</text>
<circle cx="700.0" cy="441.4" r="3.6" fill="#222"/>
<text x="760" y="462" text-anchor="start" font-family="Arial" font-size="15" font-weight="normal">1 × 20</text>
<circle cx="694.4" cy="506.4" r="3.6" fill="#222"/>
<circle cx="705.6" cy="506.4" r="3.6" fill="#222"/>
<line x1="680.0" y1="517.6" x2="720.0" y2="517.6" stroke="#222" stroke-width="4.800000000000001" stroke-linecap="round"/>
<line x1="680.0" y1="527.2" x2="720.0" y2="527.2" stroke="#222" stroke-width="4.800000000000001" stroke-linecap="round"/>
<line x1="680.0" y1="536.8000000000001" x2="720.0" y2="536.8000000000001" stroke="#222" stroke-width="4.800000000000001" stroke-linecap="round"/>
<text x="760" y="540" text-anchor="start" font-family="Arial" font-size="15" font-weight="normal">17 × 1</text>
<text x="930" y="505" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">20 + 17 = 37</text>
<text x="608" y="600" text-anchor="start" font-family="Arial" font-size="16" font-weight="bold">Erreur à éviter :</text>
<text x="628" y="635" text-anchor="start" font-family="Arial" font-size="15" font-weight="normal">placer les unités en haut</text>
<text x="608" y="680" text-anchor="start" font-family="Arial" font-size="16" font-weight="bold">Idée clé : addition dans un niveau,</text>
<text x="608" y="704" text-anchor="start" font-family="Arial" font-size="16" font-weight="bold">position entre les niveaux.</text>
</svg>