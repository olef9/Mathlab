<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="42" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="bold">S58 – Charte d’un tutoriel clair</text>
<text x="40" y="72" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="normal">Le lecteur doit pouvoir agir sans demander d’aide aux auteurs.</text>
<circle cx="72" cy="126" r="20" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
<text x="72" y="132" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">1</text>
<rect x="108" y="100" width="960" height="58" rx="9" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="135" y="122" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">UN OBJECTIF</text>
<text x="365" y="122" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="normal">Écrire en une phrase ce que le lecteur saura faire à la fin.</text>
<circle cx="72" cy="208" r="20" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
<text x="72" y="214" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">2</text>
<rect x="108" y="182" width="960" height="58" rx="9" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="135" y="204" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">4 À 6 ÉTAPES</text>
<text x="365" y="204" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="normal">Numéroter les actions dans l’ordre réel de la manipulation.</text>
<circle cx="72" cy="290" r="20" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
<text x="72" y="296" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">3</text>
<rect x="108" y="264" width="960" height="58" rx="9" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="135" y="286" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">DES VERBES</text>
<text x="365" y="286" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="normal">Commencer par : sélectionne, clique, entre, aligne, duplique, tourne…</text>
<circle cx="72" cy="372" r="20" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
<text x="72" y="378" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">4</text>
<rect x="108" y="346" width="960" height="58" rx="9" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="135" y="368" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">DES VALEURS</text>
<text x="365" y="368" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="normal">Écrire les nombres indispensables : dimensions, angle, quantité…</text>
<circle cx="72" cy="454" r="20" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
<text x="72" y="460" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">5</text>
<rect x="108" y="428" width="960" height="58" rx="9" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="135" y="450" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">DES IMAGES UTILES</text>
<text x="365" y="450" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="normal">Montrer un bouton, une sélection, une valeur ou le résultat attendu.</text>
<circle cx="72" cy="536" r="20" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
<text x="72" y="542" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">6</text>
<rect x="108" y="510" width="960" height="58" rx="9" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="135" y="532" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">UN CONTRÔLE</text>
<text x="365" y="532" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="normal">Dire comment vérifier que la manipulation est réussie.</text>
<circle cx="72" cy="618" r="20" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
<text x="72" y="624" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">7</text>
<rect x="108" y="592" width="960" height="58" rx="9" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="135" y="614" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">UNE ERREUR À ÉVITER</text>
<text x="365" y="614" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="normal">Prévenir le lecteur d’un piège fréquent.</text>
<rect x="155" y="704" width="815" height="54" rx="10" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
<text x="562" y="738" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">Un bon tutoriel décrit ce que le lecteur doit faire, pas ce que les auteurs ont fait.</text>
</svg>