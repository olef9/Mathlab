<text x="87" y="339" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">1</text>
<text x="212.5" y="336" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold">TOUJOURS PRENDRE 1</text>
<text x="79" y="376" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="normal">Au premier tour, prendre un jeton.</text>
<text x="79" y="405" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="normal">Faire de même à chaque tour.</text>
<rect x="404" y="300" width="315" height="290" rx="12" fill="white" stroke="#222" stroke-width="1.7"/>
<circle cx="436" cy="332" r="20" fill="white" stroke="#222" stroke-width="1.7"/>
<text x="436" y="339" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">2</text>
<text x="561.5" y="336" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold">TOUJOURS PRENDRE 3</text>
<text x="428" y="376" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="normal">Au premier tour, prendre trois jetons.</text>
<text x="428" y="405" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="normal">Faire de même à chaque tour.</text>
<rect x="753" y="300" width="315" height="290" rx="12" fill="white" stroke="#222" stroke-width="1.7"/>
<circle cx="785" cy="332" r="20" fill="white" stroke="#222" stroke-width="1.7"/>
<text x="785" y="339" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">3</text>
<text x="910.5" y="336" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold">COMPLÉTER À 4</text>
<text x="777" y="376" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="normal">Prendre 3 au premier tour.</text>
<text x="777" y="405" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="normal">Ensuite, faire en sorte que les deux</text>
<text x="777" y="426" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="normal">prises du tour totalisent 4.</text>
<text x="55" y="640" text-anchor="start" font-family="Arial" font-size="17" font-weight="bold">Travail demandé</text>
<text x="55" y="670" text-anchor="start" font-family="Arial" font-size="14.5" font-weight="normal">Jouer plusieurs parties. Choisir la stratégie qui ne dépend pas des erreurs de l’adversaire. Préparer une</text>
<text x="55" y="692" text-anchor="start" font-family="Arial" font-size="14.5" font-weight="normal">suite de positions comme preuve.</text>
<text x="55" y="735" text-anchor="start" font-family="Arial" font-size="14" font-weight="bold">Positions à laisser : ______________________________________________________________________________</text>
