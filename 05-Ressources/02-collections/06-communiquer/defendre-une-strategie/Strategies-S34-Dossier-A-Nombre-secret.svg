<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="40" text-anchor="start" font-family="Arial" font-size="28" font-weight="bold">Équipe A – Le nombre secret</text>
<text x="40" y="70" text-anchor="start" font-family="Arial" font-size="14" font-weight="normal">Trouver un entier compris entre 1 et 100 avec des questions « plus grand que… ? »</text>
<rect x="55" y="100" width="1010" height="80" rx="10" fill="#f3f3f3" stroke="#222" stroke-width="1.5"/>
<text x="560" y="134" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold">CRITÈRE : garantir le moins de questions possible dans le pire des cas</text>
<text x="560" y="162" text-anchor="start" font-family="Arial" font-size="13" font-weight="middle">Une stratégie doit fonctionner quel que soit le nombre choisi.</text>
<rect x="55" y="210" width="315" height="350" rx="12" fill="white" stroke="#222" stroke-width="1.7"/>
<circle cx="87" cy="242" r="20" fill="white" stroke="#222" stroke-width="1.7"/>
<text x="87" y="249" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">1</text>
<text x="212.5" y="246" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold">DANS L’ORDRE</text>
<text x="79" y="286" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="normal">Demander : plus grand que 1 ? puis plus</text>
<text x="79" y="307" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="normal">grand que 2 ? puis plus grand que 3 ?</text>
<text x="79" y="336" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="normal">Continuer jusqu’à isoler le nombre.</text>
<rect x="404" y="210" width="315" height="350" rx="12" fill="white" stroke="#222" stroke-width="1.7"/>
<circle cx="436" cy="242" r="20" fill="white" stroke="#222" stroke-width="1.7"/>
<text x="436" y="249" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">2</text>
<text x="561.5" y="246" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold">AU HASARD</text>
<text x="428" y="286" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="normal">Choisir à chaque fois un seuil différent</text>
<text x="428" y="307" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="normal">sans règle fixe.</text>
<text x="428" y="336" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="normal">Espérer tomber rapidement près du nombre.</text>
<rect x="753" y="210" width="315" height="350" rx="12" fill="white" stroke="#222" stroke-width="1.7"/>
<circle cx="785" cy="242" r="20" fill="white" stroke="#222" stroke-width="1.7"/>
<text x="785" y="249" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">3</text>
<text x="910.5" y="246" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold">COUPER EN DEUX</text>
<text x="777" y="286" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="normal">Commencer par 50.</text>
<text x="777" y="315" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="normal">Conserver seulement la moitié possible.</text>
<text x="777" y="344" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="normal">Recommencer en coupant encore l’intervalle</text>
<text x="777" y="365" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="normal">en deux.</text>
<text x="55" y="610" text-anchor="start" font-family="Arial" font-size="17" font-weight="bold">Travail demandé</text>
<text x="55" y="640" text-anchor="start" font-family="Arial" font-size="15" font-weight="normal">Comparer les trois stratégies. Estimer le nombre maximal de questions. Choisir celle que vous</text>
<text x="55" y="662" text-anchor="start" font-family="Arial" font-size="15" font-weight="normal">défendrez.</text>
<text x="55" y="720" text-anchor="start" font-family="Arial" font-size="14" font-weight="bold">Preuve prévue : __________________________________________________________________________________</text>
</svg>