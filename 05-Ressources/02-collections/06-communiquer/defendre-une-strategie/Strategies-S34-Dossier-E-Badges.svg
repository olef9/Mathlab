<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="40" text-anchor="start" font-family="Arial" font-size="28" font-weight="bold">Équipe E – Le stand de badges</text>
<text x="40" y="70" text-anchor="start" font-family="Arial" font-size="14" font-weight="normal">Produire 140 badges le plus rapidement possible.</text>
<rect x="55" y="100" width="1010" height="90" rx="10" fill="#f3f3f3" stroke="#222" stroke-width="1.5"/>
<text x="560" y="132" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Machine A : 20 badges/min après 2 min de réglage</text>
<text x="560" y="162" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Machine B : 10 badges/min immédiatement</text>
<rect x="55" y="230" width="315" height="330" rx="12" fill="white" stroke="#222" stroke-width="1.7"/>
<circle cx="87" cy="262" r="20" fill="white" stroke="#222" stroke-width="1.7"/>
<text x="87" y="269" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">1</text>
<text x="212.5" y="266" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold">MACHINE A SEULE</text>
<text x="79" y="306" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="normal">Attendre le réglage.</text>
<text x="79" y="335" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="normal">Puis produire les 140 badges avec A.</text>
<rect x="404" y="230" width="315" height="330" rx="12" fill="white" stroke="#222" stroke-width="1.7"/>
<circle cx="436" cy="262" r="20" fill="white" stroke="#222" stroke-width="1.7"/>
<text x="436" y="269" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">2</text>
<text x="561.5" y="266" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold">MACHINE B SEULE</text>
<text x="428" y="306" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="normal">Commencer immédiatement.</text>
<text x="428" y="335" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="normal">Produire les 140 badges avec B.</text>
<rect x="753" y="230" width="315" height="330" rx="12" fill="white" stroke="#222" stroke-width="1.7"/>
<circle cx="785" cy="262" r="20" fill="white" stroke="#222" stroke-width="1.7"/>
<text x="785" y="269" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">3</text>
<text x="910.5" y="266" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold">LES DEUX EN PARALLÈLE</text>
<text x="777" y="306" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="normal">B produit pendant le réglage de A.</text>
<text x="777" y="335" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="normal">Après deux minutes, A et B travaillent</text>
<text x="777" y="356" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="normal">ensemble.</text>
<text x="55" y="620" text-anchor="start" font-family="Arial" font-size="17" font-weight="bold">Tableau de calcul</text>
<rect x="55" y="645" width="250" height="45" rx="0" fill="#eeeeee" stroke="#222" stroke-width="1.2"/>
<text x="180.0" y="674" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">Stratégie</text>
<rect x="305" y="645" width="230" height="45" rx="0" fill="#eeeeee" stroke="#222" stroke-width="1.2"/>
<text x="420.0" y="674" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">Temps de réglage</text>
<rect x="535" y="645" width="300" height="45" rx="0" fill="#eeeeee" stroke="#222" stroke-width="1.2"/>
<text x="685.0" y="674" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">Production</text>
<rect x="835" y="645" width="230" height="45" rx="0" fill="#eeeeee" stroke="#222" stroke-width="1.2"/>
<text x="950.0" y="674" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold">Temps total</text>
<rect x="55" y="690" width="250" height="30" rx="0" fill="white" stroke="#222" stroke-width="1"/>
<rect x="305" y="690" width="230" height="30" rx="0" fill="white" stroke="#222" stroke-width="1"/>
<rect x="535" y="690" width="300" height="30" rx="0" fill="white" stroke="#222" stroke-width="1"/>
<rect x="835" y="690" width="230" height="30" rx="0" fill="white" stroke="#222" stroke-width="1"/>
<rect x="55" y="720" width="250" height="30" rx="0" fill="white" stroke="#222" stroke-width="1"/>
<rect x="305" y="720" width="230" height="30" rx="0" fill="white" stroke="#222" stroke-width="1"/>
<rect x="535" y="720" width="300" height="30" rx="0" fill="white" stroke="#222" stroke-width="1"/>
<rect x="835" y="720" width="230" height="30" rx="0" fill="white" stroke="#222" stroke-width="1"/>
<rect x="55" y="750" width="250" height="30" rx="0" fill="white" stroke="#222" stroke-width="1"/>
<rect x="305" y="750" width="230" height="30" rx="0" fill="white" stroke="#222" stroke-width="1"/>
<rect x="535" y="750" width="300" height="30" rx="0" fill="white" stroke="#222" stroke-width="1"/>
<rect x="835" y="750" width="230" height="30" rx="0" fill="white" stroke="#222" stroke-width="1"/>
<text x="55" y="785" text-anchor="start" font-family="Arial" font-size="12" font-weight="normal"></text>
</svg>