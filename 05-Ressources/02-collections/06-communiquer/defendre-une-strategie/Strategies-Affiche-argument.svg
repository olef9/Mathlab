<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="40" text-anchor="start" font-family="Arial" font-size="30" font-weight="bold">Construire un argument mathématique</text>
<text x="40" y="70" text-anchor="start" font-family="Arial" font-size="16" font-weight="normal">Convaincre = permettre à une autre personne de vérifier.</text>
<circle cx="88" cy="155" r="28" fill="white" stroke="#222" stroke-width="2"/>
<text x="88" y="163" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">1</text>
<rect x="135" y="115" width="920" height="82" rx="12" fill="white" stroke="#222" stroke-width="1.7"/>
<text x="165" y="145" text-anchor="start" font-family="Arial" font-size="19" font-weight="bold">AFFIRMATION</text>
<text x="340" y="145" text-anchor="start" font-family="Arial" font-size="15" font-weight="normal">Ce que nous voulons faire accepter.</text>
<text x="165" y="177" text-anchor="start" font-family="Arial" font-size="15" font-weight="bold">Nous affirmons que…</text>
<circle cx="88" cy="270" r="28" fill="white" stroke="#222" stroke-width="2"/>
<text x="88" y="278" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">2</text>
<rect x="135" y="230" width="920" height="82" rx="12" fill="white" stroke="#222" stroke-width="1.7"/>
<text x="165" y="260" text-anchor="start" font-family="Arial" font-size="19" font-weight="bold">PREUVE</text>
<text x="340" y="260" text-anchor="start" font-family="Arial" font-size="15" font-weight="normal">Une donnée, un calcul, un tableau ou un dessin.</text>
<text x="165" y="292" text-anchor="start" font-family="Arial" font-size="15" font-weight="bold">Notre preuve est…</text>
<circle cx="88" cy="385" r="28" fill="white" stroke="#222" stroke-width="2"/>
<text x="88" y="393" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">3</text>
<rect x="135" y="345" width="920" height="82" rx="12" fill="white" stroke="#222" stroke-width="1.7"/>
<text x="165" y="375" text-anchor="start" font-family="Arial" font-size="19" font-weight="bold">LIEN</text>
<text x="340" y="375" text-anchor="start" font-family="Arial" font-size="15" font-weight="normal">Pourquoi cette preuve soutient la conclusion.</text>
<text x="165" y="407" text-anchor="start" font-family="Arial" font-size="15" font-weight="bold">Cela montre que…</text>
<circle cx="88" cy="500" r="28" fill="white" stroke="#222" stroke-width="2"/>
<text x="88" y="508" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">4</text>
<rect x="135" y="460" width="920" height="82" rx="12" fill="white" stroke="#222" stroke-width="1.7"/>
<text x="165" y="490" text-anchor="start" font-family="Arial" font-size="19" font-weight="bold">OBJECTION</text>
<text x="340" y="490" text-anchor="start" font-family="Arial" font-size="15" font-weight="normal">Une question ou une faiblesse possible.</text>
<text x="165" y="522" text-anchor="start" font-family="Arial" font-size="15" font-weight="bold">On pourrait demander…</text>
<circle cx="88" cy="615" r="28" fill="white" stroke="#222" stroke-width="2"/>
<text x="88" y="623" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">5</text>
<rect x="135" y="575" width="920" height="82" rx="12" fill="white" stroke="#222" stroke-width="1.7"/>
<text x="165" y="605" text-anchor="start" font-family="Arial" font-size="19" font-weight="bold">RÉPONSE</text>
<text x="340" y="605" text-anchor="start" font-family="Arial" font-size="15" font-weight="normal">L’élément qui lève l’objection.</text>
<text x="165" y="637" text-anchor="start" font-family="Arial" font-size="15" font-weight="bold">Nous répondons que…</text>
<rect x="205" y="710" width="710" height="52" rx="10" fill="white" stroke="#222" stroke-width="2"/>
<text x="560" y="744" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold">Une réponse vraie sans preuve reste un argument incomplet.</text>
</svg>