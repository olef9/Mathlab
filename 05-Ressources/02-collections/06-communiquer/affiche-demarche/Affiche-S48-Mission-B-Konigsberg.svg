<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="35" y="40" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="26" font-weight="bold">Expliquer une impossibilité</text>
<rect x="35" y="80" width="1053" height="115" rx="12" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
<text x="55" y="112" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">QUESTION</text>
<text x="185" y="112" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">Comment savoir qu’un parcours utilisant chaque pont une seule fois est</text>
<text x="185" y="131" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">impossible ?</text>
<text x="55" y="165" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">TEST DU LECTEUR</text>
<text x="225" y="165" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="normal">Le lecteur doit comprendre le rôle des zones de degré impair.</text>
<rect x="35" y="225" width="650" height="410" rx="12" fill="white" stroke="#222" stroke-width="1.4"/>
<text x="360" y="256" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16.5" font-weight="bold">ÉLÉMENTS OBLIGATOIRES</text>
<rect x="58" y="278" width="35" height="35" rx="8" fill="#f4f4f4" stroke="#222" stroke-width="1.0"/>
<text x="75" y="302" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">1</text>
<text x="110" y="289" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="normal">transformer zones et ponts en graphe</text>
<rect x="58" y="332" width="35" height="35" rx="8" fill="#f4f4f4" stroke="#222" stroke-width="1.0"/>
<text x="75" y="356" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">2</text>
<text x="110" y="343" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="normal">définir le degré</text>
<rect x="58" y="386" width="35" height="35" rx="8" fill="#f4f4f4" stroke="#222" stroke-width="1.0"/>
<text x="75" y="410" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">3</text>
<text x="110" y="397" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="normal">compter les degrés impairs</text>
<rect x="58" y="440" width="35" height="35" rx="8" fill="#f4f4f4" stroke="#222" stroke-width="1.0"/>
<text x="75" y="464" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">4</text>
<text x="110" y="451" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="normal">expliquer les passages par paires</text>
<rect x="58" y="494" width="35" height="35" rx="8" fill="#f4f4f4" stroke="#222" stroke-width="1.0"/>
<text x="75" y="518" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">5</text>
<text x="110" y="505" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="normal">comparer 0, 2 et 4 impairs</text>
<rect x="58" y="548" width="35" height="35" rx="8" fill="#f4f4f4" stroke="#222" stroke-width="1.0"/>
<text x="75" y="572" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">6</text>
<text x="110" y="559" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="normal">conclure sur l’exemple</text>
<rect x="715" y="225" width="373" height="410" rx="12" fill="white" stroke="#222" stroke-width="1.4"/>
<text x="901" y="256" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.8" font-weight="bold">AVANT LE GRAND FORMAT</text>
<text x="755" y="305" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="bold">☐ question recopiée</text>
<text x="755" y="347" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="bold">☐ lecteur cible identifié</text>
<text x="755" y="389" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="bold">☐ 3 à 6 étapes</text>
<text x="755" y="431" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="bold">☐ visuel central choisi</text>
<text x="755" y="473" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="bold">☐ preuve ou test prévu</text>
<text x="755" y="515" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="bold">☐ erreur fréquente écrite</text>
<text x="755" y="557" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="bold">☐ conclusion provisoire</text>
<rect x="35" y="660" width="1053" height="78" rx="11" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
<text x="55" y="687" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">PREUVE ATTENDUE</text>
<text x="230" y="687" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">schéma annoté et tableau 0 / 2 / 4</text>
<text x="700" y="687" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">ERREUR À EXPLIQUER</text>
<text x="890" y="687" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="bold">confondre essais ratés et</text>
<text x="890" y="705" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="bold">preuve</text>
<text x="40" y="775" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">L’affiche doit être utilisable sans aucune explication orale.</text>
</svg>