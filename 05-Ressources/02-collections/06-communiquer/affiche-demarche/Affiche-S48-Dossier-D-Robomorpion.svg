<text x="665" y="218" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="bold">A</text>
<text x="725" y="195" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="normal">bloque la ligne du haut</text>
<rect x="635" y="278" width="60" height="55" rx="9" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
<text x="665" y="313" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="bold">B</text>
<text x="725" y="290" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="normal">prépare une diagonale mais ne</text>
<text x="725" y="308" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="normal">bloque pas</text>
<rect x="635" y="373" width="60" height="55" rx="9" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
