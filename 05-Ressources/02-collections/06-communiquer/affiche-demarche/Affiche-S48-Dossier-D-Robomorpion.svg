<text x="725" y="385" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="normal">prépare une ligne mais ne bloque</text>
<text x="725" y="403" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="normal">pas</text>
<text x="635" y="500" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">Règle générale à extraire :</text>
<text x="635" y="530" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">Avant de préparer son attaque, vérifier si</text>
<text x="635" y="548" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">l’adversaire peut gagner au coup suivant.</text>
<rect x="85" y="640" width="950" height="75" rx="12" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
<text x="560" y="672" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">Victoire immédiate ? → menace adverse ? → blocage ? → seulement ensuite stratégie personnelle</text>
<text x="35" y="760" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">Piège : choisir un coup intéressant sans vérifier la menace immédiate.</text>
