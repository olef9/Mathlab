<text x="520" y="142" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">PROGRAMME À TESTER</text>
<text x="545" y="185" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal">1. avancer de 2 cases</text>
<text x="545" y="227" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">2. aller à droite</text>
<text x="545" y="269" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal">3. avancer de 3 cases</text>
<text x="545" y="311" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal">4. tourner à gauche</text>
<text x="545" y="353" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal">5. avancer d’une case</text>
<text x="545" y="370" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">Quelle instruction est ambiguë ?</text>
<rect x="35" y="545" width="1053" height="145" rx="12" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="55" y="577" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">VOCABULAIRE CONSEILLÉ</text>
<text x="80" y="620" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">avancer de ___ case(s)</text>
<text x="390" y="620" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">tourner à droite</text>
<text x="650" y="620" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">tourner à gauche</text>
<text x="80" y="660" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="normal">départ + orientation obligatoires</text>
<text x="500" y="660" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="normal">instructions numérotées</text>
<text x="35" y="760" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">Piège : « aller à droite » peut signifier tourner ou se déplacer latéralement.</text>
