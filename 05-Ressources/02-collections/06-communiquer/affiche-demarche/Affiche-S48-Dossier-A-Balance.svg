<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="35" y="38" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="26" font-weight="bold">Dossier A – Trouver l’objet lourd parmi neuf</text>
<text x="35" y="68" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="normal">Ces notes sont exactes mais mal organisées. À vous de les transformer en affiche.</text>
<rect x="35" y="100" width="510" height="255" rx="12" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="55" y="132" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">DONNÉES</text>
<text x="70" y="170" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="normal">• Objets : A, B, C, D, E, F, G, H, I.</text>
<text x="70" y="204" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="normal">• Un seul objet est plus lourd.</text>
<text x="70" y="238" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="normal">• Les huit autres ont la même masse.</text>
<text x="70" y="272" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="normal">• Deux pesées maximum.</text>
<text x="70" y="306" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="normal">• Une pesée donne trois verdicts.</text>
<rect x="575" y="100" width="513" height="255" rx="12" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="595" y="132" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">PREMIÈRE PESÉE</text>
<rect x="620" y="175" width="160" height="60" rx="10" fill="#eeeeee" stroke="#222" stroke-width="1.4"/>
<rect x="880" y="175" width="160" height="60" rx="10" fill="#eeeeee" stroke="#222" stroke-width="1.4"/>
<text x="700" y="212" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" font-weight="bold">A B C</text>
<text x="960" y="212" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" font-weight="bold">D E F</text>
<text x="830" y="210" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">contre</text>
<text x="830" y="275" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">G H I restent de côté</text>
<text x="830" y="320" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">Pourquoi des groupes de 3 ?</text>
<rect x="45" y="405" width="310" height="130" rx="12" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="200" y="438" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">gauche plus lourd</text>
<text x="200" y="480" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">suspects A B C</text>
<text x="200" y="515" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="middle">comparer 2 objets</text>
<rect x="405" y="405" width="310" height="130" rx="12" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="560" y="438" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">équilibre</text>
<text x="560" y="480" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">suspects G H I</text>
<text x="560" y="515" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="middle">comparer 2 objets</text>
<rect x="765" y="405" width="310" height="130" rx="12" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="920" y="438" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">droite plus lourd</text>
<text x="920" y="480" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">suspects D E F</text>
<text x="920" y="515" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="middle">comparer 2 objets</text>
<rect x="100" y="590" width="923" height="115" rx="12" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="120" y="620" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">SECONDE PESÉE DANS UN GROUPE X, Y, Z</text>
<text x="140" y="660" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">X plus lourd → X</text>
<text x="420" y="660" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">équilibre → Z</text>
<text x="700" y="660" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">Y plus lourd → Y</text>
<text x="35" y="760" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">Piège à expliquer : une affiche qui oublie l’équilibre ne traite pas les neuf objets.</text>
</svg>