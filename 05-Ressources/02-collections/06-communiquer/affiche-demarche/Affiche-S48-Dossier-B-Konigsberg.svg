<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="35" y="38" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="26" font-weight="bold">Dossier B – Prouver une impossibilité de parcours</text>
<text x="35" y="68" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="normal">Le but est d’expliquer, pas seulement de raconter des essais.</text>
<line x1="250" y1="240" x2="510" y2="145" stroke="#222" stroke-width="2"/>
<line x1="250" y1="240" x2="510" y2="145" stroke="#222" stroke-width="2"/>
<line x1="250" y1="240" x2="510" y2="335" stroke="#222" stroke-width="2"/>
<line x1="250" y1="240" x2="510" y2="335" stroke="#222" stroke-width="2"/>
<line x1="250" y1="240" x2="800" y2="240" stroke="#222" stroke-width="2"/>
<line x1="510" y1="145" x2="800" y2="240" stroke="#222" stroke-width="2"/>
<line x1="510" y1="335" x2="800" y2="240" stroke="#222" stroke-width="2"/>
<circle cx="250" cy="240" r="34" fill="#f4f4f4" stroke="#222" stroke-width="2"/>
<text x="250" y="247" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="bold">A</text>
<circle cx="510" cy="145" r="34" fill="#f4f4f4" stroke="#222" stroke-width="2"/>
<text x="510" y="152" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="bold">B</text>
<circle cx="510" cy="335" r="34" fill="#f4f4f4" stroke="#222" stroke-width="2"/>
<text x="510" y="342" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="bold">C</text>
<circle cx="800" cy="240" r="34" fill="#f4f4f4" stroke="#222" stroke-width="2"/>
<text x="800" y="247" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="bold">D</text>
<rect x="35" y="100" width="930" height="300" rx="12" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="70" y="132" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">GRAPHE DE L’EXEMPLE</text>
<text x="985" y="155" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">degrés :</text>
<text x="985" y="190" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">A = 5</text>
<text x="985" y="225" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">B = 3</text>
<text x="985" y="260" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">C = 3</text>
<text x="985" y="295" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">D = 3</text>
<text x="985" y="340" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">4 impairs</text>
<rect x="35" y="430" width="1053" height="210" rx="12" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="55" y="462" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">IDÉE À EXPLIQUER</text>
<text x="75" y="500" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.4" font-weight="normal">• Le degré d’une zone est le nombre de ponts qui y arrivent.</text>
<text x="75" y="538" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.4" font-weight="normal">• Dans une zone intérieure, on entre puis on ressort : les ponts sont utilisés par paires.</text>
<text x="75" y="576" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.4" font-weight="normal">• Le départ et l’arrivée peuvent créer au maximum deux zones impaires.</text>
<text x="75" y="614" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.4" font-weight="normal">• Avec quatre zones impaires, aucun parcours n’utilise chaque pont exactement une fois.</text>
<rect x="125" y="675" width="873" height="60" rx="10" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="562" y="712" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">0 impaire → circuit possible · 2 impaires → trajet ouvert · 4 ou plus → impossible</text>
<text x="35" y="770" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">Piège : plusieurs essais ratés ne constituent pas une preuve générale.</text>
</svg>