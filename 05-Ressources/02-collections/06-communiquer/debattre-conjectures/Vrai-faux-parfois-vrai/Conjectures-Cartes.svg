<text x="967.0" y="608" text-anchor="middle" font-family="Arial" font-size="16">Deux segments de même longueur</text>
<text x="967.0" y="636" text-anchor="middle" font-family="Arial" font-size="16">sont parallèles.</text>
<text x="858" y="691" font-family="Arial" font-size="12">Classement : __________________</text>
