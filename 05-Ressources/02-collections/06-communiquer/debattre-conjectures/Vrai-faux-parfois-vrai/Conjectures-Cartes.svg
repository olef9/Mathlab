<circle cx="66" cy="553" r="17" fill="white" stroke="#111" stroke-width="2"/>
<text x="66" y="559" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">9</text>
<text x="90" y="558" font-family="Arial" font-size="13" font-weight="bold">GÉOMÉTRIE</text>
<text x="163.0" y="608" text-anchor="middle" font-family="Arial" font-size="16">Un triangle peut avoir</text>
<text x="163.0" y="636" text-anchor="middle" font-family="Arial" font-size="16">deux angles droits.</text>
<text x="54" y="691" font-family="Arial" font-size="12">Classement : __________________</text>
<text x="54" y="714" font-family="Arial" font-size="12">Argument prêt :  ☐</text>
