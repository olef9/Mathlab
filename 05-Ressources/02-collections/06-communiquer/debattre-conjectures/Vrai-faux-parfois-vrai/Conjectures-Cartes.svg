<text x="602" y="336" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">7</text>
<text x="626" y="335" font-family="Arial" font-size="13" font-weight="bold">GÉOMÉTRIE</text>
<text x="699.0" y="385" text-anchor="middle" font-family="Arial" font-size="16">Un carré</text>
<text x="699.0" y="413" text-anchor="middle" font-family="Arial" font-size="16">est un rectangle.</text>
<text x="590" y="468" font-family="Arial" font-size="12">Classement : __________________</text>
<text x="590" y="491" font-family="Arial" font-size="12">Argument prêt :  ☐</text>
