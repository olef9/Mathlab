<text x="894" y="112" font-family="Arial" font-size="13" font-weight="bold">NOMBRES</text>
<text x="967.0" y="162" text-anchor="middle" font-family="Arial" font-size="16">Un nombre divisible par 4</text>
<text x="967.0" y="190" text-anchor="middle" font-family="Arial" font-size="16">est pair.</text>
<text x="858" y="245" font-family="Arial" font-size="12">Classement : __________________</text>
<text x="858" y="268" font-family="Arial" font-size="12">Argument prêt :  ☐</text>
<rect x="38" y="303" width="250" height="205" rx="9" fill="white" stroke="#222" stroke-width="2" stroke-dasharray="7 5"/>
<circle cx="66" cy="330" r="17" fill="white" stroke="#111" stroke-width="2"/>
