<circle cx="334" cy="330" r="17" fill="white" stroke="#111" stroke-width="2"/>
<text x="334" y="336" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">6</text>
<text x="358" y="335" font-family="Arial" font-size="13" font-weight="bold">NOMBRES</text>
<text x="431.0" y="385" text-anchor="middle" font-family="Arial" font-size="16">Un nombre qui se termine</text>
<text x="431.0" y="413" text-anchor="middle" font-family="Arial" font-size="16">par 0 est divisible par 4.</text>
<text x="322" y="468" font-family="Arial" font-size="12">Classement : __________________</text>
<text x="322" y="491" font-family="Arial" font-size="12">Argument prêt :  ☐</text>
<rect x="574" y="303" width="250" height="205" rx="9" fill="white" stroke="#222" stroke-width="2" stroke-dasharray="7 5"/>
