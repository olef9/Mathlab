<text x="894" y="335" font-family="Arial" font-size="13" font-weight="bold">GÉOMÉTRIE</text>
<text x="967.0" y="385" text-anchor="middle" font-family="Arial" font-size="16">Un quadrilatère à quatre</text>
<text x="967.0" y="413" text-anchor="middle" font-family="Arial" font-size="16">côtés égaux est un carré.</text>
<text x="858" y="468" font-family="Arial" font-size="12">Classement : __________________</text>
<text x="858" y="491" font-family="Arial" font-size="12">Argument prêt :  ☐</text>
