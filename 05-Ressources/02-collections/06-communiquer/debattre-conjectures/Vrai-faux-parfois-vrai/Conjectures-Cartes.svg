<text x="90" y="335" font-family="Arial" font-size="13" font-weight="bold">NOMBRES</text>
<text x="163.0" y="385" text-anchor="middle" font-family="Arial" font-size="16">Un nombre pair</text>
<text x="163.0" y="413" text-anchor="middle" font-family="Arial" font-size="16">est divisible par 4.</text>
<text x="54" y="468" font-family="Arial" font-size="12">Classement : __________________</text>
<text x="54" y="491" font-family="Arial" font-size="12">Argument prêt :  ☐</text>
