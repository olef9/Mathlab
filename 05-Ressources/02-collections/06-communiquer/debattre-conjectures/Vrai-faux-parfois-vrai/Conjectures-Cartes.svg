<text x="334" y="559" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">10</text>
<text x="358" y="558" font-family="Arial" font-size="13" font-weight="bold">GÉOMÉTRIE</text>
<text x="431.0" y="608" text-anchor="middle" font-family="Arial" font-size="16">Un quadrilatère à quatre angles</text>
<text x="431.0" y="636" text-anchor="middle" font-family="Arial" font-size="16">droits a quatre côtés égaux.</text>
<text x="322" y="691" font-family="Arial" font-size="12">Classement : __________________</text>
