<rect x="574" y="526" width="250" height="205" rx="9" fill="white" stroke="#222" stroke-width="2" stroke-dasharray="7 5"/>
<circle cx="602" cy="553" r="17" fill="white" stroke="#111" stroke-width="2"/>
<text x="602" y="559" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">11</text>
<text x="626" y="558" font-family="Arial" font-size="13" font-weight="bold">GÉOMÉTRIE</text>
<text x="699.0" y="608" text-anchor="middle" font-family="Arial" font-size="16">Dans un triangle isocèle,</text>
<text x="699.0" y="636" text-anchor="middle" font-family="Arial" font-size="16">deux angles ont la même mesure.</text>
<text x="590" y="691" font-family="Arial" font-size="12">Classement : __________________</text>
