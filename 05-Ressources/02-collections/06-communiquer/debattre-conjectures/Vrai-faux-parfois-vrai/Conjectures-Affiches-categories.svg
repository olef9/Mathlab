<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="42" font-family="Arial" font-size="27" font-weight="bold">Les trois catégories</text>
<text x="40" y="68" font-family="Arial" font-size="14">Découper les trois affiches et les placer dans la salle.</text>
<rect x="35" y="105" width="330" height="610" rx="14" fill="white" stroke="#222" stroke-width="3"/>
<text x="200.0" y="170" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">TOUJOURS VRAI</text>
<line x1="65" y1="195" x2="335" y2="195" stroke="#444" stroke-width="2"/>
<circle cx="200.0" cy="315" r="70" fill="white" stroke="#111" stroke-width="5"/>
<polyline points="155,315 185,345 250,270" fill="none" stroke="#111" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<text x="200.0" y="445" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold">Tous les cas fonctionnent.</text>
<text x="200.0" y="505" text-anchor="middle" font-family="Arial" font-size="15">Plusieurs exemples ne suffisent pas.</text>
<text x="200.0" y="533" text-anchor="middle" font-family="Arial" font-size="15">Il faut un argument général.</text>
<text x="200.0" y="650" text-anchor="middle" font-family="Arial" font-size="14">Cartes déposées :</text>
<line x1="80" y1="685" x2="320" y2="685" stroke="#777" stroke-width="1"/>
<rect x="395" y="105" width="330" height="610" rx="14" fill="white" stroke="#222" stroke-width="3"/>
<text x="560.0" y="170" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">JAMAIS VRAI</text>
<line x1="425" y1="195" x2="695" y2="195" stroke="#444" stroke-width="2"/>
<circle cx="560.0" cy="315" r="70" fill="white" stroke="#111" stroke-width="5"/>
<line x1="515" y1="270" x2="605" y2="360" stroke="#111" stroke-width="10" stroke-linecap="round"/>
<line x1="605" y1="270" x2="515" y2="360" stroke="#111" stroke-width="10" stroke-linecap="round"/>
<text x="560.0" y="445" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold">Aucun cas ne fonctionne.</text>
<text x="560.0" y="505" text-anchor="middle" font-family="Arial" font-size="15">Un seul exemple valable ferait tomber</text>
<text x="560.0" y="533" text-anchor="middle" font-family="Arial" font-size="15">ce classement.</text>
<text x="560.0" y="650" text-anchor="middle" font-family="Arial" font-size="14">Cartes déposées :</text>
<line x1="440" y1="685" x2="680" y2="685" stroke="#777" stroke-width="1"/>
<rect x="755" y="105" width="330" height="610" rx="14" fill="white" stroke="#222" stroke-width="3"/>
<text x="920.0" y="170" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">PARFOIS VRAI</text>
<line x1="785" y1="195" x2="1055" y2="195" stroke="#444" stroke-width="2"/>
<text x="920.0" y="355" text-anchor="middle" font-family="Arial" font-size="130" font-weight="bold">?</text>
<text x="920.0" y="445" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold">Certains cas fonctionnent et d’autres non.</text>
<text x="920.0" y="505" text-anchor="middle" font-family="Arial" font-size="15">Il faut un exemple</text>
<text x="920.0" y="533" text-anchor="middle" font-family="Arial" font-size="15">et un contre-exemple.</text>
<text x="920.0" y="650" text-anchor="middle" font-family="Arial" font-size="14">Cartes déposées :</text>
<line x1="800" y1="685" x2="1040" y2="685" stroke="#777" stroke-width="1"/>
</svg>