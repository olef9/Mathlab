<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="42" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="bold">S52 – Formuler une critique constructive</text>
<text x="40" y="72" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="normal">Une critique utile porte sur le travail observé, jamais sur la personne.</text>
<circle cx="90" cy="170" r="30" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
<text x="90" y="179" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="bold">1</text>
<rect x="145" y="115" width="900" height="125" rx="12" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="175" y="149" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">FAIT</text>
<text x="175" y="182" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">Qu’ai-je réellement vu ou entendu ?</text>
<text x="175" y="213" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="normal">Ex. : le score n’apparaît qu’après la première action.</text>
<circle cx="90" cy="345" r="30" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
<text x="90" y="354" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="bold">2</text>
<rect x="145" y="290" width="900" height="125" rx="12" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="175" y="324" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">EFFET</text>
<text x="175" y="357" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">Qu’est-ce que cela provoque pour moi ?</text>
<text x="175" y="388" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="normal">Ex. : je ne sais pas encore quelle information surveiller.</text>
<circle cx="90" cy="520" r="30" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
<text x="90" y="529" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="bold">3</text>
<rect x="145" y="465" width="900" height="125" rx="12" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="175" y="499" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">PROPOSITION</text>
<text x="175" y="532" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">Quelle modification précise peut aider ?</text>
<text x="175" y="563" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="normal">Ex. : afficher le score dès le drapeau vert.</text>
<text x="65" y="670" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">À éviter :</text>
<text x="170" y="670" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal">« c’est bien » · « j’aime pas » · « changez les couleurs »</text>
<rect x="150" y="710" width="820" height="52" rx="10" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
<text x="560" y="742" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">Une bonne critique donne aux auteurs quelque chose qu’ils peuvent réellement modifier.</text>
</svg>