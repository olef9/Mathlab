<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="42" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="bold">S52 – T1 – Jeton Math&#x27;Lab</text>
<text x="40" y="72" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="normal">Ce que vous devez montrer pendant le pitch.</text>
<rect x="55" y="115" width="1010" height="115" rx="12" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="80" y="150" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">DÉMONSTRATION</text>
<text x="80" y="185" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.7" font-weight="bold">Faire tourner le jeton puis afficher une dimension importante.</text>
<rect x="55" y="260" width="1010" height="115" rx="12" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="80" y="295" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">CHOIX À EXPLIQUER</text>
<text x="80" y="330" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.7" font-weight="bold">Expliquer le choix de la taille ou du relief du symbole.</text>
<rect x="55" y="405" width="1010" height="115" rx="12" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="80" y="440" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">PREUVE À DONNER</text>
<text x="80" y="475" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.7" font-weight="bold">Les dimensions imposées sont visibles et le relief est lisible.</text>
<rect x="55" y="550" width="1010" height="115" rx="12" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="80" y="585" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">QUESTION POSSIBLE DU PUBLIC</text>
<text x="80" y="620" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.7" font-weight="bold">Pourquoi avez-vous choisi cette hauteur de relief ?</text>
<rect x="165" y="710" width="795" height="48" rx="10" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
<text x="562" y="740" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">Ne montrez qu’une seule fonction ou un seul contrôle.</text>
</svg>