<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="42" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="bold">S64 – Pitch Math&#x27;Lab pour les futurs 6e</text>
<text x="40" y="72" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="normal">45 secondes maximum · un exemple concret.</text>
<circle cx="75" cy="140" r="22" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="75" y="147" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">1</text>
<rect x="115" y="110" width="945" height="70" rx="10" fill="#f7f7f7" stroke="#222" stroke-width="1.3"/>
<text x="145" y="137" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">MATH&#x27;LAB, C&#x27;EST…</text>
<text x="405" y="137" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold">« un temps où l&#x27;on découvre les maths autrement »</text>
<circle cx="75" cy="240" r="22" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="75" y="247" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">2</text>
<rect x="115" y="210" width="945" height="70" rx="10" fill="#f7f7f7" stroke="#222" stroke-width="1.3"/>
<text x="145" y="237" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">ON Y FAIT…</text>
<text x="405" y="237" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold">chercher, construire, programmer, jouer, créer, expliquer</text>
<circle cx="75" cy="340" r="22" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="75" y="347" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">3</text>
<rect x="115" y="310" width="945" height="70" rx="10" fill="#f7f7f7" stroke="#222" stroke-width="1.3"/>
<text x="145" y="337" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">UN EXEMPLE</text>
<text x="405" y="337" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold">choisir UNE vraie production ou activité</text>
<circle cx="75" cy="440" r="22" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="75" y="447" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">4</text>
<rect x="115" y="410" width="945" height="70" rx="10" fill="#f7f7f7" stroke="#222" stroke-width="1.3"/>
<text x="145" y="437" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">CE QUE J&#x27;AI APPRIS</text>
<text x="405" y="437" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold">dire une chose précise : tester, justifier, corriger, coopérer…</text>
<circle cx="75" cy="540" r="22" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="75" y="547" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">5</text>
<rect x="115" y="510" width="945" height="70" rx="10" fill="#f7f7f7" stroke="#222" stroke-width="1.3"/>
<text x="145" y="537" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">AUJOURD&#x27;HUI</text>
<text x="405" y="537" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold">« vous allez pouvoir essayer vous-mêmes avec le Rallye »</text>
<rect x="150" y="660" width="825" height="75" rx="10" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="562" y="692" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">À éviter : réciter toute l&#x27;année ou présenter Math&#x27;Lab comme « des maths en plus ».</text>
<text x="562" y="718" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">À viser : donner envie de comprendre et d&#x27;essayer.</text>
</svg>