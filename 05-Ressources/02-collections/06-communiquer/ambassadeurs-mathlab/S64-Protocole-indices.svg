<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="42" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="bold">S64 – Protocole d&#x27;aide et d&#x27;indices</text>
<text x="40" y="72" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="normal">Aider ne signifie pas raccourcir la recherche jusqu&#x27;à la réponse.</text>
<rect x="55" y="105" width="1010" height="68" rx="10" fill="#f7f7f7" stroke="#222" stroke-width="1.3"/>
<text x="85" y="132" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">0–2 MIN</text>
<text x="310" y="132" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">observer et laisser chercher</text>
<text x="635" y="132" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.4" font-weight="normal">aucun indice</text>
<rect x="55" y="200" width="1010" height="68" rx="10" fill="#f7f7f7" stroke="#222" stroke-width="1.3"/>
<text x="85" y="227" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">BLOCAGE</text>
<text x="310" y="227" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">poser une question</text>
<text x="635" y="227" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.4" font-weight="normal">« Qu&#x27;avez-vous déjà essayé ? »</text>
<rect x="55" y="295" width="1010" height="68" rx="10" fill="#f7f7f7" stroke="#222" stroke-width="1.3"/>
<text x="85" y="322" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">ENCORE BLOQUÉ</text>
<text x="310" y="322" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">donner l&#x27;indice 1</text>
<text x="635" y="322" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.4" font-weight="normal">petite aide, pas de méthode complète</text>
<rect x="55" y="390" width="1010" height="68" rx="10" fill="#f7f7f7" stroke="#222" stroke-width="1.3"/>
<text x="85" y="417" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">RECHERCHE</text>
<text x="310" y="417" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">laisser du temps</text>
<text x="635" y="417" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.4" font-weight="normal">ne pas enchaîner immédiatement avec l&#x27;indice 2</text>
<rect x="55" y="485" width="1010" height="68" rx="10" fill="#f7f7f7" stroke="#222" stroke-width="1.3"/>
<text x="85" y="512" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">DERNIER RECOURS</text>
<text x="310" y="512" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">donner l&#x27;indice 2</text>
<text x="635" y="512" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.4" font-weight="normal">aide forte, mais pas la réponse</text>
<rect x="55" y="580" width="1010" height="68" rx="10" fill="#f7f7f7" stroke="#222" stroke-width="1.3"/>
<text x="85" y="607" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">VALIDATION</text>
<text x="310" y="607" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">faire expliquer</text>
<text x="635" y="607" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.4" font-weight="normal">la lettre n&#x27;est donnée qu&#x27;après justification</text>
<rect x="160" y="690" width="805" height="58" rx="10" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="562" y="726" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">Question avant indice. Recherche après indice. Explication avant validation.</text>
</svg>