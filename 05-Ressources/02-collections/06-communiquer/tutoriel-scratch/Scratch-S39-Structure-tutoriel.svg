<text x="40" y="40" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="bold">S39 – Structure d’un tutoriel Scratch</text>
<text x="40" y="68" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="normal">Le spectateur doit pouvoir reproduire et vérifier.</text>
<circle cx="80" cy="139" r="25" fill="white" stroke="#222" stroke-width="1.8"/>
<text x="80" y="147" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="bold">1</text>
<rect x="125" y="108" width="930" height="67" rx="11" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="155" y="135" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">PROBLÈME</text>
<text x="335" y="135" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal">Annoncer ce qui ne fonctionne pas ou ce qui doit être simplifié.</text>
<rect x="925" y="122" width="105" height="38" rx="8" fill="#f1f1f1" stroke="#222" stroke-width="1.1"/>
<text x="977" y="147" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="bold">15–20 s</text>
<circle cx="80" cy="233" r="25" fill="white" stroke="#222" stroke-width="1.8"/>
<text x="80" y="241" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="bold">2</text>
<rect x="125" y="202" width="930" height="67" rx="11" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="155" y="229" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">ATTENDU</text>
<text x="335" y="229" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal">Montrer clairement le résultat recherché.</text>
<rect x="925" y="216" width="105" height="38" rx="8" fill="#f1f1f1" stroke="#222" stroke-width="1.1"/>
<text x="977" y="241" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="bold">15–20 s</text>
<circle cx="80" cy="327" r="25" fill="white" stroke="#222" stroke-width="1.8"/>
<text x="80" y="335" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="bold">3</text>
<rect x="125" y="296" width="930" height="67" rx="11" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="155" y="323" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">OBSERVATION</text>
<text x="335" y="323" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal">Exécuter et repérer le premier écart.</text>
<rect x="925" y="310" width="105" height="38" rx="8" fill="#f1f1f1" stroke="#222" stroke-width="1.1"/>
<text x="977" y="335" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="bold">30–40 s</text>
<circle cx="80" cy="421" r="25" fill="white" stroke="#222" stroke-width="1.8"/>
<text x="80" y="429" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="bold">4</text>
<rect x="125" y="390" width="930" height="67" rx="11" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="155" y="417" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">EXPLICATION</text>
<text x="335" y="417" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal">Nommer le bloc, la commande ou le paramètre utile.</text>
<rect x="925" y="404" width="105" height="38" rx="8" fill="#f1f1f1" stroke="#222" stroke-width="1.1"/>
<text x="977" y="429" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="bold">40–60 s</text>
<circle cx="80" cy="515" r="25" fill="white" stroke="#222" stroke-width="1.8"/>
<text x="80" y="523" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="bold">5</text>
<rect x="125" y="484" width="930" height="67" rx="11" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="155" y="511" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">CORRECTION</text>
<text x="335" y="511" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal">Modifier un seul élément et expliquer pourquoi.</text>
<rect x="925" y="498" width="105" height="38" rx="8" fill="#f1f1f1" stroke="#222" stroke-width="1.1"/>
<text x="977" y="523" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="bold">30–45 s</text>
<circle cx="80" cy="609" r="25" fill="white" stroke="#222" stroke-width="1.8"/>
<text x="80" y="617" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="bold">6</text>
<rect x="125" y="578" width="930" height="67" rx="11" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="155" y="605" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">TEST FINAL</text>
<text x="335" y="605" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal">Relancer et vérifier le résultat visible.</text>
<rect x="925" y="592" width="105" height="38" rx="8" fill="#f1f1f1" stroke="#222" stroke-width="1.1"/>
<text x="977" y="617" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="bold">15–25 s</text>
<rect x="190" y="705" width="740" height="55" rx="10" fill="white" stroke="#222" stroke-width="1.8"/>
<text x="560" y="739" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="bold">Montrer → expliquer → corriger → vérifier</text>
</svg>