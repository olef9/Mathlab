<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="35" y="38" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="26" font-weight="bold">S45 – Équipe B – La clé et la porte</text>
<text x="35" y="68" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">Départ du joueur : x = -210 ; y = -145</text>
<rect x="35" y="95" width="1053" height="92" rx="12" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
<text x="55" y="125" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">VARIABLE</text>
<text x="180" y="125" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">cle : 0 au départ, 1 après ramassage</text>
<text x="55" y="163" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">À RENDRE</text>
<text x="180" y="163" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal">une porte impossible à franchir sans la clé</text>
<rect x="35" y="215" width="650" height="410" rx="12" fill="white" stroke="#222" stroke-width="1.4"/>
<text x="360" y="246" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16.5" font-weight="bold">PROGRAMMATION À EFFECTUER</text>
<circle cx="68" cy="285" r="13" fill="white" stroke="#222" stroke-width="1.1"/>
<text x="68" y="290" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">1</text>
<text x="95" y="276" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="normal">mettre cle à 0 au drapeau vert et montrer la clé</text>
<circle cx="68" cy="353" r="13" fill="white" stroke="#222" stroke-width="1.1"/>
<text x="68" y="358" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">2</text>
<text x="95" y="344" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="normal">si la clé touche Joueur, mettre cle à 1 puis cacher la clé</text>
<circle cx="68" cy="421" r="13" fill="white" stroke="#222" stroke-width="1.1"/>
<text x="68" y="426" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">3</text>
<text x="95" y="412" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="normal">si Joueur touche Porte avec cle = 0, dire « Il manque la</text>
<text x="95" y="429" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="normal">clé » puis revenir au départ</text>
<circle cx="68" cy="489" r="13" fill="white" stroke="#222" stroke-width="1.1"/>
<text x="68" y="494" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">4</text>
<text x="95" y="480" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="normal">si Joueur touche Porte avec cle = 1, dire « Gagné ! » puis</text>
<text x="95" y="497" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="normal">arrêter tout</text>
<rect x="715" y="215" width="373" height="410" rx="12" fill="white" stroke="#222" stroke-width="1.4"/>
<text x="901" y="246" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16.5" font-weight="bold">TESTS OBLIGATOIRES</text>
<circle cx="750" cy="286" r="13" fill="white" stroke="#222" stroke-width="1.1"/>
<text x="750" y="291" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">1</text>
<text x="778" y="277" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="normal">la clé réapparaît au drapeau</text>
<text x="778" y="294" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="normal">vert</text>
<circle cx="750" cy="354" r="13" fill="white" stroke="#222" stroke-width="1.1"/>
<text x="750" y="359" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">2</text>
<text x="778" y="345" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="normal">la porte refuse cle = 0</text>
<circle cx="750" cy="422" r="13" fill="white" stroke="#222" stroke-width="1.1"/>
<text x="750" y="427" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">3</text>
<text x="778" y="413" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="normal">la clé disparaît et cle devient</text>
<text x="778" y="430" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="normal">1</text>
<circle cx="750" cy="490" r="13" fill="white" stroke="#222" stroke-width="1.1"/>
<text x="750" y="495" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">4</text>
<text x="778" y="481" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="normal">la porte accepte cle = 1</text>
<rect x="35" y="655" width="1053" height="86" rx="11" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
<text x="55" y="684" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">ORDRE À RESPECTER</text>
<text x="220" y="684" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.2" font-weight="bold">déplacements → murs → mission → cinq tests → correction</text>
<text x="55" y="720" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.2" font-weight="bold">Nom final :</text>
<text x="160" y="720" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.2" font-weight="normal">S45-Labyrinthe-Equipe-B-Version-2.sb3</text>
<text x="40" y="775" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">Ne modifier ni le décor ni les noms des lutins avant d’avoir terminé les scripts.</text>
</svg>