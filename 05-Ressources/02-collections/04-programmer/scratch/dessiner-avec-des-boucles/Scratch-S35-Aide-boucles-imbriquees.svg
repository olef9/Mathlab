<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="40" text-anchor="start" font-family="Arial" font-size="28" font-weight="bold">S35 – Comprendre les boucles imbriquées</text>
<text x="40" y="68" text-anchor="start" font-family="Arial" font-size="15" font-weight="normal">Une boucle peut contenir une autre boucle.</text>
<rect x="65" y="120" width="440" height="540" rx="18" fill="white" stroke="#222" stroke-width="2"/>
<text x="285" y="160" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">PROGRAMME</text>
<rect x="115" y="205" width="340" height="390" rx="18" fill="#f3f3f3" stroke="#222" stroke-width="2"/>
<text x="285" y="238" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">RÉPÉTER 12 FOIS</text>
<rect x="155" y="275" width="260" height="180" rx="16" fill="white" stroke="#222" stroke-width="2"/>
<text x="285" y="310" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">RÉPÉTER 4 FOIS</text>
<text x="285" y="360" text-anchor="middle" font-family="Arial" font-size="14" font-weight="normal">avancer de 55 pas</text>
<text x="285" y="400" text-anchor="middle" font-family="Arial" font-size="14" font-weight="normal">tourner de 90°</text>
<text x="285" y="505" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold">tourner de 30°</text>
<rect x="570" y="120" width="490" height="540" rx="18" fill="white" stroke="#222" stroke-width="2"/>
<text x="815" y="160" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">RÔLE DES DEUX BOUCLES</text>
<circle cx="630" cy="255" r="32" fill="white" stroke="#222" stroke-width="2"/>
<text x="630" y="263" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">1</text>
<text x="690" y="238" text-anchor="start" font-family="Arial" font-size="17" font-weight="bold">BOUCLE INTÉRIEURE</text>
<text x="690" y="270" text-anchor="start" font-family="Arial" font-size="14" font-weight="normal">Elle construit une figure complète et</text>
<text x="690" y="292" text-anchor="start" font-family="Arial" font-size="14" font-weight="normal">ramène le lutin au point de départ.</text>
<circle cx="630" cy="435" r="32" fill="white" stroke="#222" stroke-width="2"/>
<text x="630" y="443" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">2</text>
<text x="690" y="418" text-anchor="start" font-family="Arial" font-size="17" font-weight="bold">BOUCLE EXTÉRIEURE</text>
<text x="690" y="450" text-anchor="start" font-family="Arial" font-size="14" font-weight="normal">Elle fait tourner le lutin puis recommence</text>
<text x="690" y="472" text-anchor="start" font-family="Arial" font-size="14" font-weight="normal">toute la figure.</text>
<rect x="185" y="700" width="750" height="55" rx="10" fill="white" stroke="#222" stroke-width="2"/>
<text x="560" y="735" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold">Si la petite figure ne se ferme pas, la rosace devient une spirale.</text>
</svg>