<text x="600" y="485" font-family="Arial" font-size="17" font-weight="bold">Rappel</text>
<text x="600" y="518" font-family="Arial" font-size="15">• tourner = pivoter sur place ;</text>
<text x="600" y="545" font-family="Arial" font-size="15">• avancer = se déplacer d'une seule case ;</text>
