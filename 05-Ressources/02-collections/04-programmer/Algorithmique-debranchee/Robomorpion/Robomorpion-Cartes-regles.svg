<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="42" font-family="Arial" font-size="27" font-weight="bold">Robomorpion – Cartes des règles</text>
<text x="40" y="70" font-family="Arial" font-size="14">Découper un jeu par équipe ou afficher les trois cartes.</text>
<rect x="45" y="120" width="320" height="560" rx="18" fill="white" stroke="#222" stroke-width="3" stroke-dasharray="8 5"/>
<text x="205.0" y="175" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">CASE RONDE</text>
<text x="205.0" y="350" text-anchor="middle" font-family="Arial" font-size="130">○</text>
<line x1="85" y1="410" x2="325" y2="410" stroke="#777" stroke-width="2"/>
<text x="205.0" y="485" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">TOURNER À GAUCHE</text>
<text x="205.0" y="575" text-anchor="middle" font-family="Arial" font-size="70">↰</text>
<text x="205.0" y="640" text-anchor="middle" font-family="Arial" font-size="17">puis avancer</text>
<rect x="400" y="120" width="320" height="560" rx="18" fill="white" stroke="#222" stroke-width="3" stroke-dasharray="8 5"/>
<text x="560.0" y="175" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">CASE VIDE</text>
<text x="560.0" y="350" text-anchor="middle" font-family="Arial" font-size="130">□</text>
<line x1="440" y1="410" x2="680" y2="410" stroke="#777" stroke-width="2"/>
<text x="560.0" y="485" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">CONTINUER TOUT DROIT</text>
<text x="560.0" y="575" text-anchor="middle" font-family="Arial" font-size="70">↑</text>
<text x="560.0" y="640" text-anchor="middle" font-family="Arial" font-size="17">puis avancer</text>
<rect x="755" y="120" width="320" height="560" rx="18" fill="white" stroke="#222" stroke-width="3" stroke-dasharray="8 5"/>
<text x="915.0" y="175" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">CASE CROIX</text>
<text x="915.0" y="350" text-anchor="middle" font-family="Arial" font-size="130">×</text>
<line x1="795" y1="410" x2="1035" y2="410" stroke="#777" stroke-width="2"/>
<text x="915.0" y="485" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">TOURNER À DROITE</text>
<text x="915.0" y="575" text-anchor="middle" font-family="Arial" font-size="70">↱</text>
<text x="915.0" y="640" text-anchor="middle" font-family="Arial" font-size="17">puis avancer</text>
</svg>