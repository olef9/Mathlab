<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="42" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="28.5" font-weight="bold">S57 – Échelle commune et gabarits de test</text>
<text x="40" y="72" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="normal">Les gabarits servent à tester. Ils ne doivent pas rester dans l’objet final.</text>
<rect x="55" y="115" width="470" height="175" rx="12" fill="#f7f7f7" stroke="#222" stroke-width="1.2"/>
<text x="290" y="149" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">PERSONNAGE DEBOUT</text>
<text x="290" y="187" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="bold">12 × 8 × 45 mm</text>
<text x="85" y="227" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="bold">Utilisé pour vérifier un passage, un abri ou une</text>
<text x="85" y="245" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="bold">hauteur utile.</text>
<rect x="575" y="115" width="470" height="175" rx="12" fill="#f7f7f7" stroke="#222" stroke-width="1.2"/>
<text x="810" y="149" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">GABARIT ASSIS</text>
<text x="810" y="187" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="bold">12 × 16 × 25 mm</text>
<text x="605" y="227" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="bold">Utilisé pour vérifier une assise et l’espace</text>
<text x="605" y="245" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="bold">disponible.</text>
<rect x="55" y="330" width="470" height="175" rx="12" fill="#f7f7f7" stroke="#222" stroke-width="1.2"/>
<text x="290" y="364" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">PARCELLE</text>
<text x="290" y="402" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="bold">80 × 80 mm</text>
<text x="85" y="442" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="bold">Référence maximale pour le mobilier urbain.</text>
<rect x="575" y="330" width="470" height="175" rx="12" fill="#f7f7f7" stroke="#222" stroke-width="1.2"/>
<text x="810" y="364" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">CHAUSSÉE</text>
<text x="810" y="402" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="bold">30 mm de large</text>
<text x="605" y="442" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="bold">Référence utilisée dans la maquette de Maths</text>
<text x="605" y="460" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="bold">City.</text>
<rect x="55" y="575" width="1010" height="120" rx="12" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="80" y="610" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">CONTRAINTES COMMUNES</text>
<text x="90" y="648" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">• hauteur maximale du mobilier : 80 mm</text>
<text x="470" y="648" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">• épaisseur minimale conseillée : 2 mm</text>
<text x="90" y="680" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">• base solide conseillée : au moins 3 mm</text>
<text x="470" y="680" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">• aucune pièce flottante dans la version finale</text>
<text x="55" y="760" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">Créer les gabarits avec de simples boîtes Tinkercad suffit.</text>
</svg>