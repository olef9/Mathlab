<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#222"/>
</marker>
</defs>
<text x="40" y="40" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="bold">S38 – Premiers gestes dans Tinkercad</text>
<text x="40" y="70" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="normal">Une action précise à la fois.</text>
<rect x="55" y="110" width="485" height="112" rx="13" fill="#f5f5f5" stroke="#222" stroke-width="1.5"/>
<circle cx="93" cy="144" r="21" fill="white" stroke="#222" stroke-width="1.6"/>
<text x="93" y="151" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">1</text>
<text x="133" y="145" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">DÉPOSER</text>
<text x="133" y="177" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="normal">Choisir une forme élémentaire et la placer sur</text>
<text x="133" y="197" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="normal">le plan.</text>
<rect x="585" y="110" width="485" height="112" rx="13" fill="#f5f5f5" stroke="#222" stroke-width="1.5"/>
<circle cx="623" cy="144" r="21" fill="white" stroke="#222" stroke-width="1.6"/>
<text x="623" y="151" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">2</text>
<text x="663" y="145" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">DIMENSIONNER</text>
<text x="663" y="177" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="normal">Saisir largeur, profondeur et hauteur en</text>
<text x="663" y="197" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="normal">millimètres.</text>
<rect x="55" y="255" width="485" height="112" rx="13" fill="#f5f5f5" stroke="#222" stroke-width="1.5"/>
<circle cx="93" cy="289" r="21" fill="white" stroke="#222" stroke-width="1.6"/>
<text x="93" y="296" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">3</text>
<text x="133" y="290" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">ÉLEVER</text>
<text x="133" y="322" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="normal">Placer la base de la forme à la hauteur prévue.</text>
<rect x="585" y="255" width="485" height="112" rx="13" fill="#f5f5f5" stroke="#222" stroke-width="1.5"/>
<circle cx="623" cy="289" r="21" fill="white" stroke="#222" stroke-width="1.6"/>
<text x="623" y="296" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">4</text>
<text x="663" y="290" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">DUPLIQUER</text>
<text x="663" y="322" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="normal">Créer une copie strictement identique.</text>
<rect x="55" y="400" width="485" height="112" rx="13" fill="#f5f5f5" stroke="#222" stroke-width="1.5"/>
<circle cx="93" cy="434" r="21" fill="white" stroke="#222" stroke-width="1.6"/>
<text x="93" y="441" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">5</text>
<text x="133" y="435" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">ALIGNER</text>
<text x="133" y="467" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="normal">Centrer ou placer plusieurs formes sur un même</text>
<text x="133" y="487" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="normal">axe.</text>
<rect x="585" y="400" width="485" height="112" rx="13" fill="#f5f5f5" stroke="#222" stroke-width="1.5"/>
<circle cx="623" cy="434" r="21" fill="white" stroke="#222" stroke-width="1.6"/>
<text x="623" y="441" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">6</text>
<text x="663" y="435" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">TOURNER</text>
<text x="663" y="467" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="normal">Utiliser une rotation exacte, par exemple 90°.</text>
<rect x="55" y="545" width="485" height="112" rx="13" fill="#f5f5f5" stroke="#222" stroke-width="1.5"/>
<circle cx="93" cy="579" r="21" fill="white" stroke="#222" stroke-width="1.6"/>
<text x="93" y="586" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">7</text>
<text x="133" y="580" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">CHANGER DE VUE</text>
<text x="133" y="612" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="normal">Contrôler en perspective, de face et de dessus.</text>
<rect x="585" y="545" width="485" height="112" rx="13" fill="#f5f5f5" stroke="#222" stroke-width="1.5"/>
<circle cx="623" cy="579" r="21" fill="white" stroke="#222" stroke-width="1.6"/>
<text x="623" y="586" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">8</text>
<text x="663" y="580" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">GROUPER</text>
<text x="663" y="612" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="normal">Réunir les formes seulement après la validation.</text>
<text x="55" y="715" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">Règle de correction : modifier un seul paramètre, puis vérifier dans une autre vue.</text>
</svg>