<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="42" font-family="Arial" font-size="29" font-weight="bold">Comment vérifier un échec et mat ?</text>
<text x="40" y="75" font-family="Arial" font-size="15">Un coup donnant échec n’est mat que si les trois défenses échouent.</text>
<rect x="70" y="145" width="270" height="420" rx="16" fill="white" stroke="#222" stroke-width="2.5"/>
<text x="205.0" y="200" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">1. FUITE</text>
<text x="205.0" y="305" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="80">↗</text>
<text x="205.0" y="365" text-anchor="middle" font-family="Arial" font-size="15">Le roi peut-il aller sur une case li</text>
<text x="205.0" y="390" text-anchor="middle" font-family="Arial" font-size="15">bre et non attaquée ?</text>
<text x="95" y="450" font-family="Arial" font-size="14">• examiner chaque case voisine</text>
<text x="95" y="486" font-family="Arial" font-size="14">• vérifier les pièces adverses</text>
<text x="95" y="522" font-family="Arial" font-size="14">• ne jamais entrer dans une attaque</text>
<rect x="425" y="145" width="270" height="420" rx="16" fill="white" stroke="#222" stroke-width="2.5"/>
<text x="560.0" y="200" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">2. CAPTURE</text>
<text x="560.0" y="305" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="80">×</text>
<text x="560.0" y="365" text-anchor="middle" font-family="Arial" font-size="15">La pièce qui donne échec peut-elle ê</text>
<text x="560.0" y="390" text-anchor="middle" font-family="Arial" font-size="15">tre prise ?</text>
<text x="450" y="450" font-family="Arial" font-size="14">• par le roi</text>
<text x="450" y="486" font-family="Arial" font-size="14">• par une autre pièce</text>
<text x="450" y="522" font-family="Arial" font-size="14">• sans exposer le roi</text>
<rect x="780" y="145" width="270" height="420" rx="16" fill="white" stroke="#222" stroke-width="2.5"/>
<text x="915.0" y="200" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">3. INTERPOSITION</text>
<text x="915.0" y="305" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="80">▮</text>
<text x="915.0" y="365" text-anchor="middle" font-family="Arial" font-size="15">Une pièce peut-elle se placer entre </text>
<text x="915.0" y="390" text-anchor="middle" font-family="Arial" font-size="15">le roi et l’attaquant ?</text>
<text x="805" y="450" font-family="Arial" font-size="14">• possible contre tour, fou ou dame</text>
<text x="805" y="486" font-family="Arial" font-size="14">• impossible contre cavalier</text>
<text x="805" y="522" font-family="Arial" font-size="14">• impossible si l’attaquant est adjacent</text>
<rect x="255" y="620" width="615" height="105" rx="18" fill="white" stroke="#111" stroke-width="3"/>
<text x="562" y="660" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">Aucune fuite + aucune capture + aucun blocage</text>
<text x="562" y="702" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold">= ÉCHEC ET MAT</text>
</svg>