<text x="515" y="125" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#111">QUESTION</text>
<text x="515" y="155" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111">Quel coup de tour donne échec et mat sur la huitième rangée ?</text>
<rect x="495" y="220" width="593" height="285" rx="12" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="791" y="250" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#111">TRAVAIL À FAIRE DANS L’ORDRE</text>
<circle cx="525" cy="287" r="12" fill="white" stroke="#222" stroke-width="1.0"/>
<text x="525" y="292" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#111">1</text>
<text x="550" y="279" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111">Repérez les trois pions noirs devant leur roi.</text>
<circle cx="525" cy="326" r="12" fill="white" stroke="#222" stroke-width="1.0"/>
<text x="525" y="331" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#111">2</text>
<text x="550" y="318" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111">Cherchez une case de la huitième rangée atteignable par la</text>
<text x="550" y="334" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111">tour.</text>
<circle cx="525" cy="365" r="12" fill="white" stroke="#222" stroke-width="1.0"/>
<text x="525" y="370" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#111">3</text>
<text x="550" y="357" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111">Jouez le coup candidat.</text>
<circle cx="525" cy="404" r="12" fill="white" stroke="#222" stroke-width="1.0"/>
<text x="525" y="409" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#111">4</text>
<text x="550" y="396" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111">Vérifiez les cases f8 et h8.</text>
<circle cx="525" cy="443" r="12" fill="white" stroke="#222" stroke-width="1.0"/>
<text x="525" y="448" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#111">5</text>
<text x="550" y="435" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111">Vérifiez que les pions noirs bloquent les autres sorties.</text>
<circle cx="525" cy="482" r="12" fill="white" stroke="#222" stroke-width="1.0"/>
<text x="525" y="487" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#111">6</text>
<text x="550" y="474" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111">Expliquez pourquoi aucune interposition n’est possible.</text>
<rect x="495" y="530" width="593" height="105" rx="12" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="515" y="558" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111">JUSTIFICATION OBLIGATOIRE</text>
<text x="525" y="590" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.2" font-weight="bold" fill="#111">☐ la tour donne échec sur la rangée 8</text>
<text x="525" y="613" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.2" font-weight="bold" fill="#111">☐ les cases de fuite sont attaquées</text>
<text x="525" y="636" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.2" font-weight="bold" fill="#111">☐ les autres sorties sont occupées</text>
<text x="525" y="659" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.2" font-weight="bold" fill="#111">☐ aucune pièce ne capture ou ne bloque la tour</text>
<rect x="55" y="565" width="400" height="160" rx="12" fill="#f7f7f7" stroke="#222" stroke-width="1.3"/>
<text x="255" y="593" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#111">RECETTE POUR CRÉER VOTRE DÉFI</text>
<text x="75" y="625" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#111">1.</text>
<text x="95" y="625" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#111">Gardez les pions noirs f7, g7 et h7.</text>
<text x="75" y="652" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#111">2.</text>
<text x="95" y="652" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#111">Choisissez le roi noir en g8 ou h8.</text>
<text x="75" y="679" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#111">3.</text>
<text x="95" y="679" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#111">Placez la tour blanche sur e1, e2, e3, e4, e5,</text>
<text x="95" y="694" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#111">e6 ou e7.</text>
<text x="75" y="706" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#111">4.</text>
<text x="95" y="706" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#111">Gardez le roi blanc a1.</text>
<text x="75" y="733" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#111">5.</text>
<text x="95" y="733" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#111">La solution doit être tour → e8 mat.</text>
