<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="42" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="28.5" font-weight="bold" fill="#111">S50 – Rappels utiles pour les mini-problèmes</text>
<text x="40" y="70" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#111">Ces rappels ne remplacent pas la vérification sur l’échiquier.</text>
<rect x="45" y="110" width="320" height="190" rx="12" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="205" y="148" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" fill="#111">♔ ROI</text>
<text x="70" y="192" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#111">Déplacement :</text>
<text x="70" y="218" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" fill="#111">une case dans toutes les directions</text>
<text x="70" y="255" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#111">Contrôle :</text>
<text x="70" y="280" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111">ne va jamais sur une case attaquée</text>
<rect x="400" y="110" width="320" height="190" rx="12" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="560" y="148" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" fill="#111">♕ DAME</text>
<text x="425" y="192" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#111">Déplacement :</text>
<text x="425" y="218" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" fill="#111">ligne, colonne ou diagonale</text>
<text x="425" y="255" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#111">Contrôle :</text>
<text x="425" y="280" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111">ne traverse aucune pièce</text>
<rect x="755" y="110" width="320" height="190" rx="12" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="915" y="148" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" fill="#111">♖ TOUR</text>
<text x="780" y="192" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#111">Déplacement :</text>
<text x="780" y="218" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" fill="#111">ligne ou colonne</text>
<text x="780" y="255" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#111">Contrôle :</text>
<text x="780" y="280" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111">ne traverse aucune pièce</text>
<rect x="45" y="335" width="320" height="190" rx="12" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="205" y="373" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" fill="#111">♗ FOU</text>
<text x="70" y="417" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#111">Déplacement :</text>
<text x="70" y="443" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" fill="#111">diagonale</text>
<text x="70" y="480" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#111">Contrôle :</text>
<text x="70" y="505" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111">reste sur la même couleur</text>
<rect x="400" y="335" width="320" height="190" rx="12" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="560" y="373" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" fill="#111">♘ CAVALIER</text>
<text x="425" y="417" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#111">Déplacement :</text>
<text x="425" y="443" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" fill="#111">deux cases puis une</text>
<text x="425" y="480" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#111">Contrôle :</text>
<text x="425" y="505" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111">peut sauter par-dessus les pièces</text>
<rect x="400" y="560" width="675" height="160" rx="12" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="425" y="592" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111">MOTS DE LA SÉANCE</text>
<text x="445" y="625" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.2" font-weight="normal" fill="#111">• Échec : le roi est attaqué.</text>
<text x="445" y="652" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.2" font-weight="normal" fill="#111">• Mat : le roi est attaqué et aucune réponse légale n’existe.</text>
<text x="445" y="679" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.2" font-weight="normal" fill="#111">• Fourchette : une pièce attaque plusieurs cibles en même temps.</text>
<text x="445" y="706" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.2" font-weight="normal" fill="#111">• Clouage : déplacer la pièce exposerait le roi.</text>
<text x="45" y="760" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#111">Pour un mat, vérifier dans l’ordre : fuite · capture · interposition.</text>
</svg>