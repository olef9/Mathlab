<text x="515" y="125" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#111">QUESTION</text>
<text x="515" y="155" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111">Quel coup de cavalier donne échec au roi et attaque aussi la dame ?</text>
<rect x="495" y="220" width="593" height="285" rx="12" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="791" y="250" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" fill="#111">TRAVAIL À FAIRE DANS L’ORDRE</text>
<circle cx="525" cy="287" r="12" fill="white" stroke="#222" stroke-width="1.0"/>
<text x="525" y="292" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#111">1</text>
<text x="550" y="279" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111">Placez les quatre pièces exactement.</text>
<circle cx="525" cy="326" r="12" fill="white" stroke="#222" stroke-width="1.0"/>
<text x="525" y="331" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#111">2</text>
<text x="550" y="318" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111">Listez les cases accessibles au cavalier c6.</text>
<circle cx="525" cy="365" r="12" fill="white" stroke="#222" stroke-width="1.0"/>
<text x="525" y="370" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#111">3</text>
<text x="550" y="357" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111">Cherchez une case depuis laquelle le cavalier attaque g8.</text>
<circle cx="525" cy="404" r="12" fill="white" stroke="#222" stroke-width="1.0"/>
<text x="525" y="409" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#111">4</text>
<text x="550" y="396" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111">Vérifiez si cette même case attaque aussi c8.</text>
<circle cx="525" cy="443" r="12" fill="white" stroke="#222" stroke-width="1.0"/>
<text x="525" y="448" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#111">5</text>
<text x="550" y="435" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111">Écrivez le coup avec départ et arrivée.</text>
<circle cx="525" cy="482" r="12" fill="white" stroke="#222" stroke-width="1.0"/>
<text x="525" y="487" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#111">6</text>
<text x="550" y="474" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111">Expliquez pourquoi le roi doit répondre avant de sauver la</text>
<text x="550" y="490" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#111">dame.</text>
<rect x="495" y="530" width="593" height="105" rx="12" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="515" y="558" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111">JUSTIFICATION OBLIGATOIRE</text>
<text x="525" y="590" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.2" font-weight="bold" fill="#111">☐ le cavalier donne échec</text>
<text x="525" y="613" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.2" font-weight="bold" fill="#111">☐ la dame est attaquée en même temps</text>
<text x="525" y="636" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.2" font-weight="bold" fill="#111">☐ le roi doit répondre en priorité</text>
<text x="525" y="659" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.2" font-weight="bold" fill="#111">☐ la dame pourra être prise ensuite</text>
<rect x="55" y="565" width="400" height="160" rx="12" fill="#f7f7f7" stroke="#222" stroke-width="1.3"/>
<text x="255" y="593" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#111">RECETTE POUR CRÉER VOTRE DÉFI</text>
<text x="75" y="625" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#111">1.</text>
<text x="95" y="625" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#111">Gardez le roi blanc a1 et le cavalier blanc c6.</text>
<text x="75" y="652" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#111">2.</text>
<text x="95" y="652" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#111">Placez le roi noir et la dame noire sur c8 et</text>
<text x="95" y="667" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#111">g8.</text>
<text x="75" y="679" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#111">3.</text>
<text x="95" y="679" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#111">Vous pouvez échanger leurs places.</text>
<text x="75" y="706" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#111">4.</text>
<text x="95" y="706" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#111">La solution doit commencer par c6 → e7.</text>
<text x="75" y="733" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#111">5.</text>
<text x="95" y="733" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#111">Vérifiez que les deux pièces noires sont</text>
<text x="95" y="748" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#111">attaquées depuis e7.</text>
<text x="495" y="680" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#111">Coup candidat 1 : __________ → __________</text>
<text x="495" y="710" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#111">Coup candidat 2 : __________ → __________</text>
<text x="495" y="740" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#111">Solution retenue : __________ → __________</text>
<text x="35" y="780" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#111">Ne montrez pas votre solution secrète à l’équipe testeuse.</text>
