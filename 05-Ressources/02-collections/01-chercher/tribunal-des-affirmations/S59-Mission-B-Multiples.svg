<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="35" y="38" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="25.5" font-weight="bold">S59 – Équipe B – Multiples</text>
<rect x="35" y="72" width="1053" height="88" rx="12" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="55" y="103" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">MISSION</text>
<text x="160" y="103" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.4" font-weight="bold">Rendre un verdict sur les trois affirmations et préparer une justification capable</text>
<text x="160" y="121" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.4" font-weight="bold">de résister à une objection.</text>
<rect x="45" y="190" width="1030" height="118" rx="12" fill="white" stroke="#222" stroke-width="1.2"/>
<circle cx="82" cy="227" r="20" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
<text x="82" y="234" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">1</text>
<text x="118" y="222" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">AFFIRMATION 1</text>
<text x="118" y="252" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.3" font-weight="bold">Tout multiple de 12 est un multiple de 3.</text>
<text x="735" y="289" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.2" font-weight="bold">Verdict : ____________________</text>
<rect x="45" y="335" width="1030" height="118" rx="12" fill="#f8f8f8" stroke="#222" stroke-width="1.2"/>
<circle cx="82" cy="372" r="20" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
<text x="82" y="379" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">2</text>
<text x="118" y="367" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">AFFIRMATION 2</text>
<text x="118" y="397" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.3" font-weight="bold">Un multiple de 3 est aussi un multiple de 6.</text>
<text x="735" y="434" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.2" font-weight="bold">Verdict : ____________________</text>
<rect x="45" y="480" width="1030" height="118" rx="12" fill="white" stroke="#222" stroke-width="1.2"/>
<circle cx="82" cy="517" r="20" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
<text x="82" y="524" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">3</text>
<text x="118" y="512" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">AFFIRMATION 3</text>
<text x="118" y="542" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.3" font-weight="bold">La somme de deux multiples de 5 n’est jamais un multiple de 5.</text>
<text x="735" y="579" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.2" font-weight="bold">Verdict : ____________________</text>
<rect x="45" y="625" width="510" height="105" rx="11" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
<text x="70" y="655" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">RAPPEL / VOCABULAIRE</text>
<text x="70" y="685" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="11.9" font-weight="bold">Un multiple de 6 est un nombre qui peut s’écrire 6</text>
<text x="70" y="701" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="11.9" font-weight="bold">× un entier.</text>
<rect x="580" y="625" width="495" height="105" rx="11" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
<text x="605" y="655" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">AVOCAT DU DOUTE</text>
<text x="605" y="685" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="11.9" font-weight="bold">Utilisez des petits multiples, puis des</text>
<text x="605" y="701" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="11.9" font-weight="bold">multiples plus grands. Revenez à la définition</text>
<text x="605" y="717" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="11.9" font-weight="bold">si les exemples ne suffisent plus.</text>
<text x="40" y="770" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.4" font-weight="bold">Pour « toujours vraie », des exemples ne suffisent pas. Pour « parfois vraie », il faut un cas vrai ET un cas faux.</text>
</svg>