<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="42" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="bold">S59 – Les trois verdicts du tribunal</text>
<text x="40" y="72" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="normal">Le type de justification dépend du verdict.</text>
<rect x="60" y="115" width="1000" height="150" rx="14" fill="#f7f7f7" stroke="#222" stroke-width="1.3"/>
<text x="560" y="150" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">TOUJOURS VRAIE</text>
<text x="95" y="190" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">Sens :</text>
<text x="190" y="190" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">Tous les cas autorisés fonctionnent.</text>
<text x="95" y="220" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">Preuve :</text>
<text x="190" y="220" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="normal">Il faut une raison générale.</text>
<text x="95" y="248" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="bold">Attention :</text>
<text x="190" y="248" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal">Quelques exemples ne suffisent pas.</text>
<rect x="60" y="305" width="1000" height="150" rx="14" fill="#f7f7f7" stroke="#222" stroke-width="1.3"/>
<text x="560" y="340" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">PARFOIS VRAIE</text>
<text x="95" y="380" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">Sens :</text>
<text x="190" y="380" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">Il existe des cas vrais et des cas faux.</text>
<text x="95" y="410" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">Preuve :</text>
<text x="190" y="410" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="normal">Il faut un exemple vrai + un contre-exemple.</text>
<text x="95" y="438" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="bold">Attention :</text>
<text x="190" y="438" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal">Les deux sont obligatoires.</text>
<rect x="60" y="495" width="1000" height="150" rx="14" fill="#f7f7f7" stroke="#222" stroke-width="1.3"/>
<text x="560" y="530" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">FAUSSE DANS TOUS LES CAS</text>
<text x="95" y="570" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">Sens :</text>
<text x="190" y="570" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">Aucun cas autorisé ne fonctionne.</text>
<text x="95" y="600" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">Preuve :</text>
<text x="190" y="600" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="normal">Il faut expliquer pourquoi c’est impossible.</text>
<text x="95" y="628" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="bold">Attention :</text>
<text x="190" y="628" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="normal">Un seul exemple faux ne suffit pas.</text>
<rect x="130" y="705" width="860" height="50" rx="10" fill="#f4f4f4" stroke="#222" stroke-width="1.4"/>
<text x="560" y="736" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">Un contre-exemple peut détruire « toujours ».</text>
</svg>