<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="35" y="40" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="26" font-weight="bold">S61 – Station B – La machine mystérieuse</text>
<rect x="35" y="80" width="1053" height="100" rx="12" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="55" y="112" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">DÉFI</text>
<text x="160" y="112" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">Un nombre inconnu entre dans la machine. Après toutes les opérations, le résultat</text>
<text x="160" y="131" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">affiché est 48. Retrouver le nombre de départ.</text>
<rect x="80" y="255" width="120" height="80" rx="10" fill="#ededed" stroke="#222" stroke-width="1.2"/>
<text x="140" y="304" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="bold">?</text>
<line x1="200" y1="295" x2="250" y2="295" stroke="#222" stroke-width="2"/>
<line x1="240" y1="288" x2="250" y2="295" stroke="#222" stroke-width="2"/>
<line x1="240" y1="302" x2="250" y2="295" stroke="#222" stroke-width="2"/>
<rect x="250" y="255" width="120" height="80" rx="10" fill="#f7f7f7" stroke="#222" stroke-width="1.2"/>
<text x="310" y="304" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="bold">× 3</text>
<line x1="370" y1="295" x2="420" y2="295" stroke="#222" stroke-width="2"/>
<line x1="410" y1="288" x2="420" y2="295" stroke="#222" stroke-width="2"/>
