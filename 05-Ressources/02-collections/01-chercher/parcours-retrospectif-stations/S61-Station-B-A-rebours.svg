<rect x="420" y="255" width="120" height="80" rx="10" fill="#f7f7f7" stroke="#222" stroke-width="1.2"/>
<text x="480" y="304" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="bold">+ 5</text>
<line x1="540" y1="295" x2="590" y2="295" stroke="#222" stroke-width="2"/>
<line x1="580" y1="288" x2="590" y2="295" stroke="#222" stroke-width="2"/>
<line x1="580" y1="302" x2="590" y2="295" stroke="#222" stroke-width="2"/>
<rect x="590" y="255" width="120" height="80" rx="10" fill="#f7f7f7" stroke="#222" stroke-width="1.2"/>
<text x="650" y="304" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="bold">× 2</text>
<line x1="710" y1="295" x2="760" y2="295" stroke="#222" stroke-width="2"/>
<line x1="750" y1="288" x2="760" y2="295" stroke="#222" stroke-width="2"/>
<line x1="750" y1="302" x2="760" y2="295" stroke="#222" stroke-width="2"/>
<rect x="760" y="255" width="120" height="80" rx="10" fill="#f7f7f7" stroke="#222" stroke-width="1.2"/>
<text x="820" y="304" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="bold">− 4</text>
<line x1="880" y1="295" x2="930" y2="295" stroke="#222" stroke-width="2"/>
<line x1="920" y1="288" x2="930" y2="295" stroke="#222" stroke-width="2"/>
<line x1="920" y1="302" x2="930" y2="295" stroke="#222" stroke-width="2"/>
<rect x="930" y="255" width="120" height="80" rx="10" fill="#ededed" stroke="#222" stroke-width="1.2"/>
<text x="990" y="304" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="bold">48</text>
<rect x="120" y="400" width="885" height="190" rx="12" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="145" y="435" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">À ÉCRIRE DANS LE CARNET</text>
<text x="160" y="480" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="bold">1. Le nombre de départ.</text>
<text x="160" y="520" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="bold">2. Toutes les étapes permettant de vérifier votre réponse.</text>
<text x="160" y="560" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="bold">3. La démarche principale choisie parmi les cinq démarches.</text>
<rect x="120" y="715" width="885" height="48" rx="10" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
<text x="562" y="745" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.8" font-weight="bold">Avant de partir : réponse + trace + démarche + « utile quand… » dans le carnet.</text>
