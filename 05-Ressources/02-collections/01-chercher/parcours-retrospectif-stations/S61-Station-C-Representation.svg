<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="35" y="40" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="26" font-weight="bold">S61 – Station C – Les quatre lieux</text>
<rect x="35" y="80" width="1053" height="110" rx="12" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="55" y="112" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">DÉFI</text>
<text x="160" y="112" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.8" font-weight="bold">Quatre lieux A, B, C et D sont reliés par cinq routes. Trouvez un trajet qui</text>
<text x="160" y="131" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.8" font-weight="bold">utilise chaque route exactement une fois, sans utiliser une route deux fois.</text>
<rect x="55" y="225" width="330" height="360" rx="12" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="220" y="258" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">LES CINQ ROUTES</text>
<rect x="110" y="277" width="220" height="48" rx="8" fill="#f7f7f7" stroke="#222" stroke-width="0.9"/>
<text x="220" y="307" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">A – B</text>
<rect x="110" y="335" width="220" height="48" rx="8" fill="#f7f7f7" stroke="#222" stroke-width="0.9"/>
<text x="220" y="365" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">A – C</text>
<rect x="110" y="393" width="220" height="48" rx="8" fill="#f7f7f7" stroke="#222" stroke-width="0.9"/>
<text x="220" y="423" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">B – C</text>
<rect x="110" y="451" width="220" height="48" rx="8" fill="#f7f7f7" stroke="#222" stroke-width="0.9"/>
<text x="220" y="481" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">B – D</text>
<rect x="110" y="509" width="220" height="48" rx="8" fill="#f7f7f7" stroke="#222" stroke-width="0.9"/>
<text x="220" y="539" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">C – D</text>
<rect x="420" y="225" width="645" height="360" rx="12" fill="#f7f7f7" stroke="#222" stroke-width="1.2"/>
<text x="742" y="258" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">ZONE DE RECHERCHE</text>
<text x="455" y="300" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold">Vous pouvez écrire, dessiner ou schématiser ici avant de recopier dans le carnet.</text>
<rect x="465" y="330" width="555" height="190" rx="0" fill="white" stroke="#999" stroke-width="0.8" stroke-dasharray="6 4"/>
<text x="742" y="430" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal">dessin / schéma / essais</text>
<text x="455" y="555" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="bold">À rendre : un trajet complet utilisant les 5 routes une seule fois.</text>
<rect x="120" y="715" width="885" height="48" rx="10" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
<text x="562" y="745" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.8" font-weight="bold">Avant de partir : réponse + trace + démarche + « utile quand… » dans le carnet.</text>
</svg>