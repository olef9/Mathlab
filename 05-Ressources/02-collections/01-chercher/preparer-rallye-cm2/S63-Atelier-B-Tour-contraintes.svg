<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="35" y="40" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="26" font-weight="bold">Rallye CM2 – Atelier B – La tour sous contraintes</text>
<rect x="35" y="80" width="1053" height="92" rx="12" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="55" y="113" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">Construisez une tour qui respecte TOUTES les contraintes. Vous avez environ 8 minutes.</text>
<circle cx="80" cy="215" r="15" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="80" y="220" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">1</text>
<text x="120" y="220" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.3" font-weight="bold">2 feuilles A4 maximum</text>
<circle cx="80" cy="287" r="15" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="80" y="292" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">2</text>
<text x="120" y="292" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.3" font-weight="bold">30 cm de ruban adhésif maximum</text>
<circle cx="80" cy="359" r="15" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="80" y="364" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">3</text>
<text x="120" y="364" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.3" font-weight="bold">hauteur au moins 35 cm</text>
<circle cx="80" cy="431" r="15" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="80" y="436" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">4</text>
<text x="120" y="436" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.3" font-weight="bold">base entièrement dans un carré 15 × 15 cm</text>
<circle cx="80" cy="503" r="15" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="80" y="508" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">5</text>
<text x="120" y="508" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.3" font-weight="bold">tenir debout 10 secondes sans être touchée</text>
<rect x="160" y="610" width="805" height="85" rx="10" fill="#f7f7f7" stroke="#222" stroke-width="1.3"/>
<text x="562" y="640" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">VALIDATION</text>
<text x="562" y="668" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="bold">mesurer la hauteur · vérifier la base · chronométrer 10 s</text>
<text x="55" y="755" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="bold">Une tour très haute qui tombe n&#x27;est pas validée.</text>
</svg>