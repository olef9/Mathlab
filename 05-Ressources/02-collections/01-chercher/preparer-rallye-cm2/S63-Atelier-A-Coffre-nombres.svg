<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="35" y="40" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="26" font-weight="bold">Rallye CM2 – Atelier A – Le coffre des nombres</text>
<rect x="35" y="80" width="1053" height="105" rx="12" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="55" y="115" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.8" font-weight="bold">Trouve le code à trois chiffres. Chaque chiffre est choisi parmi 1, 2, 3, 4, 5, 6 et les</text>
<text x="55" y="134" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.8" font-weight="bold">trois chiffres sont différents.</text>
<circle cx="80" cy="240" r="17" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="80" y="245" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="12" font-weight="bold">1</text>
<text x="120" y="245" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">La somme des trois chiffres vaut 12.</text>
<circle cx="80" cy="330" r="17" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="80" y="335" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="12" font-weight="bold">2</text>
<text x="120" y="335" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">Le premier chiffre vaut le double du dernier.</text>
<circle cx="80" cy="420" r="17" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="80" y="425" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="12" font-weight="bold">3</text>
<text x="120" y="425" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">Le chiffre du milieu est plus grand que le dernier.</text>
<rect x="250" y="555" width="620" height="100" rx="12" fill="#f7f7f7" stroke="#222" stroke-width="1.3"/>
<text x="560" y="590" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">CODE</text>
<rect x="400" y="610" width="75" height="35" rx="6" fill="white" stroke="#222" stroke-width="1.3"/>
<rect x="505" y="610" width="75" height="35" rx="6" fill="white" stroke="#222" stroke-width="1.3"/>
<rect x="610" y="610" width="75" height="35" rx="6" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="55" y="710" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">Pour valider : explique pourquoi un autre code est impossible.</text>
<text x="55" y="755" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="bold">Besoin d&#x27;aide ? Demande l&#x27;indice 1 à l&#x27;animateur.</text>
</svg>