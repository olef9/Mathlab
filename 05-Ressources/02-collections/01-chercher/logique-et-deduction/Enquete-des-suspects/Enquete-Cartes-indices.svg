<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="38" y="38" font-family="Arial" font-size="25" font-weight="bold">L’enquête des suspects – Cartes-indices</text>
<text x="38" y="64" font-family="Arial" font-size="13">Découper les cartes puis les répartir dans les enveloppes A, B et C.</text>
<rect x="38" y="88" width="245" height="310" rx="12" fill="white" stroke="#222" stroke-width="2" stroke-dasharray="8 5"/>
<text x="160.5" y="131" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">INDICE 1</text>
<circle cx="160.5" cy="203" r="42" fill="white" stroke="#222" stroke-width="2"/>
<text x="160.5" y="216" text-anchor="middle" font-family="Arial" font-size="35" font-weight="bold">1</text>
<text x="160.5" y="293" text-anchor="middle" font-family="Arial" font-size="16">Amina est passée</text>
<text x="160.5" y="321" text-anchor="middle" font-family="Arial" font-size="16">avant Bilal.</text>
<text x="160.5" y="375" text-anchor="middle" font-family="Arial" font-size="13">Enveloppe C</text>
<rect x="308" y="88" width="245" height="310" rx="12" fill="white" stroke="#222" stroke-width="2" stroke-dasharray="8 5"/>
<text x="430.5" y="131" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">INDICE 2</text>
<circle cx="430.5" cy="203" r="42" fill="white" stroke="#222" stroke-width="2"/>
<text x="430.5" y="216" text-anchor="middle" font-family="Arial" font-size="35" font-weight="bold">2</text>
<text x="430.5" y="293" text-anchor="middle" font-family="Arial" font-size="16">La clé a été utilisée</text>
<text x="430.5" y="321" text-anchor="middle" font-family="Arial" font-size="16">à 14 h 30.</text>
<text x="430.5" y="375" text-anchor="middle" font-family="Arial" font-size="13">Enveloppe A</text>
<rect x="578" y="88" width="245" height="310" rx="12" fill="white" stroke="#222" stroke-width="2" stroke-dasharray="8 5"/>
<text x="700.5" y="131" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">INDICE 3</text>
<circle cx="700.5" cy="203" r="42" fill="white" stroke="#222" stroke-width="2"/>
<text x="700.5" y="216" text-anchor="middle" font-family="Arial" font-size="35" font-weight="bold">3</text>
<text x="700.5" y="293" text-anchor="middle" font-family="Arial" font-size="16">Diego est passé</text>
<text x="700.5" y="321" text-anchor="middle" font-family="Arial" font-size="16">à 14 h 45.</text>
<text x="700.5" y="375" text-anchor="middle" font-family="Arial" font-size="13">Enveloppe A</text>
<rect x="848" y="88" width="245" height="310" rx="12" fill="white" stroke="#222" stroke-width="2" stroke-dasharray="8 5"/>
<text x="970.5" y="131" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">INDICE 4</text>
<circle cx="970.5" cy="203" r="42" fill="white" stroke="#222" stroke-width="2"/>
<text x="970.5" y="216" text-anchor="middle" font-family="Arial" font-size="35" font-weight="bold">4</text>
<text x="970.5" y="293" text-anchor="middle" font-family="Arial" font-size="16">La personne de la salle</text>
<text x="970.5" y="321" text-anchor="middle" font-family="Arial" font-size="16">informatique avait la lampe.</text>
<text x="970.5" y="375" text-anchor="middle" font-family="Arial" font-size="13">Enveloppe B</text>
<rect x="38" y="423" width="245" height="310" rx="12" fill="white" stroke="#222" stroke-width="2" stroke-dasharray="8 5"/>
<text x="160.5" y="466" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">INDICE 5</text>
<circle cx="160.5" cy="538" r="42" fill="white" stroke="#222" stroke-width="2"/>
<text x="160.5" y="551" text-anchor="middle" font-family="Arial" font-size="35" font-weight="bold">5</text>
<text x="160.5" y="628" text-anchor="middle" font-family="Arial" font-size="16">La personne de la</text>
<text x="160.5" y="656" text-anchor="middle" font-family="Arial" font-size="16">bibliothèque avait le badge.</text>
<text x="160.5" y="710" text-anchor="middle" font-family="Arial" font-size="13">Enveloppe A</text>
<rect x="308" y="423" width="245" height="310" rx="12" fill="white" stroke="#222" stroke-width="2" stroke-dasharray="8 5"/>
<text x="430.5" y="466" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">INDICE 6</text>
<circle cx="430.5" cy="538" r="42" fill="white" stroke="#222" stroke-width="2"/>
<text x="430.5" y="551" text-anchor="middle" font-family="Arial" font-size="35" font-weight="bold">6</text>
<text x="430.5" y="628" text-anchor="middle" font-family="Arial" font-size="16">Bilal n’avait ni la clé</text>
<text x="430.5" y="656" text-anchor="middle" font-family="Arial" font-size="16">ni le badge.</text>
<text x="430.5" y="710" text-anchor="middle" font-family="Arial" font-size="13">Enveloppe B</text>
<rect x="578" y="423" width="245" height="310" rx="12" fill="white" stroke="#222" stroke-width="2" stroke-dasharray="8 5"/>
<text x="700.5" y="466" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">INDICE 7</text>
<circle cx="700.5" cy="538" r="42" fill="white" stroke="#222" stroke-width="2"/>
<text x="700.5" y="551" text-anchor="middle" font-family="Arial" font-size="35" font-weight="bold">7</text>
<text x="700.5" y="628" text-anchor="middle" font-family="Arial" font-size="16">Le laboratoire a été visité</text>
<text x="700.5" y="656" text-anchor="middle" font-family="Arial" font-size="16">juste après la salle informatique.</text>
<text x="700.5" y="710" text-anchor="middle" font-family="Arial" font-size="13">Enveloppe C</text>
<rect x="848" y="423" width="245" height="310" rx="12" fill="white" stroke="#222" stroke-width="2" stroke-dasharray="8 5"/>
<text x="970.5" y="466" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">INDICE 8</text>
<circle cx="970.5" cy="538" r="42" fill="white" stroke="#222" stroke-width="2"/>
<text x="970.5" y="551" text-anchor="middle" font-family="Arial" font-size="35" font-weight="bold">8</text>
<text x="970.5" y="628" text-anchor="middle" font-family="Arial" font-size="16">Diego n’était pas</text>
<text x="970.5" y="656" text-anchor="middle" font-family="Arial" font-size="16">à la bibliothèque.</text>
<text x="970.5" y="710" text-anchor="middle" font-family="Arial" font-size="13">Enveloppe B</text>
</svg>