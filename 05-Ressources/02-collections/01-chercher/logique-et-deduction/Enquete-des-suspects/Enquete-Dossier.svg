<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="42" font-family="Arial" font-size="29" font-weight="bold">Dossier 23 – Le trophée déplacé</text>
<text x="40" y="72" font-family="Arial" font-size="15">Quatre personnes, quatre lieux, quatre objets et quatre horaires. Une seule organisation est possible.</text>
<rect x="40" y="105" width="1040" height="105" rx="12" fill="white" stroke="#333" stroke-width="2"/>
<text x="65" y="140" font-family="Arial" font-size="18" font-weight="bold">L’affaire</text>
<text x="65" y="173" font-family="Arial" font-size="15">La vitrine du trophée a été ouverte dans le laboratoire à 14 h 30.</text>
<text x="65" y="198" font-family="Arial" font-size="15">La personne responsable devait être dans ce lieu, posséder la clé et être présente à cet horaire.</text>
<rect x="55" y="250" width="220" height="185" rx="12" fill="white" stroke="#444" stroke-width="1.8"/>
<circle cx="165" cy="320" r="48" fill="white" stroke="#222" stroke-width="2.5"/>
<text x="165" y="337" text-anchor="middle" font-family="Arial" font-size="48" font-weight="bold">A</text>
<text x="165" y="400" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">Amina</text>
<rect x="320" y="250" width="220" height="185" rx="12" fill="white" stroke="#444" stroke-width="1.8"/>
<circle cx="430" cy="320" r="48" fill="white" stroke="#222" stroke-width="2.5"/>
<text x="430" y="337" text-anchor="middle" font-family="Arial" font-size="48" font-weight="bold">B</text>
<text x="430" y="400" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">Bilal</text>
<rect x="585" y="250" width="220" height="185" rx="12" fill="white" stroke="#444" stroke-width="1.8"/>
<circle cx="695" cy="320" r="48" fill="white" stroke="#222" stroke-width="2.5"/>
<text x="695" y="337" text-anchor="middle" font-family="Arial" font-size="48" font-weight="bold">C</text>
<text x="695" y="400" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">Chloé</text>
<rect x="850" y="250" width="220" height="185" rx="12" fill="white" stroke="#444" stroke-width="1.8"/>
<circle cx="960" cy="320" r="48" fill="white" stroke="#222" stroke-width="2.5"/>
<text x="960" y="337" text-anchor="middle" font-family="Arial" font-size="48" font-weight="bold">D</text>
<text x="960" y="400" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">Diego</text>
<rect x="55" y="485" width="320" height="230" rx="12" fill="white" stroke="#444" stroke-width="1.6"/>
<text x="75" y="520" font-family="Arial" font-size="19" font-weight="bold">LIEUX</text>
<text x="83" y="560" font-family="Arial" font-size="16">• bibliothèque</text>
<text x="83" y="596" font-family="Arial" font-size="16">• salle informatique</text>
<text x="83" y="632" font-family="Arial" font-size="16">• laboratoire</text>
<text x="83" y="668" font-family="Arial" font-size="16">• atelier</text>
<rect x="410" y="485" width="320" height="230" rx="12" fill="white" stroke="#444" stroke-width="1.6"/>
<text x="430" y="520" font-family="Arial" font-size="19" font-weight="bold">OBJETS</text>
<text x="438" y="560" font-family="Arial" font-size="16">• badge</text>
<text x="438" y="596" font-family="Arial" font-size="16">• lampe</text>
<text x="438" y="632" font-family="Arial" font-size="16">• clé</text>
<text x="438" y="668" font-family="Arial" font-size="16">• carnet</text>
<rect x="765" y="485" width="320" height="230" rx="12" fill="white" stroke="#444" stroke-width="1.6"/>
<text x="785" y="520" font-family="Arial" font-size="19" font-weight="bold">HORAIRES</text>
<text x="793" y="560" font-family="Arial" font-size="16">• 14 h 00</text>
<text x="793" y="596" font-family="Arial" font-size="16">• 14 h 15</text>
<text x="793" y="632" font-family="Arial" font-size="16">• 14 h 30</text>
<text x="793" y="668" font-family="Arial" font-size="16">• 14 h 45</text>
<text x="55" y="760" font-family="Arial" font-size="14">Chaque personne possède un seul lieu, un seul objet et un seul horaire.</text>
</svg>