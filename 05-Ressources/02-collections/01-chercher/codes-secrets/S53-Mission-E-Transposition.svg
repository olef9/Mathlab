<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="35" y="38" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="25.5" font-weight="bold">S53 – Équipe E – Transposition en 4 colonnes</text>
<rect x="35" y="75" width="1053" height="95" rx="12" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="55" y="105" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">RÈGLE</text>
<text x="150" y="105" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="bold">Le message a été écrit dans un rectangle de 4 colonnes, puis lu colonne par colonne. Pour</text>
<text x="150" y="123" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.2" font-weight="bold">décoder, reconstruis d’abord le rectangle.</text>
<rect x="35" y="195" width="1053" height="92" rx="12" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="55" y="225" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.2" font-weight="bold">EXEMPLE À RÉUSSIR AVANT DE COMMENCER</text>
<text x="410" y="225" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">BOOUNRJX  →  BONJOURX</text>
<text x="55" y="270" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold">Décodage :</text>
<text x="155" y="270" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold">20 lettres ÷ 4 colonnes = 5 lettres par colonne</text>
<rect x="35" y="310" width="1053" height="90" rx="12" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="55" y="340" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">MESSAGE À DÉCODER</text>
<text x="55" y="375" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">CUEFNIICFENEHRUQMIEF</text>
<rect x="35" y="425" width="650" height="250" rx="12" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="360" y="455" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">TRAVAIL À FAIRE DANS L’ORDRE</text>
<circle cx="65" cy="490" r="12" fill="white" stroke="#222" stroke-width="1.0"/>
<text x="65" y="495" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="bold">1</text>
<text x="90" y="482" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.2" font-weight="normal">Compte les lettres du message : il y en a 20.</text>
<circle cx="65" cy="524" r="12" fill="white" stroke="#222" stroke-width="1.0"/>
<text x="65" y="529" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="bold">2</text>
<text x="90" y="516" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.2" font-weight="normal">Calcule 20 ÷ 4 : chaque colonne contient 5 lettres.</text>
<circle cx="65" cy="558" r="12" fill="white" stroke="#222" stroke-width="1.0"/>
<text x="65" y="563" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="bold">3</text>
<text x="90" y="550" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.2" font-weight="normal">Écris les 5 premières lettres dans la colonne 1, de haut</text>
<text x="90" y="566" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.2" font-weight="normal">en bas.</text>
<circle cx="65" cy="592" r="12" fill="white" stroke="#222" stroke-width="1.0"/>
<text x="65" y="597" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="bold">4</text>
<text x="90" y="584" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.2" font-weight="normal">Fais la même chose avec les colonnes 2, 3 et 4.</text>
<circle cx="65" cy="626" r="12" fill="white" stroke="#222" stroke-width="1.0"/>
<text x="65" y="631" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="bold">5</text>
<text x="90" y="618" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.2" font-weight="normal">Lis ensuite le rectangle ligne par ligne.</text>
<circle cx="65" cy="660" r="12" fill="white" stroke="#222" stroke-width="1.0"/>
<text x="65" y="665" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="bold">6</text>
<text x="90" y="652" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.2" font-weight="normal">Repère le chiffre dans la phrase obtenue.</text>
<rect x="715" y="425" width="373" height="250" rx="12" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="901" y="455" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">VÉRIFICATION</text>
<text x="745" y="500" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="bold">Mot test codé :</text>
<text x="745" y="530" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">MLAATBHX</text>
<text x="745" y="575" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="bold">Résultat :</text>
<line x1="825" y1="571" x2="1048" y2="571" stroke="#222" stroke-width="1"/>
<text x="745" y="615" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.2" font-weight="bold">La méthode est validée si</text>
<text x="745" y="640" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.2" font-weight="bold">ce second message fonctionne.</text>
<rect x="35" y="700" width="1053" height="55" rx="10" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
<text x="55" y="723" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">CRÉATION :</text>
<text x="170" y="723" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="bold">Choisis exactement 8 ou 12 lettres. Écris-les en lignes de 4, puis code en lisant les</text>
<text x="170" y="740" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.7" font-weight="bold">colonnes de haut en bas. Ajoute X seulement si nécessaire.</text>
<text x="40" y="782" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="bold">Ne complétez jamais une phrase « au hasard » : appliquez la règle jusqu’au dernier symbole.</text>
</svg>