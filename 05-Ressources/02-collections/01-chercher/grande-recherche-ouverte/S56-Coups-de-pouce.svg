<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="42" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" font-weight="bold">S56 – Coups de pouce</text>
<text x="40" y="72" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="normal">À distribuer seulement si une équipe est réellement bloquée.</text>
<rect x="55" y="120" width="480" height="240" rx="14" fill="#f7f7f7" stroke="#222" stroke-width="1.3"/>
<text x="80" y="162" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">1 – DÉMARRER</text>
<text x="80" y="205" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.8" font-weight="bold">Regardez le premier déplacement. Il ne peut</text>
<text x="80" y="226" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.8" font-weight="bold">valoir que 1 ou 2. Pouvez-vous séparer votre</text>
<text x="80" y="247" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.8" font-weight="bold">recherche en deux familles ?</text>
<text x="80" y="325" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold">Ne donne pas la réponse.</text>
<rect x="575" y="120" width="480" height="240" rx="14" fill="#f7f7f7" stroke="#222" stroke-width="1.3"/>
<text x="600" y="162" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">2 – ORGANISER</text>
<text x="600" y="205" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.8" font-weight="bold">Si vous avez beaucoup de chemins, rangez-les</text>
<text x="600" y="226" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.8" font-weight="bold">selon leur premier déplacement, leur dernier</text>
<text x="600" y="247" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.8" font-weight="bold">déplacement ou le nombre de « 2 » utilisés.</text>
<text x="600" y="325" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold">Ne donne pas la réponse.</text>
<rect x="55" y="420" width="480" height="240" rx="14" fill="#f7f7f7" stroke="#222" stroke-width="1.3"/>
<text x="80" y="462" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">3 – VÉRIFIER</text>
<text x="80" y="505" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.8" font-weight="bold">Prenez un chemin de votre liste. Existe-t-il une</text>
<text x="80" y="526" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.8" font-weight="bold">règle qui permet de savoir dans quelle famille</text>
<text x="80" y="547" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.8" font-weight="bold">il doit aller, sans hésitation ?</text>
<text x="80" y="625" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold">Ne donne pas la réponse.</text>
<rect x="575" y="420" width="480" height="240" rx="14" fill="#f7f7f7" stroke="#222" stroke-width="1.3"/>
<text x="600" y="462" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">4 – ALLER PLUS LOIN</text>
<text x="600" y="505" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.8" font-weight="bold">Regardez le dernier déplacement. Si le dernier</text>
<text x="600" y="526" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.8" font-weight="bold">vaut 1, de quelle marche venez-vous ? Et s’il</text>
<text x="600" y="547" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.8" font-weight="bold">vaut 2 ?</text>
<text x="600" y="625" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold">Ne donne pas la réponse.</text>
<text x="55" y="750" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold">Ordre conseillé : 1 → 2 → 3 → 4. Ne pas donner directement le coup de pouce 4.</text>
</svg>