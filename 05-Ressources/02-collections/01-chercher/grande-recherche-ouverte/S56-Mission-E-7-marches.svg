<text x="409.28571428571433" y="306.28571428571433" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="bold">7</text>
<text x="75" y="545" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">DÉPART</text>
<text x="435.00000000000006" y="268.00000000000006" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10.5" font-weight="bold">ARRIVÉE</text>
<rect x="520" y="230" width="568" height="330" rx="12" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="804" y="260" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">VOTRE TRAVAIL</text>
<text x="548" y="305" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold">1.</text>
<text x="575" y="305" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.4" font-weight="bold">Choisissez vous-mêmes une méthode de recherche.</text>
<text x="548" y="350" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold">2.</text>
<text x="575" y="350" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.4" font-weight="bold">Gardez des traces de vos essais.</text>
<text x="548" y="395" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold">3.</text>
<text x="575" y="395" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.4" font-weight="bold">Organisez les chemins pour éviter les doublons.</text>
<text x="548" y="440" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold">4.</text>
<text x="575" y="440" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.4" font-weight="bold">Écrivez un résultat provisoire.</text>
<text x="548" y="485" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold">5.</text>
<text x="575" y="485" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.4" font-weight="bold">Vérifiez votre résultat.</text>
<text x="548" y="530" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.5" font-weight="bold">6.</text>
<text x="575" y="530" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.4" font-weight="bold">Préparez une phrase expliquant pourquoi la liste</text>
<text x="575" y="547" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.4" font-weight="bold">est complète.</text>
<rect x="35" y="590" width="1053" height="130" rx="12" fill="#f7f7f7" stroke="#222" stroke-width="1.3"/>
<text x="55" y="620" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">RÉSULTAT PROVISOIRE</text>
<text x="260" y="620" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">Nous pensons qu’il y a ______ chemins.</text>
<text x="55" y="660" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="bold">CE QUI NOUS FAIT ENCORE DOUTER</text>
<line x1="330" y1="655" x2="1040" y2="655" stroke="#222" stroke-width="1"/>
<line x1="55" y1="690" x2="1040" y2="690" stroke="#222" stroke-width="1"/>
<text x="40" y="770" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="12.8" font-weight="bold">Vous n’êtes pas notés sur la méthode choisie, mais sur la qualité de la recherche et de la justification.</text>
</svg>