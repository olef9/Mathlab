<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="35" y="40" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="26" font-weight="bold">S56 – Équipe E – Escalier de 7 marches</text>
<text x="35" y="70" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">À chaque déplacement : avancer de 1 marche OU de 2 marches.</text>
<rect x="35" y="100" width="1053" height="105" rx="12" fill="#f4f4f4" stroke="#222" stroke-width="1.3"/>
<text x="55" y="133" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.5" font-weight="bold">QUESTION</text>
<text x="175" y="133" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.3" font-weight="bold">Combien existe-t-il de chemins différents pour arriver exactement en haut d’un</text>
<text x="175" y="153" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14.3" font-weight="bold">escalier de 7 marches ?</text>
<text x="55" y="180" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="bold">Important :</text>
<text x="175" y="180" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="13" font-weight="bold">l’ordre compte et un chemin ne doit jamais dépasser la marche d’arrivée.</text>
<rect x="35" y="230" width="455" height="330" rx="12" fill="white" stroke="#222" stroke-width="1.3"/>
<text x="262" y="260" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="bold">VOTRE ESCALIER</text>
<line x1="65" y1="520" x2="450.0" y2="520" stroke="#222" stroke-width="1.0"/>
<line x1="75" y1="520" x2="126.42857142857143" y2="520" stroke="#222" stroke-width="1.6"/>
