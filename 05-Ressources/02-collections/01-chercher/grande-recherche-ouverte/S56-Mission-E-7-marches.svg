<line x1="280.7142857142857" y1="382.8571428571429" x2="332.14285714285717" y2="382.8571428571429" stroke="#222" stroke-width="1.6"/>
<line x1="332.14285714285717" y1="382.8571428571429" x2="332.14285714285717" y2="348.5714285714286" stroke="#222" stroke-width="1.6"/>
