<text x="203.57142857142856" y="443.42857142857144" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="bold">3</text>
<line x1="229.28571428571428" y1="417.14285714285717" x2="280.7142857142857" y2="417.14285714285717" stroke="#222" stroke-width="1.6"/>
