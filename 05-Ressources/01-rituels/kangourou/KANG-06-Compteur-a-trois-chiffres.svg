<text x="45" y="45" text-anchor="start" font-family="Arial" font-size="28" font-weight="bold">KANG-06 – Le compteur à trois chiffres</text>
<text x="45" y="78" text-anchor="start" font-family="Arial" font-size="15" font-weight="normal">Le compteur n’utilise que 0, 1 et 2.</text>
<text x="560" y="125" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">0  →  1  →  2  →  10  →  11  →  12  →  20  →  21  →  22  →  100</text>
