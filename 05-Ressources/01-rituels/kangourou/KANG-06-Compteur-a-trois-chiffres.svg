<text x="55" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="start" fill="#111">KANG-06 - Le compteur a trois chiffres</text>
<text x="1340" y="68" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end" fill="#111">RITUEL - 5 MIN</text>
<line x1="55" y1="95" x2="1345" y2="95" stroke="#222" stroke-width="2"/>
<rect x="55" y="125" width="1290" height="94" rx="16" fill="#f4f4f4" stroke="#444" stroke-width="1.5"/>
<text x="75" y="163" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#111">Compteur</text>
<text x="80" y="200" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#111">0, 1, 2, 10, 11, 12, 20, 21, 22, 100 ...</text>
<rect x="55" y="237" width="1290" height="162" rx="16" fill="#f4f4f4" stroke="#444" stroke-width="1.5"/>
<text x="75" y="275" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#111">Questions</text>
<text x="80" y="312" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#111">1. Apres 12 ?      2. Apres 22 ?      3. Avant 100 ?      4. Apres 122 ?</text>
<text x="80" y="343" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#111">5. Combien d'ecritures a deux chiffres de 00 a 22 ?</text>
<text x="80" y="374" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#111">6. Valeur de 10 ?      7. Valeur de 100 ?      8. Ecrire 14.</text>
