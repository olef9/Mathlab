<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="40" text-anchor="start" font-family="Arial" font-size="28" font-weight="bold">KANG-07 – Le rectangle plié</text>
<text x="40" y="70" text-anchor="start" font-family="Arial" font-size="16" font-weight="normal">Rectangle initial : 20 cm × 14 cm</text>
<rect x="80" y="150" width="520" height="364" rx="0" fill="white" stroke="#222" stroke-width="2.5"/>
<line x1="340" y1="150" x2="340" y2="514" stroke="#222" stroke-width="2" stroke-dasharray="12 8"/>
<text x="340" y="545" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">pli</text>
<rect x="680" y="150" width="350" height="364" rx="12" fill="white" stroke="#222" stroke-width="1.6"/>
<text x="855" y="195" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">QUESTIONS</text>
<text x="710" y="250" text-anchor="start" font-family="Arial" font-size="15" font-weight="bold">1. Dimensions après pliage :</text>
<line x1="710" y1="285" x2="1000" y2="285" stroke="#222" stroke-width="1"/>
<text x="710" y="345" text-anchor="start" font-family="Arial" font-size="15" font-weight="bold">2. Aire visible :</text>
<line x1="710" y1="380" x2="1000" y2="380" stroke="#222" stroke-width="1"/>
<text x="710" y="440" text-anchor="start" font-family="Arial" font-size="15" font-weight="bold">3. Aire totale du papier :</text>
<line x1="710" y1="475" x2="1000" y2="475" stroke="#222" stroke-width="1"/>
<text x="80" y="620" text-anchor="start" font-family="Arial" font-size="17" font-weight="bold">Le pliage superpose deux moitiés : il ne supprime aucune partie du papier.</text>
</svg>