<text x="560" y="155" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="bold">A + B + C = 36 jetons</text>
<text x="560" y="195" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="bold">B contient 4 jetons de plus que A · C contient deux fois autant que A</text>
<rect x="120" y="290" width="245" height="175" rx="12" fill="white" stroke="#222" stroke-width="2"/>
<text x="242" y="335" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="bold">BOÎTE A</text>
<text x="242" y="390" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="bold">quantité inconnue</text>
<text x="242" y="435" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="normal">______ jetons</text>
<rect x="430" y="290" width="245" height="175" rx="12" fill="white" stroke="#222" stroke-width="2"/>
<text x="552" y="335" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="bold">BOÎTE B</text>
<text x="552" y="390" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="bold">A + 4</text>
<text x="552" y="435" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="normal">______ jetons</text>
<rect x="740" y="290" width="245" height="175" rx="12" fill="white" stroke="#222" stroke-width="2"/>
<text x="862" y="335" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="bold">BOÎTE C</text>
<text x="862" y="390" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="bold">2 × A</text>
<text x="862" y="435" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="normal">______ jetons</text>
<text x="55" y="535" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="bold">Recherche ou essais :</text>
