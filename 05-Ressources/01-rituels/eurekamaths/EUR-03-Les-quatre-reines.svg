<text x="55" y="55" font-family="Arial" font-size="30" font-weight="bold">EUR-03 – Les quatre reines</text>
<text x="55" y="93" font-family="Arial" font-size="17">Place quatre reines pour qu’aucune ne puisse en capturer une autre.</text>
<text x="55" y="123" font-family="Arial" font-size="15">Une reine attaque sa ligne, sa colonne et ses diagonales.</text>
