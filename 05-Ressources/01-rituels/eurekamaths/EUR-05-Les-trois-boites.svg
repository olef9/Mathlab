<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<rect width="100%" height="100%" fill="white"/>
<text x="45" y="48" font-family="Arial" font-size="30" font-weight="bold">EUR-05 – Les trois boîtes</text>
<text x="45" y="82" font-family="Arial" font-size="16">Une clé est cachée dans une boîte. Une seule des trois phrases est vraie.</text>
<rect x="70" y="165" width="285" height="330" rx="12" fill="white" stroke="#222" stroke-width="3"/>
<rect x="160" y="123" width="105" height="52" rx="8" fill="white" stroke="#222" stroke-width="3"/>
<text x="212" y="157" text-anchor="middle" font-family="Arial" font-size="23" font-weight="bold">BOÎTE A</text>
<circle cx="212" cy="280" r="48" fill="white" stroke="#222" stroke-width="3"/>
<text x="212" y="297" text-anchor="middle" font-family="Arial" font-size="50" font-weight="bold">A</text>
<text x="212" y="395" text-anchor="middle" font-family="Arial" font-size="19">La clé n’est</text>
<text x="212" y="428" text-anchor="middle" font-family="Arial" font-size="19">pas ici.</text>
<rect x="420" y="165" width="285" height="330" rx="12" fill="white" stroke="#222" stroke-width="3"/>
<rect x="510" y="123" width="105" height="52" rx="8" fill="white" stroke="#222" stroke-width="3"/>
<text x="562" y="157" text-anchor="middle" font-family="Arial" font-size="23" font-weight="bold">BOÎTE B</text>
<circle cx="562" cy="280" r="48" fill="white" stroke="#222" stroke-width="3"/>
<text x="562" y="297" text-anchor="middle" font-family="Arial" font-size="50" font-weight="bold">B</text>
<text x="562" y="395" text-anchor="middle" font-family="Arial" font-size="19">La clé est dans</text>
<text x="562" y="428" text-anchor="middle" font-family="Arial" font-size="19">la boîte A.</text>
<rect x="770" y="165" width="285" height="330" rx="12" fill="white" stroke="#222" stroke-width="3"/>
<rect x="860" y="123" width="105" height="52" rx="8" fill="white" stroke="#222" stroke-width="3"/>
<text x="912" y="157" text-anchor="middle" font-family="Arial" font-size="23" font-weight="bold">BOÎTE C</text>
<circle cx="912" cy="280" r="48" fill="white" stroke="#222" stroke-width="3"/>
<text x="912" y="297" text-anchor="middle" font-family="Arial" font-size="50" font-weight="bold">C</text>
<text x="912" y="395" text-anchor="middle" font-family="Arial" font-size="19">La clé n’est pas</text>
<text x="912" y="428" text-anchor="middle" font-family="Arial" font-size="19">dans la boîte B.</text>
<text x="70" y="570" font-family="Arial" font-size="19" font-weight="bold">La clé se trouve dans la boîte : ______</text>
<text x="70" y="620" font-family="Arial" font-size="16">Hypothèse testée : __________________________________________________________</text>
<text x="70" y="660" font-family="Arial" font-size="16">Nombre de phrases vraies : _________________________________________________</text>
<text x="70" y="720" font-family="Arial" font-size="15">Conseil : tester successivement A, B puis C.</text>
</svg>