<text x="85" y="185" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal">• Le chiffre des centaines est pair.</text>
<text x="85" y="219" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal">• Le chiffre des unités vaut 3 de plus que celui des centaines.</text>
<text x="85" y="253" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal">• La somme des trois chiffres vaut 12.</text>
<text x="85" y="287" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal">• Le chiffre des dizaines est impair.</text>
<text x="85" y="321" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="14" font-weight="normal">• Le code est supérieur à 400.</text>
