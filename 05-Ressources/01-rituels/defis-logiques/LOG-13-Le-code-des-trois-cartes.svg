<text x="90" y="450" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="11" font-weight="bold">3</text>
<text x="125" y="450" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="bold">Le dernier chiffre est la moitié du chiffre du milieu.</text>
